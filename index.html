compra. O integral concentra mais resíduos do que o refinado.","Biológico não quer dizer saudável: batatas fritas, bolachas ou cremes de barrar biológicos têm o mesmo açúcar, sal e gorduras. Mais vale comê-los menos vezes.","Prefira o vidro às latas envernizadas e às embalagens de plástico aquecidas, sobretudo para alimentos gordos ou ácidos.","Produtos animais: os resíduos fixam-se na gordura. A carne magra e o leite magro convencionais são menos problemáticos do que a manteiga, os queijos gordos ou a charcutaria.","Uma fruta convencional bem lavada continua a ser muito melhor para a saúde do que nenhuma fruta."],"foot":"Classificação indicativa, inspirada nas análises de resíduos de pesticidas publicadas todos os anos (nomeadamente a classificação do Environmental Working Group, baseada em dados norte-americanos) e nos controlos europeus. Os resíduos variam conforme a origem, a época e o produtor, e ficam quase sempre abaixo dos limites legais. Comprar local e da época também reduz alguns tratamentos pós-colheita. Na Suíça, o selo Bio Suisse é um dos mais exigentes.","items":"Morango|Entre os frutos mais frequentemente contaminados, com vários resíduos por amostra. Casca fina, impossível de descascar.|Lave antes de tirar o pé, senão a água entra no fruto. São frágeis: 2–3 minutos de molho bastam.|\nUva|A vinha é uma das culturas mais tratadas, e a uva come-se com a casca.|Separe os bagos do cacho antes do molho para que a água chegue a todo o lado.|\nPêssego e nectarina|Fruto frágil e muito tratado; a pele aveludada do pêssego retém os resíduos.|Se não for biológico, descascar continua a ser o mais eficaz.|\nMaçã|Um dos frutos que mais tratamentos recebe por estação em pomares convencionais.|O molho em bicarbonato de 12–15 minutos é o método mais estudado na maçã. Os resíduos já entrados na polpa não saem.|\nPera|Resíduos frequentes, comparável à maçã.|Mesmo método que para a maçã.|\nCereja|Resíduos frequentes; come-se inteira com a casca.|Mantenha o pé durante a lavagem para evitar que a água entre no fruto.|\nMirtilo|Pequenos frutos de casca fina, comidos inteiros; resíduos regulares.|Os mirtilos biológicos congelados são muitas vezes mais baratos do que os frescos.|\nFramboesa|Sem casca protetora e com polpa esponjosa que absorve os fungicidas.|Não as deixe de molho: encharcam-se e desfazem-se.|\nAmora|Sem casca protetora e com polpa esponjosa, comida inteira.|As amoras silvestres, apanhadas longe das estradas, são uma excelente opção.|\nGroselha e cassis|Pequenos frutos comidos inteiros, resíduos regulares.|Retire os bagos do cacho depois de lavar, não antes.|\nDamasco|Fruto de caroço muitas vezes tratado, casca consumida.|Mesma lógica do pêssego, com um pouco menos de resíduos em média.|alperce\nAmeixa|Tratada contra insetos até pouco antes da colheita, e comida com a casca.|A película branca na casca é natural, não é um resíduo.|\nRuibarbo|Talos expostos, resíduos moderados.|Retirar os fios do talo elimina também boa parte dos resíduos.|\nLimão e lima|A polpa está pouco exposta, mas a casca recebe muitas vezes fungicidas e cera após a colheita.|Para a raspa: biológico ou «não tratado após a colheita». Só para sumo, o convencional serve.|citrinos\nLaranja, clementina, toranja|Casca tratada após a colheita (fungicidas, cera), polpa pouco exposta.|Lave as mãos depois de descascar, sobretudo antes de dar gomos às crianças.|citrinos tangerina\nBanana|Casca grossa retirada; a polpa está muito pouco exposta.|Aqui o biológico importa sobretudo pelo ambiente e pelos trabalhadores das plantações.|\nAbacate|Casca grossa não consumida; um dos frutos menos contaminados.|Passe-o por água mesmo assim antes de cortar: a faca arrasta os resíduos para a polpa.|\nAnanás|Casca grossa retirada; a polpa está muito pouco exposta.|Passe a casca por água antes de cortar.|abacaxi\nManga|Casca grossa não consumida.|Pelo ambiente, prefira mangas transportadas de barco em vez de avião.|\nKiwi|Poucos resíduos; a casca é geralmente retirada.|Se comer a casca, escove-o primeiro.|\nMelão|Casca grossa; a polpa está pouco exposta.|Lave a casca antes de cortar: a faca atravessa a superfície.|\nMelancia|Casca grossa; entre os frutos menos contaminados.|Mesma precaução que para o melão.|\nFigo fresco|Em geral pouco tratado.|Frágil: lave-o mesmo antes de comer.|\nRomã|Casca grossa não consumida.|Debulhe-a numa taça com água: os bagos afundam, a casca flutua.|\nLíchia e papaia|Casca não consumida, poucos resíduos na polpa.|Passe por água antes de abrir.|mamão\nEspinafres|Folhas grandes muito expostas aos tratamentos; resíduos frequentes e múltiplos.|Os espinafres biológicos congelados são uma alternativa económica.|\nCouve kale|Folhas frisadas que retêm resíduos; muitas vezes vários pesticidas detetados.|Retire os talos centrais grossos, mais difíceis de limpar.|kale\nPimento e malagueta|Resíduos frequentes, em especial em produtos importados fora de época.|Assados no forno e depois pelados, perdem quase toda a pele.|pimenta\nFeijão-verde|Resíduos frequentes, por vezes várias substâncias por amostra.|A cozedura não destrói os pesticidas: lave antes de cortar as pontas.|vagem\nAipo|Os talos estriados conduzem e retêm a água dos tratamentos; come-se muitas vezes cru.|Retire os fios exteriores e a base, mais carregados.|salsão\nTomate|Resíduos regulares, mas casca lisa que se lava bem.|Da época e cultivado ao ar livre, é em geral menos tratado.|\nAlface|Superfície máxima de folhas exposta às pulverizações, sobretudo alfaces de estufa no inverno.|Uma centrifugadora de salada ajuda a lavar bem sem estragar as folhas.|salada\nRúcula e alface-de-cordeiro|Rebentos jovens muito expostos, comidos crus.|Mesmo «pronta a comer», passar por água não faz mal.|canónigos\nPepino|Os resíduos ficam na casca; a polpa é saudável depois de descascado.|Descascado, um pepino convencional serve perfeitamente.|\nCurgete|Resíduos concentrados na casca fina, que em geral se come.|Descascada, ou após um molho em bicarbonato, uma curgete convencional serve.|abobrinha courgette\nBeringela|Resíduos concentrados na casca; a polpa é saudável depois de descascada.|Descasca-se facilmente depois de grelhada.|berinjela\nRabanete|Raiz em contacto com o solo, comida crua com a casca.|Retire as folhas e a ponta.|\nBatata|Resíduos sobretudo na casca.|Não coma as partes verdes ou germinadas, biológica ou não.|\nBrócolos|Poucos resíduos em média.|Mergulhe-os de cabeça para baixo alguns minutos para soltar insetos e sujidade.|brócolis\nCouve-flor|As folhas protegem a cabeça; poucos resíduos.|Mesmo truque que para os brócolos.|\nCouve e couves-de-bruxelas|As folhas exteriores protegem o coração.|Basta retirar duas ou três folhas exteriores.|repolho\nCenoura|Resíduos baixos, concentrados na casca.|Uma cenoura nova bem escovada não precisa de ser descascada.|\nBeterraba|Pouco tratada, casca retirada após a cozedura.|Cozida com casca conserva melhor a cor.|\nNabo, pastinaca, aipo-rábano|Raízes descascadas, poucos resíduos.|Descasque fino para guardar a polpa.|\nAbóbora|Casca grossa, poucos resíduos.|A abóbora hokkaido come-se com casca: escove-a bem.|\nAlho-francês|Poucos resíduos, mas terra entre as folhas.|Corte-o ao comprido e lave entre as folhas.|alho-poró\nEndívia|Cultivada no escuro, pouco tratada.|Não a deixe de molho: fica amarga.|\nFuncho|As camadas estriadas retêm a água dos tratamentos.|Retire a camada exterior, mais exposta.|erva-doce\nAlcachofra|Brácteas protetoras, coração pouco exposto.|Passe-a por água de cabeça para baixo.|\nAcelgas|Folhas grandes muito expostas às pulverizações.|Lave separadamente os talos e as folhas.|\nCebola e chalota|As camadas exteriores protegem a parte comestível.|Basta retirar a primeira camada carnuda além da pele.|\nAlho|Poucos resíduos; prefira origem europeia.|O alho importado de longe é por vezes tratado contra a germinação.|\nGengibre|Poucos resíduos, sobretudo descascado.|Uma colher de chá raspa a casca sem desperdício.|\nCogumelos|Os cogumelos-de-paris crescem em ambiente fechado, sem pulverizações.|Corte a ponta terrosa do pé.|champignon\nEspargos|Pouco tratados em média.|Descasque os espargos brancos de cima para baixo.|aspargos\nMilho doce|As folhas que envolvem a maçaroca protegem-na.|Retire as folhas e os fios mesmo antes de cozinhar.|\nBatata-doce|Poucos resíduos, sobretudo na casca.|Bem escovada, pode ser cozinhada com casca.|\nErvilhas|A vagem protege as ervilhas; resíduos raros.|As ervilhas congeladas convencionais são uma ótima escolha.|\nArroz branco basmati e tailandês (jasmim)|O polimento elimina grande parte dos resíduos. Mas os controlos oficiais, na Suíça como na UE, encontram regularmente nos arrozes importados da Ásia pesticidas aqui proibidos; o arroz biológico tem resultados claramente melhores.|O biológico resolve a questão dos pesticidas, não a do arsénio: cozer em muita água continua a ser útil.|basmati jasmim\nArroz integral, vermelho ou preto|A película conservada acumula resíduos de pesticidas e concentra mais arsénio.|Compre-o biológico e alterne com outros cereais.|\nArroz branco europeu (carolino, risotto, Camargue)|Cultivado segundo as regras europeias, tem poucos resíduos. O arsénio, porém, afeta todos os arrozes, biológicos ou não.|Para o risotto não se lava: basta variar os cereais ao longo da semana.|arborio\nFlocos de aveia e muesli|Comidos como grão inteiro. Encontram-se frequentemente resíduos de reguladores de crescimento (clormequato) em produtos de aveia convencional, sobretudo da América do Norte, onde a aveia é também por vezes seca quimicamente antes da colheita, uma prática proibida na Suíça.|Para as crianças que os comem todos os dias, é uma das compras biológicas mais úteis.|aveia papas granola\nMassa integral e semi-integral|O farelo conservado acumula reguladores de crescimento e fungicidas do trigo.|O integral tem verdadeiras vantagens nutricionais: é precisamente aí que o biológico vale a pena.|esparguete penne\nMassa branca|A moagem retira o farelo e o gérmen, onde está a maior parte dos resíduos.|Na Suíça, tratar os cereais com glifosato pouco antes da colheita é proibido, o que não acontece em todos os países exportadores: prefira trigo de origem suíça ou europeia.|esparguete macarrão lasanha\nPão e farinha integrais|Tal como na massa integral, o farelo concentra os resíduos.|Um pão biológico de massa-mãe é um excelente compromisso entre sabor, digestão e resíduos.|centeio espelta\nPão branco e farinha branca|Só se usa o coração do grão: muito menos resíduos do que o integral.|O pão industrial contém muitas vezes mais aditivos do que o da padaria.|farinha\nSêmola, cuscuz e bulgur|De trigo duro refinado; mesmas questões que a massa branca.|As versões integrais, essas, valem a pena em biológico.|\nQuinoa e trigo-sarraceno|Plantas rústicas, pouco tratadas; a quinoa é protegida por saponinas amargas.|Lave-a bem antes de cozinhar para tirar o amargor.|\nPolenta e milho|O milho convencional é tratado, e o biológico garante ausência de OGM.|Prefira uma polenta de origem europeia.|\nCereais de pequeno-almoço|Mistura de cereais tratados, açúcar e aditivos.|As versões biológicas têm muitas vezes menos aditivos, mas não necessariamente menos açúcar.|corn flakes\nLentilhas|Comidas com a pele, e as lentilhas importadas são por vezes secas quimicamente antes da colheita.|Existem lentilhas suíças e francesas: uma ótima alternativa.|\nGrão-de-bico|As mesmas práticas de secagem química são possíveis na importação.|Passar os de lata por água também reduz o sal.|\nFeijão seco (vermelho, branco)|O biológico evita os tratamentos químicos antes da colheita.|O feijão vermelho deve ser sempre bem cozido.|\nSoja, tofu e tempeh|O biológico garante soja sem OGM, muitas vezes de origem europeia.|Existe tofu fabricado na Suíça com soja local.|\nPassas|A secagem concentra os resíduos de um fruto já muito tratado.|Uma boa escolha biológica para os lanches das crianças.|uvas-passas\nDamascos secos|Resíduos concentrados pela secagem, muitas vezes sulfitados para manter a cor laranja.|Os damascos secos castanhos, sem sulfitos, são perfeitamente normais.|alperces secos\nTâmaras e figos secos|Em geral poucos resíduos.|Verifique que não tem xarope de glucose adicionado.|\nAmêndoas|A pele castanha retém os resíduos. Nos Estados Unidos, as amêndoas da Califórnia têm de ser pasteurizadas, a vapor ou por fumigação com óxido de propileno, um processo proibido na UE e no biológico.|Prefira amêndoas biológicas europeias (Espanha, Itália) ou, na falta delas, amêndoas sem pele.|\nAmendoins|Resíduos regulares nos amendoins convencionais.|Biológicos ou não, deite fora os que sabem a bolor.|\nNozes|A casca protege mas não é totalmente estanque; as nogueiras convencionais são tratadas contra o bichado e a mosca da noz. O miolo, rico em ómega-3, é frágil.|Nozes suíças ou francesas não tratadas após a colheita são uma ótima alternativa.|\nSementes (abóbora, girassol, linhaça, chia)|Em geral poucos resíduos.|As sementes de linhaça digerem-se melhor moídas.|\nLeite gordo|Os resíduos lipossolúveis da alimentação das vacas passam para a gordura do leite. O biológico garante ainda mais pastagem e nenhum OGM.|Na Suíça o leite convencional já é bastante regulado: o biológico é um extra, não uma urgência.|leite integral\nLeite magro e meio-gordo|O desnatamento retira a fração gorda onde os resíduos se concentram.|O biológico continua a ser uma escolha pelo bem-estar animal, não uma necessidade de saúde.|leite desnatado\nManteiga e natas|Os poluentes que se fixam nas gorduras encontram-se aqui mais do que no leite.|Uma manteiga de montanha ou biológica é uma boa escolha.|creme de leite\nQueijo|Os queijos gordos concentram resíduos lipossolúveis. Os DOP suíços já impõem regras de alimentação rigorosas.|O Gruyère e o Emmentaler DOP são feitos com leite sem silagem.|\nIogurtes e sobremesas lácteas|As versões aromatizadas têm muitas vezes aditivos, mais limitados no biológico.|Um iogurte natural com fruta fresca continua a ser a melhor opção.|\nOvos|O biológico garante ração sem pesticidas de síntese nem OGM, acesso ao ar livre e nenhum antibiótico preventivo.|Na UE, o código 0 na casca significa biológico.|\nPeito de frango e de peru|Carne magra, sem a gordura onde os resíduos se fixam; o biológico tem a ver sobretudo com o bem-estar animal.|As aves suíças são muito reguladas; desconfie sobretudo das importadas.|frango peru\nPorco|Carne gorda que acumula resíduos; criação muitas vezes intensiva no convencional.|Prefira carne suíça com um selo de bem-estar animal.|\nVaca, vitela e borrego|Os cortes gordos acumulam resíduos da alimentação. Biológico ou de pasto local.|Uma carne local de pasto vale muitas vezes tanto como uma biológica importada.|carne bovina cordeiro\nCharcutaria|Muito gorda, e os conservantes à base de nitritos são quase sistemáticos no convencional; o biológico limita-os.|O fiambre «sem nitritos» também existe no convencional.|fiambre presunto chouriço\nSalmão e truta de aquacultura|O biológico proíbe corantes sintéticos na ração e limita antibióticos e antiparasitários.|O salmão selvagem do Alasca é uma alternativa.|\nCamarão|Lotes de camarão de aquacultura importado, sobretudo da Índia e do Vietname, continuam a ser regularmente recusados na fronteira da UE por antibióticos proibidos. O risco depende sobretudo da origem.|Escolha biológico, um selo de aquacultura reconhecido ou uma origem diferente dos países regularmente sinalizados.|\nPeixe branco selvagem (bacalhau, escamudo)|Carne muito magra que acumula poucos poluentes; o biológico não existe para a pesca selvagem.|Aqui o critério certo é um selo de pesca sustentável.|bacalhau pescada escamudo\nAtum e grandes peixes|O biológico não existe para a pesca selvagem. O verdadeiro poluente é o mercúrio nos grandes predadores.|Limite o atum e o espadarte, sobretudo para grávidas e crianças.|espadarte\nBolachas e bolos|O biológico evita alguns pesticidas e aditivos, mas mantém o mesmo açúcar, gorduras e sal. Mais vale comer menos vezes do que pagar mais pelo biológico.|Uma bolacha biológica continua a ser uma bolacha ultraprocessada.|biscoitos\nChocolate|O cacau é muito tratado nos países produtores; o biológico significa também menos aditivos.|Quanto mais escuro o chocolate, mais curta a lista de ingredientes.|\nCreme de barrar de chocolate|Óleo, açúcar e avelãs de origens variadas; aditivos frequentes.|Uma pasta de avelã pura é uma alternativa simples.|\nCompota e puré de fruta|A fruta tratada conserva parte dos resíduos após a cozedura.|Para compota de morango ou cereja, o biológico vale especialmente a pena.|doce geleia\nAçúcar|A refinação elimina praticamente todos os resíduos.|O açúcar suíço vem de beterraba cultivada localmente.|\nMel|Poucos resíduos; o biológico tem a ver sobretudo com o meio envolvente das colmeias.|Um mel local é muitas vezes mais seguro do que uma mistura de méis importados.|\nBatatas fritas de pacote e snacks salgados|O biológico não muda nem o sal, nem as gorduras, nem a acrilamida da fritura.|Mais vale reduzir a frequência do que pagar mais.|aperitivos crackers\nRebuçados e guloseimas|O principal problema é o açúcar, não os pesticidas. O biológico limita alguns corantes.|Atenção aos corantes E102, E110 e E129.|doces balas\nChá|As folhas nunca são lavadas antes da infusão, e os chás convencionais contêm muitas vezes resíduos.|Para o chá verde, escolher biológico é especialmente aconselhável.|\nCafé|Os grãos são protegidos pelo fruto e a torra reduz os resíduos, mas a cultura é muito tratada.|O biológico e o comércio justo andam muitas vezes juntos.|\nInfusões e tisanas|Plantas nunca lavadas: a água quente extrai diretamente os resíduos.|As tisanas de plantas suíças são uma boa opção.|chás de ervas\nVinho|A vinha é uma das culturas mais tratadas (míldio, oídio, podridão cinzenta), muitas vezes com fungicidas sistémicos que penetram na uva. Nada é lavado nem descascado antes da vinificação: os resíduos passam para o mosto, e os controlos encontram frequentemente vestígios, em geral abaixo dos limites legais. O vinho convencional pode ainda receber muito mais aditivos e sulfitos do que o biológico.|As dores de cabeça depois de um copo nem sempre vêm dos sulfitos: o álcool e a histamina também contam. Biológico ou não, o vinho bebe-se com moderação.|\nSumo de fruta|Parte dos resíduos da fruta passa para o sumo.|Para sumo de maçã e de uva, o biológico vale a pena.|suco\nBebidas vegetais (aveia, soja, amêndoa)|Os resíduos dos cereais e da soja passam em parte para a bebida.|Para a bebida de aveia, consumida em quantidade, aconselha-se o biológico.|leite de aveia leite de soja\nRefrigerantes e bebidas açucaradas|O biológico não muda nada quanto ao açúcar, o verdadeiro problema.|Evite também as versões light: o biológico proíbe edulcorantes intensos, o convencional não.|\nCerveja|Poucos resíduos após a fabricação.|O biológico diz respeito sobretudo ao cultivo da cevada e do lúpulo.|\nÓleos virgens (azeite, colza, linhaça, noz)|Prensados a frio sem refinação, arrastam os resíduos lipossolúveis do fruto ou da semente.|O óleo de colza virgem suíço é uma ótima opção.|azeite\nÓleos refinados (girassol, fritura)|A refinação elimina os resíduos, à custa dos micronutrientes.|Reserve-os para cozinhar a altas temperaturas.|óleo de girassol\nEspeciarias e ervas secas|Resíduos frequentes nas especiarias importadas; o biológico proíbe também a irradiação.|Compre-as em pequenas quantidades: perdem o aroma.|\nMolho de tomate e ketchup|Tomates tratados e aditivos frequentes.|Um molho caseiro com tomate em lata biológico é simples.|\nCaldo em cubos|Muitas vezes rico em aditivos e intensificadores de sabor.|Os caldos biológicos são em geral sem glutamato adicionado.|\nSal, vinagre e mostarda|Poucos resíduos; o biológico traz pouco aqui.|Para a mostarda, veja a origem das sementes.|\nErvas aromáticas frescas|Tratamentos frequentes em folhas nuas, comidas cruas e pouco lavadas.|Seque-as num pano limpo para as conservar mais tempo.|salsa manjericão cebolinho coentros hortelã\nNozes-pecã|Mesma família da noz, com casca mais macia; as culturas dos EUA e do México são tratadas regularmente.|Guarde-as no frigorífico: o óleo fica rançoso depressa.|pecã\nCajus|A casca contém uma resina cáustica que protege o miolo das pulverizações, mas o descasque é um trabalho duro e muitas vezes mal protegido.|O biológico ou o comércio justo garantem melhores condições de trabalho.|castanha de caju\nAvelãs|As aveleiras convencionais recebem vários inseticidas contra o gorgulho da avelã, que perfura a casca ainda mole.|A pele castanha sai facilmente depois de torrar.|\nPistácios|A casca abre-se na árvore antes da colheita: o miolo fica exposto aos tratamentos tardios e aos bolores durante a secagem.|Deite fora os que estiverem manchados ou souberem a bolor.|\nNozes de macadâmia|Uma das cascas mais duras e espessas que existem: o miolo está quase totalmente protegido das pulverizações.|O principal risco é um eventual tratamento de conservação durante o transporte.|macadâmia\nPastas de frutos secos (amendoim, amêndoa…)|Sementes moídas inteiras com a pele; as versões convencionais têm muitas vezes óleo de palma, óleo hidrogenado ou açúcar adicionados.|Procure 100 % frutos secos, idealmente biológicos: um só ingrediente no rótulo.|manteiga de amendoim pasta de amêndoa\nDióspiro mole (à colher)|Variedades tradicionais comidas bem maduras à colher: a casca grossa e cerosa, que se deita fora, retém quase todos os resíduos. A árvore é também robusta e pouco tratada.|Passe-o por água antes de abrir e retire a polpa à colher.|caqui kaki\nDióspiro rijo (Persimon, Sharon)|Variedades estaladiças comidas com casca, que fixa os tratamentos no campo e os conservantes pós-colheita.|A adstringência é muitas vezes retirada após a colheita com CO₂ ou etanol: sem resíduos nocivos, mas mais uma razão para lavar bem a casca.|caqui kaki persimon\nDióspiro seco|A secagem concentra eventuais resíduos; os produtos industriais importados são por vezes fumigados.|O hoshigaki japonês tradicional é descascado antes de secar.|caqui kaki hoshigaki","legal":{"t":"Aviso","u":"Última atualização do conteúdo: outubro de 2026.","i":["O BioSemafor fornece informações gerais a título indicativo. Não substituem o conselho de um médico, nutricionista ou outro profissional de saúde, sobretudo durante a gravidez, para crianças pequenas ou em caso de alergia ou doença.","As classificações baseiam-se em dados públicos sobre resíduos de pesticidas, que variam conforme a origem, a época e o produtor. Não constituem uma avaliação de nenhum produto, marca ou produtor em particular.","Apesar do cuidado na sua elaboração, não garantimos a exatidão nem a exaustividade das informações, que podem mudar. A sua utilização é da sua responsabilidade, dentro dos limites previstos na lei.","Os selos e denominações citados (Bio Suisse, IP-Suisse, Demeter, DOP, etc.) pertencem aos respetivos titulares. O BioSemafor não está afiliado a nenhum deles e não é um selo de certificação.","A aplicação em si não recolhe dados pessoais: apenas a escolha do idioma é guardada no seu dispositivo."]}}};

 aus in Frankreich angebauten Zuckerrüben."],"105":[null,"Bio-Kräutertees aus französischen Pflanzen sind eine gute Wahl."],"111":[null,"Natives französisches Rapsöl ist eine sehr gute Wahl."]},"foot":["In der Schweiz gehört das Label Bio Suisse (Knospe) zu den anspruchsvollsten.","In Frankreich garantieren das AB-Logo und das EU-Bio-Blatt die biologische Produktion; Demeter und Nature & Progrès gehen weiter."]},"it":{"M":{"label":["Altrimenti, guardare l’origine","I prodotti francesi o europei seguono le regole UE sui pesticidi; nei controlli europei le importazioni extra UE risultano più spesso non conformi."],"origine":["Controllare l’origine","I prodotti francesi ed europei seguono le regole UE; nei controlli europei le importazioni extra UE superano più spesso i limiti."],"vinlabel":["Scegliere il marchio","Bio (AB, foglia UE): niente pesticidi di sintesi, additivi limitati. Biodinamico (Demeter, Biodyvin): regole ancora più severe. Vino naturale: uve bio, nessun additivo, solfiti molto bassi."]},"it":{"61":["Si mangiano a chicco intero. Residui di regolatori di crescita (clormequat) si trovano spesso nei prodotti a base di avena convenzionale, soprattutto nordamericana, dove l’avena viene talvolta anche essiccata chimicamente prima del raccolto.",null],"63":[null,"Il grano duro importato dal Nord America può essere trattato con glifosato poco prima del raccolto: preferite grano di origine francese o europea, oppure bio."],"70":[null,"Le lenticchie verdi di Le Puy (DOP) o del Berry sono un’ottima alternativa locale."],"73":[null,"Esiste tofu prodotto in Francia con soia francese."],"81":[null,"Il latte bio o da pascolo garantisce più erba nell’alimentazione delle mucche."],"84":["I formaggi grassi concentrano i residui liposolubili. Alcune DOP francesi impongono regole severe sull’alimentazione.","Il disciplinare del Comté vieta gli insilati in tutta l’azienda."],"87":[null,"Il pollo Label Rouge o bio è allevato all’aperto e macellato ad almeno 81 giorni, contro circa 40 nel convenzionale."],"88":[null,"Preferite carne di origine francese, Label Rouge o bio."],"99":[null,"Lo zucchero francese proviene da barbabietole coltivate in Francia."],"105":[null,"Le tisane bio di piante francesi sono una buona opzione."],"111":[null,"L’olio di colza vergine francese è un’ottima opzione."]},"foot":["In Svizzera il marchio Bio Suisse (Gemma) è tra i più esigenti.","In Francia il logo AB e la foglia UE garantiscono la produzione biologica; Demeter e Nature & Progrès vanno oltre."]},"es":{"M":{"label":["Si no, mirar el origen","Los productos franceses o europeos siguen las normas de la UE sobre pesticidas; en los controles europeos, las importaciones de fuera de la UE incumplen con más frecuencia."],"origine":["Mirar el origen","Los productos franceses y europeos siguen las normas de la UE; en los controles europeos, las importaciones de fuera de la UE superan los límites con más frecuencia."],"vinlabel":["Elegir el sello","Ecológico (AB, hoja de la UE): sin pesticidas de síntesis, aditivos limitados. Biodinámico (Demeter, Biodyvin): normas aún más estrictas. Vino natural: uva ecológica, sin aditivos, sulfitos muy bajos."]},"it":{"61":["Se comen como grano entero. Se encuentran con frecuencia residuos de reguladores de crecimiento (clormequat) en productos de avena convencional, sobre todo de Norteamérica, donde la avena también se seca a veces químicamente antes de la cosecha.",null],"63":[null,"El trigo duro importado de Norteamérica puede tratarse con glifosato justo antes de la cosecha: elige trigo de origen francés o europeo, o ecológico."],"70":[null,"Las lentejas verdes de Le Puy (DOP) o del Berry son una muy buena alternativa local."],"73":[null,"Existe tofu elaborado en Francia con soja francesa."],"81":[null,"La leche ecológica o de pastoreo garantiza más hierba en la alimentación de las vacas."],"84":["Los quesos grasos concentran los residuos liposolubles. Algunas DOP francesas imponen normas estrictas de alimentación.","El pliego de condiciones del comté prohíbe el ensilado en toda la explotación."],"87":[null,"El pollo Label Rouge o ecológico se cría al aire libre y se sacrifica con 81 días como mínimo, frente a unos 40 en convencional."],"88":[null,"Prefiere carne de origen francés, Label Rouge o ecológica."],"99":[null,"El azúcar francés procede de remolacha cultivada en Francia."],"105":[null,"Las infusiones ecológicas de plantas francesas son una buena opción."],"111":[null,"El aceite de colza virgen francés es muy buena opción."]},"foot":["En Suiza, el sello Bio Suisse es uno de los más exigentes.","En Francia, el logotipo AB y la hoja de la UE garantizan la producción ecológica; Demeter y Nature & Progrès van más allá."]},"pt":{"M":{"label":["Caso contrário, ver a origem","Os produtos franceses ou europeus seguem as regras da UE sobre pesticidas; nos controlos europeus, as importações de fora da UE são mais vezes não conformes."],"origine":["Ver a origem","Os produtos franceses e europeus seguem as regras da UE; nos controlos europeus, as importações de fora da UE ultrapassam os limites mais vezes."],"vinlabel":["Escolher o selo","Biológico (AB, folha da UE): sem pesticidas de síntese, aditivos limitados. Biodinâmico (Demeter, Biodyvin): regras ainda mais rigorosas. Vinho natural: uvas biológicas, sem aditivos, sulfitos muito baixos."]},"it":{"61":["Comidos como grão inteiro. Encontram-se frequentemente resíduos de reguladores de crescimento (clormequato) em produtos de aveia convencional, sobretudo da América do Norte, onde a aveia é também por vezes seca quimicamente antes da colheita.",null],"63":[null,"O trigo duro importado da América do Norte pode ser tratado com glifosato pouco antes da colheita: prefira trigo de origem francesa ou europeia, ou biológico."],"70":[null,"As lentilhas verdes de Le Puy (DOP) ou do Berry são uma ótima alternativa local."],"73":[null,"Existe tofu fabricado em França com soja francesa."],"81":[null,"O leite biológico ou de pastagem garante mais erva na alimentação das vacas."],"84":["Os queijos gordos concentram resíduos lipossolúveis. Alguns DOP franceses impõem regras de alimentação rigorosas.","O caderno de especificações do comté proíbe a silagem em toda a exploração."],"87":[null,"O frango Label Rouge ou biológico é criado ao ar livre e abatido com 81 dias no mínimo, contra cerca de 40 no convencional."],"88":[null,"Prefira carne de origem francesa, Label Rouge ou biológica."],"99":[null,"O açúcar francês vem de beterraba cultivada em França."],"105":[null,"As tisanas biológicas de plantas francesas são uma boa opção."],"111":[null,"O óleo de colza virgem francês é uma ótima opção."]},"foot":["Na Suíça, o selo Bio Suisse é um dos mais exigentes.","Em França, o logótipo AB e a folha da UE garantem a produção biológica; a Demeter e a Nature & Progrès vão mais longe."]}},"DE":{"fr":{"M":{"label":["À défaut de bio, regarder l’origine","Les produits allemands sont les moins souvent hors normes dans les contrôles officiels (1 % en 2024), devant les autres pays de l’UE (1,5 %) et loin devant les importations hors UE (6,7 %)."],"origine":["Regarder l’origine","Les produits allemands sont les moins souvent hors normes dans les contrôles officiels (1 % en 2024), devant les autres pays de l’UE (1,5 %) et loin devant les importations hors UE (6,7 %)."],"vinlabel":["Choisir le label","Bio (logo bio européen, Bio-Siegel allemand) : pas de pesticides de synthèse, additifs limités. Associations comme Bioland, Naturland, Ecovin ou Demeter : règles plus strictes. Vin nature : raisins bio, aucun additif, sulfites très faibles."]},"it":{"61":["Consommés grain entier. Des résidus de régulateurs de croissance (chlorméquat) sont fréquemment détectés dans les produits à base d’avoine conventionnelle, surtout d’Amérique du Nord, où l’avoine est aussi parfois séchée chimiquement avant la moisson, une pratique interdite en Allemagne depuis 2021.",null],"63":[null,"En Allemagne, traiter les céréales au glyphosate juste avant la récolte est interdit depuis 2021, ce qui n’est pas le cas dans tous les pays exportateurs : privilégiez un blé d’origine allemande ou européenne."],"70":[null,"Les lentilles de la Jura souabe (Alb-Leisa) sont une très bonne alternative locale."],"73":[null,"Il existe du tofu fabriqué en Allemagne avec du soja allemand ou européen."],"81":[null,"Le lait bio ou le lait de foin (Heumilch, STG) garantissent une alimentation riche en herbe, sans ensilage pour le lait de foin."],"84":["Les fromages gras concentrent les résidus liposolubles. Les fromages au lait de foin (Heumilch, STG) proviennent de vaches nourries sans ensilage.","On trouve surtout des fromages au lait de foin de Bavière et d’Autriche."],"87":[null,"La volaille bio a accès au plein air et est abattue nettement plus âgée que la volaille conventionnelle."],"88":[null,"Préférez une viande d’origine allemande, idéalement bio ou d’associations comme Bioland, Naturland ou Neuland."],"99":[null,"Le sucre allemand provient de betteraves cultivées en Allemagne."],"105":[null,"Les tisanes bio de plantes cultivées en Allemagne sont une bonne option."],"111":[null,"L’huile de colza allemande vierge est une très bonne option."]},"foot":["En Suisse, le label Bio Suisse (Bourgeon) est l’un des plus exigeants.","En Allemagne, le Bio-Siegel national et le logo bio européen garantissent le mode de production biologique ; des associations comme Bioland, Naturland et Demeter vont plus loin."]},"en":{"M":{"label":["Otherwise, check the origin","German products are the least often non-compliant in official checks (1% in 2024), ahead of other EU countries (1.5%) and far ahead of non-EU imports (6.7%)."],"origine":["Check the origin","German products are the least often non-compliant in official checks (1% in 2024), ahead of other EU countries (1.5%) and far ahead of non-EU imports (6.7%)."],"vinlabel":["Choose the label","Organic (EU organic logo, German Bio-Siegel): no synthetic pesticides, restricted additives. Associations such as Bioland, Naturland, Ecovin or Demeter: stricter rules. Natural wine: organic grapes, no additives, very low sulphites."]},"it":{"61":["Eaten as whole grain. Growth-regulator residues (chlormequat) are frequently found in conventional oat products, especially from North America, where oats are also sometimes chemically dried before harvest, a practice banned in Germany since 2021.",null],"63":[null,"In Germany, spraying cereals with glyphosate just before harvest has been banned since 2021, which is not the case in every exporting country: choose German or European wheat."],"70":[null,"Lentils from the Swabian Jura (Alb-Leisa) are a very good local alternative."],"73":[null,"Tofu made in Germany from German or European soy is available."],"81":[null,"Organic milk or hay milk (Heumilch, TSG) guarantees a grass-rich diet, and no silage for hay milk."],"84":["Fatty cheeses concentrate fat-soluble residues. Hay milk cheeses (Heumilch, TSG) come from cows fed without silage.","Hay milk cheeses mostly come from Bavaria and Austria."],"87":[null,"Organic poultry has outdoor access and is slaughtered at a much older age than conventional poultry."],"88":[null,"Choose German meat, ideally organic or from associations such as Bioland, Naturland or Neuland."],"99":[null,"German sugar comes from sugar beet grown in Germany."],"105":[null,"Organic herbal teas from plants grown in Germany are a good option."],"111":[null,"German virgin rapeseed oil is a very good option."]},"foot":["In Switzerland, the Bio Suisse label (the Bud) is one of the most demanding.","In Germany, the national Bio-Siegel and the EU organic logo guarantee organic production; associations such as Bioland, Naturland and Demeter go further."]},"de":{"M":{"label":["Sonst auf die Herkunft achten","Deutsche Erzeugnisse überschreiten bei amtlichen Kontrollen am seltensten die Höchstgehalte (1 % im Jahr 2024), vor anderen EU-Staaten (1,5 %) und weit vor Importen aus Nicht-EU-Ländern (6,7 %)."],"origine":["Auf die Herkunft achten","Deutsche Erzeugnisse überschreiten bei amtlichen Kontrollen am seltensten die Höchstgehalte (1 % im Jahr 2024), vor anderen EU-Staaten (1,5 %) und weit vor Importen aus Nicht-EU-Ländern (6,7 %)."],"vinlabel":["Das Label wählen","Bio (EU-Bio-Logo, deutsches Bio-Siegel): keine synthetischen Pestizide, begrenzte Zusatzstoffe. Verbände wie Bioland, Naturland, Ecovin oder Demeter: strengere Regeln. Naturwein: Bio-Trauben, keine Zusatzstoffe, sehr wenig Sulfite."]},"it":{"61":["Als ganzes Korn gegessen. Rückstände von Wachstumsreglern (Chlormequat) finden sich häufig in konventionellen Haferprodukten, besonders aus Nordamerika, wo Hafer zudem teils vor der Ernte chemisch getrocknet wird, eine in Deutschland seit 2021 verbotene Praxis.",null],"63":[null,"In Deutschland ist die Glyphosat-Behandlung von Getreide kurz vor der Ernte seit 2021 verboten, was nicht in allen Exportländern gilt: Weizen aus Deutschland oder Europa bevorzugen."],"70":[null,"Linsen von der Schwäbischen Alb (Alb-Leisa) sind eine sehr gute regionale Alternative."],"73":[null,"Es gibt Tofu, der in Deutschland aus deutschem oder europäischem Soja hergestellt wird."],"81":[null,"Bio- oder Heumilch (g.t.S.) garantiert ein grasreiches Futter, bei Heumilch ganz ohne Silage."],"84":["Fette Käse konzentrieren fettlösliche Rückstände. Käse aus Heumilch (g.t.S.) stammt von Kühen, die ohne Silage gefüttert werden.","Heumilchkäse kommt vor allem aus Bayern und Österreich."],"87":[null,"Bio-Geflügel hat Auslauf ins Freie und wird deutlich älter geschlachtet als konventionelles Geflügel."],"88":[null,"Fleisch aus Deutschland bevorzugen, idealerweise bio oder von Verbänden wie Bioland, Naturland oder Neuland."],"99":[null,"Deutscher Zucker stammt aus heimischen Zuckerrüben."],"105":[null,"Bio-Kräutertees aus deutschem Anbau sind eine gute Wahl."],"111":[null,"Natives deutsches Rapsöl ist eine sehr gute Wahl."]},"foot":["In der Schweiz gehört das Label Bio Suisse (Knospe) zu den anspruchsvollsten.","In Deutschland garantieren das staatliche Bio-Siegel und das EU-Bio-Logo die biologische Produktion; Verbände wie Bioland, Naturland und Demeter gehen weiter."]},"it":{"M":{"label":["Altrimenti, guardare l’origine","Nei controlli ufficiali i prodotti tedeschi superano più raramente i limiti (1 % nel 2024), davanti agli altri paesi UE (1,5 %) e molto davanti alle importazioni extra UE (6,7 %)."],"origine":["Controllare l’origine","Nei controlli ufficiali i prodotti tedeschi superano più raramente i limiti (1 % nel 2024), davanti agli altri paesi UE (1,5 %) e molto davanti alle importazioni extra UE (6,7 %)."],"vinlabel":["Scegliere il marchio","Bio (logo bio UE, Bio-Siegel tedesco): niente pesticidi di sintesi, additivi limitati. Associazioni come Bioland, Naturland, Ecovin o Demeter: regole più severe. Vino naturale: uve bio, nessun additivo, solfiti molto bassi."]},"it":{"61":["Si mangiano a chicco intero. Residui di regolatori di crescita (clormequat) si trovano spesso nei prodotti a base di avena convenzionale, soprattutto nordamericana, dove l’avena viene talvolta anche essiccata chimicamente prima del raccolto, una pratica vietata in Germania dal 2021.",null],"63":[null,"In Germania trattare i cereali con glifosato poco prima del raccolto è vietato dal 2021, cosa che non vale in tutti i paesi esportatori: preferite grano di origine tedesca o europea."],"70":[null,"Le lenticchie del Giura svevo (Alb-Leisa) sono un’ottima alternativa locale."],"73":[null,"Esiste tofu prodotto in Germania con soia tedesca o europea."],"81":[null,"Il latte bio o il latte fieno (Heumilch, STG) garantiscono un’alimentazione ricca di erba, senza insilati per il latte fieno."],"84":["I formaggi grassi concentrano i residui liposolubili. I formaggi di latte fieno (Heumilch, STG) provengono da mucche alimentate senza insilati.","I formaggi di latte fieno provengono soprattutto dalla Baviera e dall’Austria."],"87":[null,"Il pollame bio ha accesso all’aperto ed è macellato molto pi   $("q").placeholder = T.ui.ph; $("q").setAttribute("aria-label",T.ui.search);
  $("langSel").setAttribute("aria-label",T.ui.lang); $("langSel").value = code;
  $("ctySel").setAttribute("aria-label",CN[code].pl); $("ctySel").innerHTML = ["CH","FR","DE","IT"].map(c=>`<option value="${c}">${CN[code][c]}</option>`).join(""); $("ctySel").value = country;
  $("levels").setAttribute("aria-label",T.ui.levels); $("cats").setAttribute("aria-label",T.ui.catsL);
  document.querySelectorAll("#levels .chip").forEach(c=>{const f=+c.dataset.f; c.querySelector(".lbl").textContent = f ? T.L[f][0] : T.ui.all;});
  $("cats").innerHTML = `<button class="chip" data-c="-1">${T.ui.allCats}</button>` + T.cats.map((c,i)=>`<button class="chip" data-c="${i}">${c}</button>`).join("");
  setChips();
  $("g-title").textContent = T.ui.guideT;
  $("guideList").innerHTML = T.guide.map(g=>`<li>${g}</li>`).join("");
  $("foot").textContent = T.foot;
  $("srcT").textContent = T.ui.src; $("srcIntro").textContent = T.ui.srcIntro; $("srcList").innerHTML = SRC.map(x=>`<li><a href="${x.u}" target="_blank" rel="noopener">${x.t}</a></li>`).join("");
  $("legalT").textContent = T.legal.t; $("legalList").innerHTML = T.legal.i.map(x=>`<li>${x}</li>`).join(""); $("upd").textContent = T.legal.u;
  document.querySelector(".close").setAttribute("aria-label",T.ui.close);
  render();
}
function render(){
  const q = norm(query.trim());
  const items = F.filter(f => (!filter || f.l===filter) && (cat<0 || f.c===cat) && (!q || norm(f.n+" "+f.al+" "+T.cats[f.c]).includes(q)));
  const list = $("list");
  if(!items.length){
    list.innerHTML = `<p class="empty">${T.ui.empty} <button id="reset">${T.ui.reset}</button>.</p>`;
    $("reset").onclick = () => { query=""; $("q").value=""; cat=-1; setChips(); setFilter(0); };
    return;
  }
  list.innerHTML = [3,2,1].map(lv => {
    const g = items.filter(f=>f.l===lv).sort((a,b)=>a.n.localeCompare(b.n,lang));
    if(!g.length) return "";
    return `<section class="group g${lv}">
      <div class="group-head"><h2>${T.L[lv][0]}</h2><span>${g.length} ${g.length>1?T.ui.many:T.ui.one}</span></div>
      <p class="group-desc">${T.L[lv][1]}</p>
      <ul class="items">${g.map(f=>`<li><button class="item" data-id="${f.id}">
        <span class="emo" aria-hidden="true">${f.e}</span>
        <span><span class="name">${f.n}</span><span class="sub">${T.cats[f.c]}</span></span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button></li>`).join("")}</ul></section>`;
  }).join("");
}
function setChips(){ document.querySelectorAll("#cats .chip").forEach(c=>c.setAttribute("aria-pressed", String(+c.dataset.c===cat))); }
function setFilter(v){
  filter = v;
  document.querySelectorAll("#levels .chip").forEach(c=>c.setAttribute("aria-pressed", String(+c.dataset.f===v)));
  render();
}
const sheet = $("sheet");
let lastFocus = null;
function openFood(id){
  const f = F[id];
  const steps = `<h3>${T.ui.gest}</h3>` + (f.m.length
    ? `<ol class="steps">${f.m.map(k=>`<li><b>${M[k].t}</b><span>${M[k].d}</span></li>`).join("")}</ol>`
    : `<p>${T.ui.noprep}</p>`);
  $("detail").innerHTML = `
    <div class="d-emo" aria-hidden="true">${f.e}</div>
    <h2 class="d-name" id="d-name">${f.n}</h2>
    <p class="d-cat">${T.cats[f.c]}</p>
    <div class="verdict v${f.l}">
      <span class="meter" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=f.l?"on":""}"></i>`).join("")}</span>
      <span class="big">${T.L[f.l][0]}</span>
    </div>
    <p class="d-why">${f.w}</p>
    ${steps}
    <div class="tip">${f.tip}</div>
    ${f.s.length?`<div class="srcs"><b>${T.ui.src}</b><ul>${f.s.map(i=>`<li><a href="${SRC[i].u}" target="_blank" rel="noopener">${SRC[i].t}</a></li>`).join("")}</ul></div>`:""}`;
  lastFocus = document.activeElement;
  sheet.classList.add("open");
  document.body.style.overflow = "hidden";
  $("panel").scrollTop = 0;
  sheet.querySelector(".close").focus();
}
function closeFood(){ sheet.classList.remove("open"); document.body.style.overflow = ""; if(lastFocus) lastFocus.focus(); }
$("list").addEventListener("click", e => { const b = e.target.closest(".item"); if(b) openFood(+b.dataset.id); });
sheet.addEventListener("click", e => { if(e.target.closest("[data-close]")) closeFood(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && sheet.classList.contains("open")) closeFood(); });
document.querySelectorAll("#levels .chip").forEach(c => c.addEventListener("click", () => setFilter(+c.dataset.f)));
$("cats").addEventListener("click", e => { const c = e.target.closest(".chip"); if(!c) return; cat = +c.dataset.c; setChips(); render(); });
$("q").addEventListener("input", e => { query = e.target.value; render(); });
$("langSel").innerHTML = ORDER.map(c=>`<option value="${c}">${I18N[c].name}</option>`).join("");
$("langSel").addEventListener("change", e => { if(sheet.classList.contains("open")) closeFood(); setLang(e.target.value); });
$("ctySel").addEventListener("change", e => { country = e.target.value; if(sheet.classList.contains("open")) closeFood(); setLang(lang); });
let start = "fr";
try{ const s = localStorage.getItem("bio-lang"); if(s && I18N[s]) start = s; else { const n=(navigator.language||"fr").slice(0,2); if(I18N[n]) start=n; } }catch(e){}
setLang(start);

</script>
</body>
</html>
