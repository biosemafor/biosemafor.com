ntakt, roh mit der Haut gegessen.|Blätter und Spitze entfernen.|\nKartoffel|Rückstände vor allem in der Schale.|Grüne oder gekeimte Stellen nicht essen, ob bio oder nicht.|\nBrokkoli|Im Schnitt wenig Rückstände.|Einige Minuten kopfüber in Wasser legen, um Insekten und Schmutz zu lösen.|\nBlumenkohl|Die Blätter schützen den Kopf; wenig Rückstände.|Gleicher Trick wie beim Brokkoli.|\nKohl und Rosenkohl|Die äusseren Blätter schützen das Herz.|Zwei bis drei äussere Blätter entfernen genügt.|\nKarotte|Geringe Rückstände, konzentriert in der Schale.|Eine junge, gut gebürstete Karotte muss nicht geschält werden.|Rüebli\nRande|Wenig behandelt, Haut wird nach dem Kochen entfernt.|Mit Schale gekocht behält sie ihre Farbe besser.|Rote Bete\nWeissrübe, Pastinake, Knollensellerie|Geschältes Wurzelgemüse, wenig Rückstände.|Dünn schälen, um Fruchtfleisch zu sparen.|\nKürbis|Dicke Schale, wenig Rückstände.|Den Hokkaido isst man mit Schale: gut abbürsten.|\nLauch|Wenig Rückstände, aber Erde zwischen den Blättern.|Der Länge nach aufschneiden und zwischen den Blättern spülen.|\nChicorée|Im Dunkeln gezogen, wenig behandelt.|Nicht einweichen: Er wird bitter.|\nFenchel|Seine gerillten Schichten halten Spritzwasser.|Die äussere, stärker exponierte Schicht entfernen.|\nArtischocke|Schützende Hüllblätter, Herz kaum exponiert.|Kopfüber abspülen.|\nMangold|Grosse Blätter, stark Spritzungen ausgesetzt.|Stiele und Blätter getrennt waschen.|\nZwiebel und Schalotte|Die äusseren Schichten schützen den essbaren Teil.|Neben der Haut die erste fleischige Schicht entfernen genügt.|\nKnoblauch|Wenig Rückstände; europäische Herkunft bevorzugen.|Von weit her importierter Knoblauch wird manchmal gegen Keimung behandelt.|\nIngwer|Wenig Rückstände, besonders geschält.|Mit einem Teelöffel lässt sich die Haut ohne Verlust abschaben.|\nPilze|Champignons wachsen in geschlossenen Räumen, ohne Spritzungen.|Das erdige Stielende abschneiden.|Champignons\nSpargel|Im Schnitt wenig behandelt.|Weissen Spargel von oben nach unten schälen.|\nZuckermais|Die Hüllblätter um den Kolben schützen ihn.|Hüllblätter und Fäden erst kurz vor dem Kochen entfernen.|Mais\nSüsskartoffel|Wenig Rückstände, vor allem in der Schale.|Gut gebürstet kann sie mit Schale gegart werden.|\nErbsen|Die Hülse schützt die Erbsen; Rückstände sind selten.|Tiefgekühlte konventionelle Erbsen sind eine sehr gute Wahl.|\nWeisser Basmati- und Thai-Reis (Jasmin)|Das Polieren entfernt einen Grossteil der Rückstände. Doch amtliche Kontrollen, in der Schweiz wie in der EU, finden in Reis aus Asien regelmässig hier verbotene Pestizide; Bio-Reis schneidet deutlich besser ab.|Bio löst die Pestizidfrage, nicht die Arsenfrage: Kochen in viel Wasser bleibt sinnvoll.|Basmati Jasmin Reis\nVollkorn-, roter oder schwarzer Reis|Die erhaltene Schale speichert Pestizidrückstände und reichert mehr Arsen an.|Bio kaufen und mit anderen Getreiden abwechseln.|Naturreis Reis\nWeisser Reis aus Europa (Rundkorn, Risotto, Camargue)|Nach EU-Regeln angebaut, mit wenig Rückständen. Arsen betrifft jedoch jeden Reis, bio oder nicht.|Für Risotto wird nicht gespült: einfach über die Woche die Getreide abwechseln.|Arborio Carnaroli Reis\nHaferflocken und Müesli|Als ganzes Korn gegessen. Rückstände von Wachstumsreglern (Chlormequat) finden sich häufig in konventionellen Haferprodukten, besonders aus Nordamerika, wo Hafer zudem teils vor der Ernte chemisch getrocknet wird, eine in der Schweiz verbotene Praxis.|Für Kinder, die täglich davon essen, einer der sinnvollsten Bio-Käufe.|Hafer Porridge Granola Müsli\nVollkorn- und Halbvollkornteigwaren|Die erhaltene Kleie speichert Wachstumsregler und Fungizide des Weizens.|Vollkorn hat echte Ernährungsvorteile: Genau hier lohnt sich Bio.|Nudeln Pasta Spaghetti\nWeisse Teigwaren|Das Mahlen entfernt Kleie und Keim, wo die meisten Rückstände sitzen.|In der Schweiz ist die Behandlung von Getreide mit Glyphosat kurz vor der Ernte verboten, was nicht in allen Exportländern gilt: Weizen aus der Schweiz oder Europa bevorzugen.|Nudeln Pasta Spaghetti Makkaroni Lasagne\nVollkornbrot und Vollkornmehl|Wie bei Vollkornteigwaren konzentriert die Kleie die Rückstände.|Ein Bio-Sauerteigbrot ist ein ausgezeichneter Kompromiss aus Geschmack, Verdauung und Rückständen.|Ruchmehl Roggen Dinkel\nWeissbrot und Weissmehl|Nur der Kern des Korns wird verwendet: viel weniger Rückstände als Vollkorn.|Industriebrot enthält oft mehr Zusatzstoffe als Brot vom Bäcker.|Mehl Baguette\nGriess, Couscous und Bulgur|Aus raffiniertem Hartweizen; gleiche Themen wie weisse Teigwaren.|Vollkornvarianten hingegen lohnen sich in Bio.|\nQuinoa und Buchweizen|Robuste, wenig behandelte Pflanzen; Quinoa ist durch bittere Saponine geschützt.|Vor dem Kochen gut spülen, um die Bitterkeit zu entfernen.|\nPolenta und Mais|Konventioneller Mais wird behandelt, und Bio garantiert Gentechfreiheit.|Polenta europäischer Herkunft wählen.|\nFrühstücksflocken|Mischung aus behandeltem Getreide, Zucker und Zusatzstoffen.|Bio-Varianten haben oft weniger Zusatzstoffe, aber nicht unbedingt weniger Zucker.|Cornflakes Cerealien\nLinsen|Mit Haut gegessen, und importierte Linsen werden manchmal vor der Ernte chemisch getrocknet.|Es gibt Linsen aus der Schweiz und Frankreich: eine sehr gute Alternative.|\nKichererbsen|Die gleichen chemischen Trocknungspraktiken sind bei Importen möglich.|Abspülen von Dosenware reduziert auch das Salz.|\nGetrocknete Bohnen (rot, weiss)|Bio vermeidet chemische Behandlungen vor der Ernte.|Rote Bohnen immer gut durchkochen.|\nSoja, Tofu und Tempeh|Bio garantiert gentechfreies Soja, oft europäischer Herkunft.|Es gibt Tofu, der in der Schweiz aus lokalem Soja hergestellt wird.|\nRosinen|Das Trocknen konzentriert die Rückstände einer bereits stark behandelten Frucht.|Eine gute Bio-Wahl für das Znüni der Kinder.|Sultaninen\nGetrocknete Aprikosen|Rückstände durch Trocknen konzentriert, oft geschwefelt, damit sie orange bleiben.|Braune, ungeschwefelte Aprikosen sind völlig normal.|\nDatteln und getrocknete Feigen|Im Allgemeinen wenig Rückstände.|Prüfen, dass kein Glukosesirup zugesetzt ist.|\nMandeln|Die braune Haut hält Rückstände fest. In den USA müssen kalifornische Mandeln pasteurisiert werden, mit Dampf oder durch Begasung mit Propylenoxid, einem Verfahren, das in der EU und in Bio verboten ist.|Europäische Bio-Mandeln (Spanien, Italien) wählen oder sonst blanchierte Mandeln.|\nErdnüsse|Regelmässige Rückstände bei konventionellen Erdnüssen.|Ob bio oder nicht: Erdnüsse mit muffigem Geschmack wegwerfen.|\nBaumnüsse|Die Schale schützt, ist aber nicht ganz dicht; konventionelle Nussbäume werden gegen Apfelwickler und Walnussfruchtfliege behandelt. Die omega-3-reichen Kerne sind empfindlich.|Schweizer oder französische Nüsse ohne Nachernte-Behandlung sind eine sehr gute Alternative.|Walnüsse Nüsse\nSamen (Kürbis, Sonnenblume, Lein, Chia)|Im Allgemeinen wenig Rückstände.|Leinsamen sind gemahlen besser verdaulich.|\nVollmilch|Fettlösliche Rückstände aus dem Futter der Kühe gehen ins Milchfett über. Bio garantiert zudem mehr Weide und keine Gentechnik.|In der Schweiz ist konventionelle Milch bereits gut geregelt: Bio ist ein Plus, kein Muss.|Milch\nMager- und teilentrahmte Milch|Das Entrahmen entfernt den Fettanteil, in dem sich Rückstände konzentrieren.|Bio bleibt eine Wahl fürs Tierwohl, keine gesundheitliche Notwendigkeit.|Milch Drink\nButter und Rahm|Schadstoffe, die sich im Fett binden, finden sich hier stärker als in der Milch.|Bergbutter oder Bio-Butter ist eine gute Wahl.|Sahne\nKäse|Fette Käse konzentrieren fettlösliche Rückstände. Schweizer AOP-Käse haben bereits strenge Fütterungsregeln.|Gruyère und Emmentaler AOP werden aus silofreier Milch hergestellt.|\nJoghurt und Milchdesserts|Aromatisierte Varianten enthalten oft Zusatzstoffe, die in Bio stärker begrenzt sind.|Naturjoghurt mit frischen Früchten bleibt die beste Wahl.|\nEier|Bio garantiert Futter ohne synthetische Pestizide und Gentechnik, Auslauf und keine vorbeugenden Antibiotika.|In der EU steht der Code 0 auf der Schale für Bio.|\nPoulet- und Truthahnbrust|Mageres Fleisch ohne das Fett, in dem sich Rückstände binden; bei Bio geht es vor allem ums Tierwohl.|Schweizer Geflügel ist streng geregelt; vorsichtiger bei importiertem Geflügel sein.|Huhn Hähnchen Pute\nSchweinefleisch|Fettes Fleisch, das Rückstände speichert; konventionell oft intensiv gehalten.|Schweizer Fleisch mit Tierwohl-Label bevorzugen.|\nRind, Kalb und Lamm|Fette Stücke speichern Rückstände aus dem Futter. Bio oder lokales Weidefleisch.|Lokales Weidefleisch ist oft gleichwertig mit importiertem Bio-Fleisch.|\nWurstwaren|Sehr fett, und Nitritpökelsalz ist konventionell fast immer dabei; Bio begrenzt es.|Schinken „ohne Nitrit“ gibt es auch konventionell.|Schinken Salami Speck\nZuchtlachs und Zuchtforelle|Bio verbietet synthetische Farbstoffe im Futter und begrenzt Antibiotika und Antiparasitika.|Wildlachs aus Alaska ist eine Alternative.|Lachs Forelle\nCrevetten|Lieferungen importierter Zuchtcrevetten, vor allem aus Indien und Vietnam, werden an der EU-Grenze noch regelmässig wegen verbotener Antibiotika zurückgewiesen. Das Risiko hängt vor allem von der Herkunft ab.|Bio, ein anerkanntes Aquakultur-Label oder eine andere Herkunft als die regelmässig gemeldeten Länder wählen.|Garnelen\nWeisser Wildfisch (Kabeljau, Seelachs)|Sehr mageres Fleisch, das wenig Schadstoffe speichert; Bio gibt es für Wildfang nicht.|Ein Label für nachhaltige Fischerei ist hier das richtige Kriterium.|Kabeljau Seelachs Fisch\nThunfisch und grosse Raubfische|Bio gibt es für Wildfang nicht. Der eigentliche Schadstoff ist Quecksilber in grossen Raubfischen.|Thunfisch und Schwertfisch einschränken, besonders für Schwangere und Kinder.|Schwertfisch\nGuetzli und Kuchen|Bio vermeidet einige Pestizide und Zusatzstoffe, enthält aber gleich viel Zucker, Fett und Salz. Lieber seltener essen als für Bio zu viel zahlen.|Ein Bio-Guetzli bleibt ein stark verarbeitetes Guetzli.|Kekse Biscuits\nSchokolade|Kakao wird in den Anbauländern stark behandelt; Bio bedeutet auch weniger Zusatzstoffe.|Je dunkler die Schokolade, desto kürzer die Zutatenliste.|\nSchokoladenaufstrich|Öl, Zucker und Haselnüsse aus verschiedenen Quellen; häufig Zusatzstoffe.|Reines Haselnussmus ist eine einfache Alternative.|\nKonfitüre und Kompott|Behandelte Früchte behalten nach dem Kochen einen Teil ihrer Rückstände.|Bei Erdbeer- oder Kirschkonfitüre lohnt sich Bio besonders.|Marmelade Apfelmus\nZucker|Die Raffination entfernt praktisch alle Rückstände.|Schweizer Zucker stammt aus lokal angebauten Zuckerrüben.|\nHonig|Wenig Rückstände; bei Bio geht es vor allem um die Umgebung der Bienenstöcke.|Lokaler Honig ist oft sicherer als eine Mischung importierter Honige.|\nChips und salzige Snacks|Bio ändert weder Salz noch Fett noch das Acrylamid vom Frittieren.|Lieber seltener essen als mehr bezahlen.|Apéro Cracker\nSüssigkeiten und Bonbons|Das Hauptproblem ist der Zucker, nicht die Pestizide. Bio begrenzt einige Farbstoffe.|Vorsicht bei den Farbstoffen E102, E110 und E129.|\nTee|Die Blätter werden vor dem Aufgiessen nie gewaschen, und konventioneller Tee enthält oft Rückstände.|Bei Grüntee ist Bio besonders empfehlenswert.|\nKaffee|Die Bohnen sind durch die Frucht geschützt und das Rösten reduziert Rückstände, doch der Anbau ist stark behandelt.|Bio und Fairtrade gehen oft zusammen.|\nKräutertees und Aufgüsse|Pflanzen werden nie gewaschen: Heisses Wasser löst die Rückstände direkt.|Kräutertees aus Schweizer Pflanzen sind eine gute Wahl.|\nWein|Die Rebe gehört zu den am stärksten behandelten Kulturen (Falscher und Echter Mehltau, Graufäule), oft mit systemischen Fungiziden, die in die Traube eindringen. Vor der Weinbereitung wird nichts gewaschen oder geschält: Rückstände gehen in den Most über, und Kontrollen finden häufig Spuren, meist unter den Grenzwerten. Konventioneller Wein darf zudem deutlich mehr Zusatzstoffe und Sulfite enthalten als Bio-Wein.|Kopfschmerzen nach einem Glas kommen nicht immer von den Sulfiten: Auch Alkohol und Histamin spielen eine Rolle. Ob bio oder nicht: Wein mit Mass geniessen.|\nFruchtsaft|Ein Teil der Rückstände der Früchte gelangt in den Saft.|Bei Apfel- und Traubensaft lohnt sich Bio.|\nPflanzendrinks (Hafer, Soja, Mandel)|Rückstände aus Getreide und Soja gehen teilweise ins Getränk über.|Beim Haferdrink, der in grösseren Mengen getrunken wird, ist Bio empfehlenswert.|Hafermilch Sojamilch\nSoftdrinks und Süssgetränke|Bio ändert nichts am Zucker, dem eigentlichen Problem.|Auch Light-Varianten meiden: Bio verbietet Süssstoffe, konventionell nicht.|Limonade\nBier|Geringe Rückstände nach dem Brauen.|Bio betrifft vor allem den Anbau von Gerste und Hopfen.|\nNative Öle (Oliven, Raps, Lein, Baumnuss)|Kalt gepresst ohne Raffination enthalten sie die fettlöslichen Rückstände der Frucht oder des Samens.|Natives Schweizer Rapsöl ist eine sehr gute Wahl.|Olivenöl Rapsöl\nRaffinierte Öle (Sonnenblume, Frittieren)|Die Raffination entfernt Rückstände, auf Kosten der Mikronährstoffe.|Für das Kochen bei hohen Temperaturen verwenden.|Sonnenblumenöl\nGewürze und getrocknete Kräuter|Häufige Rückstände bei importierten Gewürzen; Bio verbietet zudem die Bestrahlung.|In kleinen Mengen kaufen: Sie verlieren ihr Aroma.|\nTomatensauce und Ketchup|Behandelte Tomaten und häufig Zusatzstoffe.|Eine hausgemachte Sauce aus Bio-Dosentomaten ist einfach.|\nBouillonwürfel|Oft reich an Zusatzstoffen und Geschmacksverstärkern.|Bio-Bouillons sind meist ohne zugesetztes Glutamat.|Brühwürfel\nSalz, Essig und Senf|Wenig Rückstände; Bio bringt hier kaum etwas.|Beim Senf auf die Herkunft der Samen achten.|\nFrische Kräuter|Häufige Behandlungen auf ungeschützten Blättern, roh und kaum gespült gegessen.|In einem sauberen Küchentuch trocknen, so halten sie länger.|Petersilie Basilikum Schnittlauch Koriander Minze\nPekannüsse|Gleiche Familie wie die Baumnuss, mit weicherer Schale; Kulturen aus den USA und Mexiko werden regelmässig behandelt.|Im Kühlschrank lagern: Ihr Öl wird schnell ranzig.|Pecan\nCashewnüsse|Die Schale enthält ein ätzendes Harz, das den Kern vor Spritzungen schützt, doch das Knacken ist harte, oft schlecht geschützte Arbeit.|Bio oder Fairtrade garantieren bessere Arbeitsbedingungen.|Cashew\nHaselnüsse|Konventionelle Haselsträucher erhalten mehrere Insektizidbehandlungen gegen den Haselnussbohrer, der die noch weiche Schale ansticht.|Die braune Haut löst sich nach dem Rösten leicht.|\nPistazien|Die Schale öffnet sich schon am Baum: Der Kern ist späten Behandlungen und beim Trocknen Schimmel ausgesetzt.|Fleckige oder muffig schmeckende Pistazien wegwerfen.|\nMacadamianüsse|Eine der härtesten und dicksten Schalen überhaupt: Der Kern ist vor Spritzungen fast vollständig geschützt.|Das Hauptrisiko ist eine mögliche Konservierungsbehandlung während des Transports.|Macadamia\nNussmus (Erdnuss, Mandel…)|Ganze Samen mit Haut gemahlen; konventionelle Varianten enthalten oft zugesetztes Palmöl, gehärtetes Öl oder Zucker.|Auf 100 % Nüsse achten, idealerweise bio: eine einzige Zutat auf der Etikette.|Erdnussbutter Mandelmus\nWeiche Kaki (mit dem Löffel)|Traditionelle Sorten, sehr reif mit dem Löffel gegessen: Die dicke, wachsige Schale, die weggeworfen wird, hält die meisten Rückstände. Der Baum ist zudem robust und wenig behandelt.|Vor dem Öffnen abspülen, dann das Fruchtfleisch auslöffeln.|Kaki Persimone\nFeste Kaki (Sharon, Persimon)|Knackige Sorten, die mit der Schale gegessen werden; diese hält Feldbehandlungen und Konservierungsmittel nach der Ernte fest.|Ihre Adstringenz wird oft nach der Ernte mit CO₂ oder Ethanol entfernt: ohne schädliche Rückstände, aber ein Grund mehr, die Schale gut zu waschen.|Kaki Sharon Persimon\nGetrocknete Kaki|Das Trocknen konzentriert allfällige Rückstände; importierte Industrieware wird manchmal begast.|Traditionelle japanische Hoshigaki werden vor dem Trocknen geschält.|Kaki Hoshigaki","legal":{"t":"Hinweis","u":"Letzte inhaltliche Aktualisierung: Oktober 2026.","i":["BioSemafor bietet allgemeine Informationen zur Orientierung. Sie ersetzen nicht den Rat einer Ärztin, eines Arztes, einer Ernährungsberatung oder einer anderen Gesundheitsfachperson, insbesondere in der Schwangerschaft, bei Kleinkindern, bei Allergien oder Krankheiten.","Die Einstufungen beruhen auf öffentlichen Daten zu Pestizidrückständen, die je nach Herkunft, Saison und Produzent variieren. Sie sind keine Beurteilung eines bestimmten Produkts, einer Marke oder eines Produzenten.","Trotz aller Sorgfalt übernehmen wir keine Gewähr für die Richtigkeit und Vollständigkeit der Informationen, die sich ändern können. Die Nutzung erfolgt auf eigene Verantwortung, im Rahmen des gesetzlich Zulässigen.","Die genannten Labels und Bezeichnungen (Bio Suisse, IP-Suisse, Demeter, AOP usw.) gehören ihren jeweiligen Inhabern. BioSemafor ist mit keinem von ihnen verbunden und ist kein Zertifizierungslabel.","Die App selbst erhebt keine Personendaten: Nur Ihre Sprachwahl wird auf Ihrem Gerät gespeichert."]}},"it":{"name":"Italiano","ui":{"title":"Bio o no?","intro":"Per {n} alimenti di tutti i giorni, sapere quando il bio vale davvero la pena e come ridurre i residui quando comprate convenzionale.","ph":"Cerca un alimento (es. pasta, riso, tè)","search":"Cerca un alimento","all":"Tutti","allCats":"Tutte le categorie","levels":"Filtra per livello","catsL":"Filtra per categoria","one":"alimento","many":"alimenti","empty":"Nessun alimento corrisponde a questa ricerca. Provate un’altra parola, oppure","reset":"mostrate tutta la lista","gest":"I gesti giusti","noprep":"Nessuna preparazione particolare necessaria.","close":"Chiudi","guideT":"I gesti giusti, bio o no","lang":"Lingua","src":"Fonti","srcIntro":"Principali fonti consultate a ottobre 2026. I link rimandano a documenti esterni."},"L":{"1":["Bio facoltativo","Pochi residui o una protezione naturale. Il convenzionale va bene; il bio riguarda soprattutto l’ambiente."],"2":["Bio consigliato","Il bio è un vero plus, ma buone abitudini o una buona origine riducono già nettamente l’esposizione."],"3":["Bio prioritario","Residui o problemi frequenti che il lavaggio non risolve. È qui che il bio fa la differenza maggiore."]},"cats":["Frutta","Verdura","Cereali e amidacei","Legumi","Frutta secca e semi","Latticini e uova","Carne e pesce","Biscotti e dolci","Bevande","Oli, spezie e condimenti"],"M":"eau|Risciacquo sotto l’acqua corrente|30 secondi sotto l’acqua fredda strofinando con le dita: più efficace del semplice ammollo.\nbica|Ammollo nel bicarbonato|Circa 10 g di bicarbonato (2 cucchiaini) per litro d’acqua fredda, 12–15 minuti, poi risciacquare bene. Più efficace dell’acqua sola o dell’aceto sui residui di superficie.\nbrosse|Spazzolatura|Spazzolino per verdure sotto l’acqua corrente, su tutta la superficie.\npeler|Sbucciatura|Elimina la maggior parte dei residui di superficie, ma anche parte di fibre e vitamine.\nfeuilles|Togliere le foglie esterne|Sono le più esposte ai trattamenti e allo sporco.\nbassine|Lavaggio foglia per foglia|Separare le foglie, immergerle in molta acqua, mescolare, cambiare l’acqua due volte, poi sciacquare.\ndoux|Lavaggio delicato|In uno scolapasta, sotto un filo d’acqua, appena prima di mangiarli.\nessuyer|Pulizia con un panno|Carta umida o risciacquo rapidissimo: assorbono l’acqua come una spugna.\nriz|Risciacquo e cottura in molta acqua|Sciacquare finché l’acqua è limpida, cuocere in circa 6 parti d’acqua per 1 di riso, poi scolare. Riduce nettamente l’arsenico, bio o no.\ntremper|Ammollo e risciacquo|Legumi secchi: ammollo per una notte, buttare l’acqua, sciacquare. In scatola: sciacquare e scolare.\ningr|La regola dei 5 ingredienti|Puntate su una lista corta. Il bio autorizza solo una cinquantina di additivi, contro oltre 300 nel convenzionale, e vieta coloranti di sintesi, aromi artificiali ed edulcoranti intensi.\nverre|Preferire il vetro|I barattoli di vetro evitano la migrazione di plastificanti e bisfenoli negli alimenti grassi o acidi.\necreme|Scremato o parzialmente scremato|I residui liposolubili si concentrano nel grasso: un latte scremato convenzionale ne contiene molti meno.\nlabel|Altrimenti un marchio esigente|In Svizzera IP-Suisse limita alcuni trattamenti dei cereali; un’origine svizzera o europea è in genere più regolamentata.\ngras|Togliere il grasso visibile|Alcuni inquinanti (diossine, PCB) si accumulano nei grassi animali.\npetits|Variare e preferire i pesci piccoli|Sardine, sgombro, aringa: meno mercurio dei grandi predatori (tonno, pesce spada).\norigine|Controllare l’origine|La produzione svizzera o europea è soggetta a regole più severe su pesticidi e antibiotici.\nsulfites|Evitare i solfiti se possibile|Cercate la dicitura «non solforato»: il colore sarà più scuro, è normale.\nmonder|Preferire quelle pelate|La pellicola marrone concentra i residui: mandorle o nocciole pelate ne contengono molti meno.\nstock|Scegliere e conservare bene|Evitate frutti macchiati, friabili, amari o rancidi (rischio di muffe e aflatossine, bio o no). Preferite confezioni ermetiche allo sfuso esposto all’aria.\nvinlabel|Scegliere il marchio|Bio (Gemma Bio Suisse, foglia UE): niente pesticidi di sintesi, additivi limitati. Biodinamico (Demeter): regole ancora più severe. Vino naturale: uve bio, nessun additivo, solfiti molto bassi.\nvinsulf|Guardare i solfiti|Limiti massimi per un rosso secco: 150 mg/l nel convenzionale, 100 nel bio, circa 70 nel biodinamico Demeter, sotto 30 nel vino naturale certificato. I bianchi ne contengono in genere di più.\nvincouleur|Rosso o bianco|Il rosso macera a lungo con le bucce, dove si trovano i residui; il bianco è pressato rapidamente ma riceve più solfiti.","guide":["Lavate appena prima di mangiare o cucinare: la frutta lavata e poi conservata si rovina prima.","Acqua corrente strofinando: è la base. L’ammollo nel bicarbonato (circa 10 g per litro, 12–15 minuti, poi risciacquo) elimina più residui di superficie.","Mai sapone, detersivo per piatti o candeggina: penetrano negli alimenti. L’aceto non fa meglio del bicarbonato.","Lavate anche ciò che sbucciate (melone, avocado, agrumi): il coltello trascina i residui dalla buccia alla polpa.","Il lavaggio agisce solo in superficie. I pesticidi cosiddetti sistemici sono nella polpa: solo il bio li evita.","Variate frutta, verdura e provenienze per limitare l’esposizione a uno stesso prodotto.","I prodotti trasformati (pasta, biscotti, cereali) non si possono lavare: la scelta si fa all’acquisto. L’integrale concentra più residui del raffinato.","Bio non vuol dire sano: patatine, biscotti o creme spalmabili bio hanno lo stesso zucchero, sale e grassi. Meglio mangiarli meno spesso.","Preferite il vetro alle lattine verniciate e alle vaschette di plastica riscaldate, soprattutto per alimenti grassi o acidi.","Prodotti animali: i residui si fissano nel grasso. Carne magra e latte scremato convenzionali pongono meno problemi di burro, formaggi grassi o salumi.","Un frutto convenzionale ben lavato resta molto meglio per la salute che nessun frutto."],"foot":"Classifica indicativa, ispirata alle analisi dei residui di pesticidi pubblicate ogni anno (in particolare la classifica dell’Environmental Working Group, basata su dati statunitensi) e ai controlli europei. I residui variano secondo origine, stagione e produttore, e restano per lo più sotto i limiti di legge. Comprare locale e di stagione riduce anche alcuni trattamenti dopo il raccolto. In Svizzera il marchio Bio Suisse (Gemma) è tra i più esigenti.","items":"Fragola|Tra i frutti più spesso contaminati, con diversi residui per campione. Buccia sottile, impossibile da sbucciare.|Lavatele prima di togliere il picciolo, altrimenti l’acqua entra nel frutto. Sono delicate: bastano 2–3 minuti di ammollo.|\nUva|La vite è tra le colture più trattate, e l’uva si mangia con la buccia.|Staccate gli acini dal grappolo prima dell’ammollo, così l’acqua arriva ovunque.|\nPesca e nettarina|Frutto delicato e molto trattato; la buccia vellutata della pesca trattiene i residui.|Se non è bio, sbucciarla resta il metodo più efficace.|pesca noce\nMela|Uno dei frutti che riceve più trattamenti in una stagione nei frutteti convenzionali.|L’ammollo nel bicarbonato di 12–15 minuti è il metodo più studiato sulla mela. I residui già entrati nella polpa non vanno via.|\nPera|Residui frequenti, paragonabile alla mela.|Stesso metodo della mela.|\nCiliegia|Residui frequenti; si mangia intera con la buccia.|Lasciate il picciolo durante il lavaggio per evitare che l’acqua entri nel frutto.|\nMirtillo|Piccoli frutti a buccia sottile, mangiati interi; residui regolari.|I mirtilli bio surgelati costano spesso meno di quelli freschi.|\nLampone|Nessuna buccia protettiva e polpa spugnosa che assorbe i fungicidi.|Non lasciateli in ammollo: si impregnano d’acqua e si schiacciano.|\nMora|Nessuna buccia protettiva e polpa spugnosa, mangiata intera.|Le more selvatiche, raccolte lontano dalle strade, sono un’ottima scelta.|\nRibes rosso e nero|Piccoli frutti mangiati interi, residui regolari.|Sgranateli dopo il lavaggio, non prima.|\nAlbicocca|Frutto a nocciolo spesso trattato, buccia consumata.|Stessa logica della pesca, con un po’ meno residui in media.|\nPrugna e susina|Trattata contro gli insetti fino a poco prima del raccolto e mangiata con la buccia.|La patina bianca sulla buccia è naturale, non è un residuo.|\nRabarbaro|Gambi esposti, residui moderati.|Togliere i filamenti elimina anche buona parte dei residui.|\nLimone e lime|La polpa è poco esposta, ma la buccia riceve spesso fungicidi e cera dopo il raccolto.|Per la scorza: bio o «non trattato dopo la raccolta». Solo per il succo va bene anche il convenzionale.|agrumi\nArancia, clementina, pompelmo|Buccia trattata dopo il raccolto (fungicidi, cera), polpa poco esposta.|Lavatevi le mani dopo averla sbucciata, soprattutto prima di dare gli spicchi ai bambini.|agrumi mandarino\nBanana|Buccia spessa rimossa; la polpa è pochissimo esposta.|Qui il bio conta soprattutto per l’ambiente e per i lavoratori delle piantagioni.|\nAvocado|Buccia spessa non consumata; uno dei frutti meno contaminati.|Sciacquatelo comunque prima di tagliarlo: il coltello trascina i residui nella polpa.|\nAnanas|Scorza spessa rimossa; la polpa è pochissimo esposta.|Sciacquate la scorza prima di tagliare.|\nMango|Buccia spessa non consumata.|Per l’ambiente, preferite i manghi arrivati via nave piuttosto che in aereo.|\nKiwi|Pochi residui; la buccia di solito viene tolta.|Se mangiate la buccia, spazzolatelo prima.|\nMelone|Scorza spessa; la polpa è poco esposta.|Lavate la scorza prima di tagliare: il coltello attraversa la superficie.|\nAnguria|Scorza spessa; tra i frutti meno contaminati.|Stessa precauzione del melone.|cocomero\nFico fresco|In genere poco trattato.|Delicato: lavatelo appena prima di mangiarlo.|\nMelagrana|Buccia spessa non consumata.|Sgranatela in una ciotola d’acqua: i chicchi affondano, la buccia galleggia.|\nLitchi e papaya|Buccia non consumata, pochi residui nella polpa.|Sciacquate prima di aprire.|\nSpinaci|Grandi foglie molto esposte ai trattamenti; residui frequenti e multipli.|Gli spinaci bio surgelati sono un’alternativa economica.|\nCavolo riccio (kale)|Foglie arricciate che trattengono i residui; spesso diversi pesticidi rilevati.|Togliete le coste centrali spesse, più difficili da pulire.|kale\nPeperone e peperoncino|Residui frequenti, soprattutto sui prodotti importati fuori stagione.|Arrostiti in forno e poi pelati, perdono gran parte della buccia.|\nFagiolini|Residui frequenti, a volte diverse sostanze per campione.|La cottura non distrugge i pesticidi: lavateli prima di spuntarli.|\nSedano|I gambi scanalati convogliano e trattengono l’acqua dei trattamenti; si mangia spesso crudo.|Togliete i filamenti esterni e la base, più carichi.|\nPomodoro|Residui regolari, ma buccia liscia che si lava bene.|Di stagione e coltivato in pieno campo, in genere è meno trattato.|\nInsalata|Massima superficie fogliare esposta ai trattamenti, soprattutto le insalate di serra in inverno.|Una centrifuga per insalata aiuta a sciacquare bene senza rovinare le foglie.|lattuga\nRucola e valerianella|Germogli molto esposti, mangiati crudi.|Anche se «pronta da mangiare», una sciacquata non guasta.|songino\nCetriolo|I residui restano nella buccia; la polpa è sana una volta sbucciato.|Sbucciato, un cetriolo convenzionale va benissimo.|\nZucchina|Residui concentrati nella buccia sottile, che di solito si mangia.|Sbucciata o dopo un ammollo nel bicarbonato, una zucchina convenzionale va bene.|\nMelanzana|Residui concentrati nella buccia; la polpa è sana una volta sbucciata.|Si pela facilmente dopo averla grigliata.|\nRavanello|Radice a contatto con il suolo, mangiata cruda con la buccia.|Togliete le foglie e la punta.|\nPatata|Residui soprattutto nella buccia.|Non mangiate le parti verdi o germogliate, bio o no.|\nBroccolo|In media pochi residui.|Immergetelo a testa in giù per qualche minuto per staccare insetti e sporco.|\nCavolfiore|Le foglie proteggono la testa; pochi residui.|Stesso trucco del broccolo.|\nCavolo e cavolini di Bruxelles|Le foglie esterne proteggono il cuore.|Basta togliere due o tre foglie esterne.|verza\nCarota|Residui bassi, concentrati nella buccia.|Una carota giovane ben spazzolata non ha bisogno di essere pelata.|\nBarbabietola|Poco trattata, buccia tolta dopo la cottura.|Cotta con la buccia mantiene meglio il colore.|rapa rossa\nRapa, pastinaca, sedano rapa|Ortaggi a radice pelati, pochi residui.|Pelate sottile per conservare la polpa.|\nZucca|Scorza spessa, pochi residui.|La zucca Hokkaido si mangia con la buccia: spazzolatela bene.|\nPorro|Pochi residui, ma terra tra le foglie.|Tagliatelo per il lungo e sciacquate tra le foglie.|\nIndivia belga|Coltivata al buio, poco trattata.|Non mettetela in ammollo: diventa amara.|cicoria\nFinocchio|Le guaine scanalate trattengono l’acqua dei trattamenti.|Togliete lo strato esterno, più esposto.|\nCarciofo|Brattee protettive, cuore poco esposto.|Sciacquatelo a testa in giù.|\nBietola|Grandi foglie molto esposte ai trattamenti.|Lavate separatamente coste e foglie.|bietole\nCipolla e scalogno|Gli strati esterni proteggono la parte commestibile.|Basta togliere il primo strato carnoso oltre alla buccia.|\nAglio|Pochi residui; preferite un’origine europea.|L’aglio importato da lontano è talvolta trattato contro la germogliazione.|\nZenzero|Pochi residui, soprattutto se pelato.|Un cucchiaino raschia la buccia senza sprechi.|\nFunghi|Gli champignon crescono in ambiente chiuso, senza irrorazioni.|Tagliate la parte terrosa del gambo.|champignon\nAsparagi|In media poco trattati.|Pelate gli asparagi bianchi dall’alto verso il basso.|\nMais dolce|Le foglie che avvolgono la pannocchia la proteggono.|Togliete foglie e barbe appena prima della cottura.|\nPatata dolce|Pochi residui, soprattutto nella buccia.|Ben spazzolata, si può cuocere con la buccia.|batata\nPiselli|Il baccello protegge i piselli; residui rari.|I piselli surgelati convenzionali sono un’ottima scelta.|\nRiso bianco basmati e thai (jasmine)|La raffinazione elimina gran parte dei residui. Ma i controlli ufficiali, in Svizzera come nell’UE, trovano regolarmente nei risi importati dall’Asia pesticidi qui vietati; il riso bio ottiene risultati nettamente migliori.|Il bio risolve la questione dei pesticidi, non quella dell’arsenico: cuocerlo in molta acqua resta utile.|basmati jasmine\nRiso integrale, rosso o nero|Il rivestimento conservato accumula i residui di pesticidi e concentra più arsenico.|Prendetelo bio e alternatelo con altri cereali.|riso venere\nRiso bianco europeo (tondo, risotto, Camargue)|Coltivato secondo le regole europee, presenta pochi residui. L’arsenico invece riguarda tutti i risi, bio o no.|Per il risotto non si sciacqua: variate semplicemente i cereali durante la settimana.|arborio carnaroli\nFiocchi d’avena e muesli|Si mangiano a chicco intero. Residui di regolatori di crescita (clormequat) si trovano spesso nei prodotti a base di avena convenzionale, soprattutto nordamericana, dove l’avena viene talvolta anche essiccata chimicamente prima del raccolto, una pratica vietata in Svizzera.|Per i bambini che ne mangiano ogni giorno, è uno degli acquisti bio più utili.|avena porridge granola\nPasta integrale e semi-integrale|La crusca conservata accumula regolatori di crescita e fungicidi del grano.|L’integrale ha veri vantaggi nutrizionali: è proprio lì che il bio vale la pena.|spaghetti penne\nPasta bianca|La macinazione elimina crusca e germe, dove si trova la maggior parte dei residui.|In Svizzera trattare i cereali con glifosato poco prima del raccolto è vietato, cosa che non vale in tutti i paesi esportatori: preferite grano di origine svizzera o europea.|spaghetti penne maccheroni lasagne\nPane e farina integrali|Come per la pasta integrale, la crusca concentra i residui.|Un pane bio a lievitazione naturale è un ottimo compromesso tra gusto, digestione e residui.|segale farro\nPane bianco e farina bianca|Si usa solo il cuore del chicco: molti meno residui dell’integrale.|Il pane industriale contiene spesso più additivi di quello del fornaio.|farina 00\nSemola, couscous e bulgur|Da grano duro raffinato; stesse questioni della pasta bianca.|Le versioni integrali, invece, conviene prenderle bio.|\nQuinoa e grano saraceno|Piante rustiche, poco trattate; la quinoa è protetta da saponine amare.|Sciacquatela bene prima della cottura per togliere l’amaro.|\nPolenta e mais|Il mais convenzionale è trattato, e il bio garantisce l’assenza di OGM.|Preferite una polenta di origine europea.|\nCereali per la colazione|Mix di cereali trattati, zucchero e additivi.|Le versioni bio hanno spesso meno additivi, ma non per forza meno zucchero.|corn flakes\nLenticchie|Si mangiano con la pellicola, e le lenticchie importate sono talvolta essiccate chimicamente prima del raccolto.|Esistono lenticchie svizzere e francesi: un’ottima alternativa.|\nCeci|Le stesse pratiche di essiccazione chimica sono possibili all’importazione.|Sciacquare quelli in scatola riduce anche il sale.|\nFagioli secchi (rossi, bianchi)|Il bio evita i trattamenti chimici prima del raccolto.|I fagioli rossi vanno sempre cotti bene.|\nSoia, tofu e tempeh|Il bio garantisce soia senza OGM, spesso di origine europea.|Esiste tofu prodotto in Svizzera con soia locale.|\nUvetta|L’essiccazione concentra i residui di un frutto già molto trattato.|Una buona scelta bio per le merende dei bambini.|uva passa\nAlbicocche secche|Residui concentrati dall’essiccazione, spesso solfitate per mantenere il colore arancione.|Le albicocche secche scure, non solfitate, sono del tutto normali.|\nDatteri e fichi secchi|In genere pochi residui.|Verificate che non ci sia sciroppo di glucosio aggiunto.|\nMandorle|La pellicola marrone trattiene i residui. Negli Stati Uniti le mandorle californiane devono essere pastorizzate, a vapore o con fumigazione all’ossido di propilene, un procedimento vietato nell’UE e nel bio.|Preferite mandorle bio europee (Spagna, Italia) o, in mancanza, mandorle pelate.|\nArachidi|Residui regolari sulle arachidi convenzionali.|Bio o no, buttate quelle che sanno di muffa.|noccioline\nNoci|Il guscio protegge ma non è del tutto ermetico; i noci convenzionali sono trattati contro la carpocapsa e la mosca del mallo. I gherigli, ricchi di omega-3, sono fragili.|Le noci svizzere o francesi non trattate dopo il raccolto sono un’ottima alternativa.|gherigli\nSemi (zucca, girasole, lino, chia)|In genere pochi residui.|I semi di lino si digeriscono meglio macinati.|\nLatte intero|I residui liposolubili dell’alimentazione delle mucche passano nel grasso del latte. Il bio garantisce anche più pascolo e niente OGM.|In Svizzera il latte convenzionale è già piuttosto regolamentato: il bio è un plus, non un’urgenza.|latte\nLatte scremato e parzialmente scremato|La scrematura elimina la frazione grassa dove si concentrano i residui.|Il bio resta una scelta per il benessere animale, non una necessità sanitaria.|latte\nBurro e panna|Gli inquinanti che si fissano nei grassi si ritrovano qui più che nel latte.|Un burro di montagna o bio è una buona scelta.|\nFormaggio|I formaggi grassi concentrano i residui liposolubili. I formaggi DOP svizzeri impongono già regole severe di alimentazione.|Il Gruyère e l’Emmentaler DOP sono prodotti con latte senza insilati.|\nYogurt e dessert al latte|Le versioni aromatizzate contengono spesso additivi, più limitati nel bio.|Uno yogurt bianco con frutta fresca resta l’opzione migliore.|\nUova|Il bio garantisce mangimi senza pesticidi di sintesi né OGM, accesso all’aperto e niente antibiotici preventivi.|Nell’UE, il codice 0 sul guscio significa bio.|\nPetto di pollo e tacchino|Carne magra, senza il grasso dove si fissano i residui; il bio riguarda soprattutto il benessere animale.|Il pollame svizzero è regolamentato severamente; diffidate soprattutto di quello importato.|pollo tacchino\nMaiale|Carne grassa che accumula residui; allevamento spesso intensivo nel convenzionale.|Preferite carne svizzera con un marchio di benessere animale.|\nManzo, vitello e agnello|I tagli grassi accumulano i residui dell’alimentazione. Bio o filiera locale al pascolo.|Una carne locale da pascolo vale spesso quanto una carne bio importata.|\nSalumi|Molto grassi, e i conservanti nitriti sono quasi sistematici nel convenzionale; il bio li limita.|Il prosciutto «senza nitriti» esiste anche nel convenzionale.|prosciutto salame\nSalmone e trota d’allevamento|Il bio vieta i coloranti di sintesi nei mangimi e limita antibiotici e antiparassitari.|Il salmone selvaggio dell’Alaska è un’alternativa.|\nGamberi|Partite di gamberi d’allevamento importati, soprattutto da India e Vietnam, vengono ancora regolarmente respinte alla frontiera UE per antibiotici vietati. Il rischio dipende soprattutto dall’origine.|Scegliete bio, un marchio di acquacoltura riconosciuto o un’origine diversa dai paesi segnalati regolarmente.|gamberetti\nPesce bianco selvatico (merluzzo, nasello)|Carne molto magra che accumula pochi inquinanti; il bio non esiste per la pesca selvatica.|Qui il criterio giusto è un marchio di pesca sostenibile.|merluzzo nasello\nTonno e grandi pesci|Il bio non esiste per la pesca selvatica. Il vero inquinante è il mercurio nei grandi predatori.|Limitate tonno e pesce spada, soprattutto per donne incinte e bambini.|pesce spada\nBiscotti e dolci|Il bio evita alcuni pesticidi e additivi, ma mantiene lo stesso zucchero, gli stessi grassi e lo stesso sale. Meglio mangiarli meno spesso che pagare di più per il bio.|Un biscotto bio resta un biscotto ultra-processato.|\nCioccolato|Il cacao è molto trattato nei paesi produttori; il bio significa anche meno additivi.|Più il cioccolato è fondente, più la lista degli ingredienti è corta.|\nCrema spalmabile|Olio, zucchero e nocciole di provenienze varie; additivi frequenti.|Una crema di nocciole pura è un’alternativa semplice.|\nMarmellata e composta|La frutta trattata conserva parte dei residui dopo la cottura.|Per la marmellata di fragole o ciliegie, il bio vale particolarmente la pena.|confettura\nZucchero|La raffinazione elimina praticamente tutti i residui.|Lo zucchero svizzero proviene da barbabietole coltivate localmente.|\nMiele|Pochi residui; il bio riguarda soprattutto l’ambiente intorno agli alveari.|Un miele locale è spesso più sicuro di una miscela di mieli importati.|\nPatatine e snack salati|Il bio non cambia né il sale, né i grassi, né l’acrilammide della frittura.|Meglio ridurre la frequenza che pagare di più.|aperitivo crackers\nCaramelle e dolciumi|Il problema principale è lo zucchero, non i pesticidi. Il bio limita alcuni coloranti.|Attenzione ai coloranti E102, E110 ed E129.|\nTè|Le foglie non vengono mai lavate prima dell’infusione, e i tè convenzionali contengono spesso residui.|Per il tè verde, scegliere bio è particolarmente consigliato.|\nCaffè|I chicchi sono protetti dal frutto e la tostatura riduce i residui, ma la coltura è molto trattata.|Bio e commercio equo vanno spesso insieme.|\nTisane e infusi|Piante mai lavate: l’acqua calda estrae direttamente i residui.|Le tisane di piante svizzere sono una buona opzione.|\nVino|La vite è tra le colture più trattate (peronospora, oidio, muffa grigia), spesso con fungicidi sistemici che penetrano nell’acino. Nulla viene lavato o sbucciato prima della vinificazione: i residui passano nel mosto e i controlli ne trovano spesso tracce, in genere sotto i limiti di legge. Il vino convenzionale può inoltre ricevere molti più additivi e solfiti del bio.|Il mal di testa dopo un bicchiere non dipende sempre dai solfiti: contano anche l’alcol e l’istamina. Bio o no, il vino va bevuto con moderazione.|\nSucco di frutta|Parte dei residui della frutta finisce nel succo.|Per il succo di mela e d’uva, il bio vale la pena.|\nBevande vegetali (avena, soia, mandorla)|I residui di cereali e soia passano in parte nella bevanda.|Per la bevanda all’avena, consumata in quantità, il bio è consigliato.|latte di avena latte di soia\nBibite e bevande zuccherate|Il bio non cambia nulla per lo zucchero, il vero problema.|Evitate anche le versioni light: il bio vieta gli edulcoranti intensi, il convenzionale no.|\nBirra|Pochi residui dopo la fermentazione.|Il bio riguarda soprattutto la coltivazione di orzo e luppolo.|\nOli vergini (oliva, colza, lino, noce)|Spremuti a freddo senza raffinazione, trascinano i residui liposolubili del frutto o del seme.|L’olio di colza svizzero vergine è un’ottima opzione.|olio d’oliva olio di colza\nOli raffinati (girasole, frittura)|La raffinazione elimina i residui, a scapito dei micronutrienti.|Usateli per la cottura ad alte temperature.|olio di girasole\nSpezie ed erbe essiccate|Residui frequenti nelle spezie importate; il bio vieta anche l’irradiazione.|Compratele in piccole quantità: perdono l’aroma.|\nSalsa di pomodoro e ketchup|Pomodori trattati e additivi frequenti.|Una salsa fatta in casa con pomodori in scatola bio è semplice.|passata\nDado da brodo|Spesso ricco di additivi ed esaltatori di sapidità.|I brodi bio sono in genere senza glutammato aggiunto.|\nSale, aceto e senape|Pochi residui; il bio porta poco qui.|Per la senape, controllate l’origine dei semi.|\nErbe aromatiche fresche|Trattamenti frequenti su foglie nude, mangiate crude e poco sciacquate.|Asciugatele in un canovaccio pulito per conservarle più a lungo.|prezzemolo basilico erba cipollina coriandolo menta\nNoci pecan|Stessa famiglia della noce, con guscio più tenero; le colture statunitensi e messicane sono trattate regolarmente.|Conservatele in frigorifero: il loro olio irrancidisce in fretta.|pecan\nAnacardi|Il guscio contiene una resina caustica che protegge il seme dalle irrorazioni, ma la sgusciatura è un lavoro duro e spesso poco protetto.|Il bio o il commercio equo garantiscono condizioni di lavoro migliori.|\nNocciole|I noccioli convenzionali ricevono diversi insetticidi contro il balanino, che perfora il guscio ancora tenero.|La pellicola marrone si toglie facilmente dopo la tostatura.|\nPistacchi|Il guscio si apre sull’albero prima del raccolto: il seme è esposto ai trattamenti tardivi e alle muffe durante l’essiccazione.|Buttate quelli macchiati o che sanno di muffa.|\nNoci di macadamia|Uno dei gusci più duri e spessi in assoluto: il seme è quasi completamente protetto dalle irrorazioni.|Il rischio principale è un eventuale trattamento di conservazione durante il trasporto.|macadamia\nCreme di frutta secca (arachidi, mandorle…)|Semi macinati interi con la pellicola; le versioni convenzionali contengono spesso olio di palma, olio idrogenato o zucchero aggiunti.|Puntate al 100 % frutta secca, idealmente bio: un solo ingrediente in etichetta.|burro di arachidi crema di mandorle\nCachi morbido (al cucchiaio)|Varietà tradizionali mangiate mature al cucchiaio: la buccia spessa e cerosa, che si scarta, trattiene quasi tutti i residui. L’albero è inoltre robusto e poco trattato.|Sciacquatelo prima di aprirlo, poi prelevate la polpa con il cucchiaio.|kaki loto\nCachi duro (cachi mela, Persimon)|Varietà croccanti mangiate con la buccia, che fissa i trattamenti in campo e i conservanti dopo il raccolto.|L’astringenza viene spesso eliminata dopo il raccolto con CO₂ o etanolo: senza residui nocivi, ma un motivo in più per lavare bene la buccia.|kaki persimon cachi mela\nCachi essiccato|L’essiccazione concentra gli eventuali residui; i prodotti industriali importati sono talvolta fumigati.|L’hoshigaki giapponese tradizionale viene sbucciato prima dell’essiccazione.|kaki hoshigaki","legal":{"t":"Avvertenza","u":"Ultimo aggiornamento dei contenuti: ottobre 2026.","i":["BioSemafor fornisce informazioni generali a titolo indicativo. Non sostituiscono il parere di un medico, di un dietista o di un altro professionista della salute, in particolare durante la gravidanza, per i bambini piccoli, in caso di allergia o di malattia.","Le classificazioni si basano su dati pubblici sui residui di pesticidi, che variano secondo origine, stagione e produttore. Non costituiscono una valutazione di un prodotto, di un marchio o di un produttore specifico.","Nonostante la cura impiegata, non garantiamo l’esattezza né la completezza delle informazioni, che possono cambiare. Il loro utilizzo avviene sotto la vostra responsabilità, nei limiti previsti dalla legge.","I marchi e le denominazioni citati (Bio Suisse, IP-Suisse, Demeter, DOP, ecc.) appartengono ai rispettivi titolari. BioSemafor non è affiliato a nessuno di essi e non è un marchio di certificazione.","L’app stessa non raccoglie dati personali: solo la scelta della lingua viene salvata sul vostro dispositivo."]}},"es":{"name":"Español","ui":{"title":"¿Bio o no?","intro":"Para {n} alimentos del día a día, descubre cuándo merece de verdad la pena lo ecológico y cómo reducir los residuos cuando compras convencional.","ph":"Busca un alimento (p. ej. pasta, arroz, té)","search":"Buscar un alimento","all":"Todos","allCats":"Todas las categorías","levels":"Filtrar por nivel","catsL":"Filtrar por categoría","one":"alimento","many":"alimentos","empty":"Ningún alimento coincide con esta búsqueda. Prueba otra palabra o","reset":"muestra la lista completa","gest":"Buenos hábitos","noprep":"No necesita ninguna preparación especial.","close":"Cerrar","guideT":"Buenos hábitos, ecológico o no","lang":"Idioma","src":"Fuentes","srcIntro":"Principales fuentes consultadas en octubre de 2026. Los enlaces llevan a documentos externos."},"L":{"1":["Bio opcional","Pocos residuos o una protección natural. Lo convencional sirve; lo ecológico es sobre todo una cuestión ambiental."],"2":["Bio recomendado","Lo ecológico aporta un plus real, pero los buenos hábitos o un buen origen ya reducen mucho la exposición."],"3":["Bio prioritario","Residuos o problemas frecuentes que el lavado no resuelve. Aquí es donde lo ecológico marca más la diferencia."]},"cats":["Frutas","Verduras","Cereales y féculas","Legumbres","Frutos secos y semillas","Lácteos y huevos","Carne y pescado","Galletas y dulces","Bebidas","Aceites, especias y condimentos"],"M":"eau|Enjuague con agua corriente|30 segundos bajo el agua fría frotando con los dedos: más eficaz que un simple remojo.\nbica|Remojo en bicarbonato|Unos 10 g de bicarbonato (2 cucharaditas) por litro de agua fría, 12–15 minutos, y luego aclarar bien. Más eficaz que el agua sola o el vinagre contra los residuos superficiales.\nbrosse|Cepillado|Cepillo para verduras bajo el agua corriente, por toda la superficie.\npeler|Pelado|Elimina la mayoría de los residuos superficiales, pero también parte de la fibra y las vitaminas.\nfeuilles|Quitar las hojas exteriores|Son las más expuestas a los tratamientos y a la suciedad.\nbassine|Lavado hoja por hoja|Separar las hojas, sumergirlas en mucha agua, remover, cambiar el agua dos veces y aclarar.\ndoux|Lavado delicado|En un colador, bajo un hilo de agua, justo antes de comerlos.\nessuyer|Limpieza con paño|Papel húmedo o un enjuague rapidísimo: absorben el agua como una esponja.\nriz|Lavado y cocción en mucha agua|Lavar hasta que el agua salga clara, cocer en unas 6 partes de agua por 1 de arroz y escurrir. Reduce mucho el arsénico, ecológico o no.\ntremper|Remojo y enjuague|Legumbres secas: remojar una noche, tirar el agua y enjuagar. En bote: enjuagar y escurrir.\ningr|La regla de los 5 ingredientes|Busca listas cortas. Lo ecológico solo autoriza unos 50 aditivos, frente a más de 300 en lo convencional, y prohíbe colorantes sintéticos, aromas artificiales y edulcorantes intensos.\nverre|Preferir el vidrio|Los tarros de vidrio evitan la migración de plastificantes y bisfenoles a los alimentos grasos o ácidos.\necreme|Desnatada o semidesnatada|Los residuos liposolubles se concentran en la grasa: una leche desnatada convencional contiene muchos menos.\nlabel|Si no, un sello exigente|En Suiza, IP-Suisse limita algunos tratamientos de los cereales; un origen suizo o europeo suele estar más regulado.\ngras|Quitar la grasa visible|Algunos contaminantes (dioxinas, PCB) se acumulan en las grasas animales.\npetits|Variar y preferir pescado pequeño|Sardina, caballa, arenque: menos mercurio que los grandes depredadores (atún, pez espada).\norigine|Mirar el origen|La producción suiza o europea está sujeta a normas más estrictas sobre pesticidas y antibióticos.\nsulfites|Evitar los sulfitos si es posible|Busca la mención «sin sulfitos»: el color será más oscuro, es normal.\nmonder|Elegir los repelados|La piel marrón concentra los residuos: las almendras o avellanas repeladas (sin piel) contienen muchos menos.\nstock|Elegir y conservar bien|Evita los frutos manchados, que se desmenuzan, amargos o rancios (riesgo de mohos y aflatoxinas, ecológicos o no). Prefiere envases herméticos al granel expuesto al aire.\nvinlabel|Elegir el sello|Ecológico (Bio Suisse, hoja de la UE): sin pesticidas de síntesis, aditivos limitados. Biodinámico (Demeter): normas aún más estrictas. Vino natural: uva ecológica, sin aditivos, sulfitos muy bajos.\nvinsulf|Mirar los sulfitos|Límites máximos para un tinto seco: 150 mg/l en convencional, 100 en ecológico, unos 70 en biodinámico Demeter, menos de 30 en vino natural certificado. Los blancos suelen tener más.\nvincouleur|Tinto o blanco|El tinto macera mucho tiempo con los hollejos, donde están los residuos; el blanco se prensa rápido pero recibe más sulfitos.","guide":["Lava justo antes de comer o cocinar: la fruta lavada y luego guardada se estropea antes.","Agua corriente frotando: es lo básico. El remojo en bicarbonato (unos 10 g por litro, 12–15 minutos, y luego aclarado) elimina más residuos superficiales.","Nunca jabón, lavavajillas ni lejía: penetran en los alimentos. El vinagre no hace más que el bicarbonato.","Lava también lo que vas a pelar (melón, aguacate, cítricos): el cuchillo arrastra los residuos de la piel a la pulpa.","El lavado solo actúa en la superficie. Los pesticidas llamados sistémicos están en la pulpa: solo lo ecológico los evita.","Varía frutas, verduras y orígenes para limitar la exposición a un mismo producto.","Los productos procesados (pasta, galletas, cereales) no se pueden lavar: la elección se hace al comprar. Lo integral concentra más residuos que lo refinado.","Ecológico no significa sano: las patatas fritas, galletas o cremas para untar ecológicas tienen el mismo azúcar, sal y grasas. Mejor comerlas con menos frecuencia.","Prefiere el vidrio a las latas barnizadas y las bandejas de plástico calentadas, sobre todo para alimentos grasos o ácidos.","Productos animales: los residuos se fijan en la grasa. La carne magra y la leche desnatada convencionales plantean menos problemas que la mantequilla, los quesos grasos o los embutidos.","Una fruta convencional bien lavada es mucho mejor para la salud que no comer fruta."],"foot":"Clasificación orientativa, basada en los análisis de residuos de pesticidas publicados cada año (en particular la clasificación del Environmental Working Group, basada en datos estadounidenses) y en los controles europeos. Los residuos varían según el origen, la temporada y el productor, y suelen estar por debajo de los límites legales. Comprar local y de temporada también reduce algunos tratamientos poscosecha. En Suiza, el sello Bio Suisse es uno de los más exigentes.","items":"Fresa|Entre las frutas más contaminadas, con varios residuos por muestra. Piel fina que no se puede pelar.|Lávalas antes de quitar el rabito; si no, el agua entra en la fruta. Son delicadas: bastan 2–3 minutos de remojo.|fresón frutilla\nUva|La vid es uno de los cultivos más tratados, y la uva se come con piel.|Separa los granos del racimo antes del remojo para que el agua llegue a todas partes.|\nMelocotón y nectarina|Fruta delicada y muy tratada; la piel aterciopelada del melocotón retiene los residuos.|Si no es ecológico, pelarlo sigue siendo lo más eficaz.|durazno\nManzana|Una de las frutas que más tratamientos recibe por temporada en cultivo convencional.|El remojo en bicarbonato de 12–15 minutos es el método más estudiado en la manzana. Los residuos que ya entraron en la pulpa no salen.|\nPera|Residuos frecuentes, comparable a la manzana.|Mismo método que para la manzana.|\nCereza|Residuos frecuentes; se come entera con la piel.|Deja el rabito durante el lavado para que el agua no entre en la fruta.|\nArándano|Frutos pequeños de piel fina, se comen enteros; residuos habituales.|Los arándanos ecológicos congelados suelen ser más baratos que los frescos.|\nFrambuesa|Sin piel protectora y con pulpa esponjosa que absorbe los fungicidas.|No las dejes en remojo: se empapan y se aplastan.|\nMora|Sin piel protectora y con pulpa esponjosa, se come entera.|Las moras silvestres, recogidas lejos de las carreteras, son una excelente opción.|zarzamora\nGrosella roja y negra|Frutos pequeños que se comen enteros, residuos habituales.|Desgránalas después de lavarlas, no antes.|\nAlbaricoque|Fruta de hueso a menudo tratada, se come con piel.|Misma lógica que el melocotón, con algo menos de residuos de media.|damasco\nCiruela|Tratada contra insectos hasta poco antes de la cosecha y se come con piel.|La capa blanquecina de la piel es natural, no es un residuo.|\nRuibarbo|Tallos expuestos, residuos moderados.|Quitar las hebras del tallo elimina también buena parte de los residuos.|\nLimón y lima|La pulpa está poco expuesta, pero la piel suele recibir fungicidas y cera tras la cosecha.|Para la ralladura: ecológico o «sin tratar tras la cosecha». Solo para zumo, el convencional sirve.|cítricos\nNaranja, clementina, pomelo|Piel tratada tras la cosecha (fungicidas, cera), pulpa poco expuesta.|Lávate las manos después de pelarla, sobre todo antes de dar gajos a los niños.|cítricos mandarina\nPlátano|Piel gruesa que se retira; la pulpa está muy poco expuesta.|Aquí lo ecológico importa sobre todo por el medio ambiente y los trabajadores de las plantaciones.|banana\nAguacate|Piel gruesa que no se come; una de las frutas menos contaminadas.|Enjuágalo igualmente antes de cortarlo: el cuchillo arrastra los residuos hacia la pulpa.|palta\nPiña|Corteza gruesa que se retira; la pulpa está muy poco expuesta.|Enjuaga la corteza antes de cortar.|\nMango|Piel gruesa que no se come.|Por el medio ambiente, elige mangos llegados en barco y no en avión.|\nKiwi|Pocos residuos; la piel suele retirarse.|Si te comes la piel, cepíllalo antes.|\nMelón|Corteza gruesa; la pulpa está poco expuesta.|Lava la corteza antes de cortar: el cuchillo atraviesa la superficie.|\nSandía|Corteza gruesa; entre las frutas menos contaminadas.|Misma precaución que con el melón.|\nHigo fresco|En general poco tratado.|Es delicado: lávalo justo antes de comerlo.|\nGranada|Piel gruesa que no se come.|Desgránala en un bol con agua: los granos se hunden y la piel flota.|\nLichi y papaya|Piel que no se come, pocos residuos en la pulpa.|Enjuaga antes de abrir.|\nEspinacas|Hojas grandes muy expuestas a los tratamientos; residuos frecuentes y múltiples.|Las espinacas ecológicas congeladas son una alternativa económica.|\nCol rizada (kale)|Hojas rizadas que retienen residuos; a menudo se detectan varios pesticidas.|Quita los tallos centrales gruesos, más difíciles de limpiar.|kale\nPimiento y guindilla|Residuos frecuentes, sobre todo en productos importados fuera de temporada.|Asados al horno y pelados, pierden casi toda la piel.|chile ají\nJudías verdes|Residuos frecuentes, a veces varias sustancias por muestra.|La cocción no destruye los pesticidas: lávalas antes de despuntarlas.|vainas ejotes\nApio|Sus tallos estriados canalizan y retienen el agua de los tratamientos; se come a menudo crudo.|Quita las hebras exteriores y la base, más cargadas.|\nTomate|Residuos habituales, pero piel lisa que se lava bien.|De temporada y cultivado al aire libre, suele estar menos tratado.|\nLechuga|Máxima superficie de hojas expuesta a las pulverizaciones, sobre todo la lechuga de invernadero en invierno.|Una centrifugadora de ensalada ayuda a enjuagar bien sin estropear las hojas.|ensalada\nRúcula y canónigos|Brotes jóvenes muy expuestos, se comen crudos.|Aunque sea «lista para comer», un enjuague no está de más.|\nPepino|Los residuos quedan en la piel; la pulpa está bien una vez pelado.|Pelado, un pepino convencional está perfectamente bien.|\nCalabacín|Residuos concentrados en la piel fina, que se suele comer.|Pelado, o tras un remojo en bicarbonato, un calabacín convencional sirve.|zucchini\nBerenjena|Residuos concentrados en la piel; la pulpa está bien una vez pelada.|Se pela fácilmente una vez asada.|\nRábano|Raíz en contacto con el suelo, se come cruda con piel.|Quita las hojas y la punta.|\nPatata|Residuos sobre todo en la piel.|No comas las partes verdes o con brotes, sea ecológica o no.|papa\nBrócoli|Pocos residuos de media.|Sumérgelo boca abajo unos minutos para soltar insectos y suciedad.|\nColiflor|Las hojas protegen la pella; pocos residuos.|Mismo truco que con el brócoli.|\nCol y coles de Bruselas|Las hojas exteriores protegen el corazón.|Basta con quitar dos o tres hojas exteriores.|repollo\nZanahoria|Residuos bajos, concentrados en la piel.|Una zanahoria joven bien cepillada no necesita pelarse.|\nRemolacha|Poco tratada, la piel se quita tras la cocción.|Cocida con piel conserva mejor su color.|betabel\nNabo, chirivía, apionabo|Raíces que se pelan, pocos residuos.|Pela fino para conservar la pulpa.|\nCalabaza|Corteza gruesa, pocos residuos.|La calabaza Hokkaido se come con piel: cepíllala bien.|\nPuerro|Pocos residuos, pero tierra entre las hojas.|Ábrelo a lo largo y enjuaga entre las hojas.|\nEndibia|Cultivada en la oscuridad, poco tratada.|No la dejes en remojo: se vuelve amarga.|\nHinojo|Sus capas estriadas retienen el agua de los tratamientos.|Quita la capa exterior, más expuesta.|\nAlcachofa|Brácteas protectoras, corazón poco expuesto.|Enjuágala boca abajo.|\nAcelgas|Hojas grandes muy expuestas a las pulverizaciones.|Lava por separado las pencas y las hojas.|\nCebolla y chalota|Las capas exteriores protegen la parte comestible.|Basta con quitar la primera capa carnosa además de la piel.|\nAjo|Pocos residuos; mejor de origen europeo.|El ajo importado de lejos a veces se trata contra la germinación.|\nJengibre|Pocos residuos, sobre todo pelado.|Una cucharilla raspa la piel sin desperdiciar.|\nChampiñones|Los champiñones se cultivan en interior, sin pulverizaciones.|Corta el extremo terroso del pie.|setas hongos\nEspárragos|Poco tratados de media.|Pela los espárragos blancos de arriba abajo.|\nMaíz dulce|Las hojas que envuelven la mazorca la protegen.|Quita las hojas y las barbas justo antes de cocinar.|choclo elote\nBoniato|Pocos residuos, sobre todo en la piel.|Bien cepillado, puede cocinarse con piel.|batata camote\nGuisantes|La vaina protege los guisantes; residuos raros.|Los guisantes congelados convencionales son muy buena opción.|arvejas chícharos\nArroz blanco basmati y tailandés (jazmín)|El pulido elimina gran parte de los residuos. Pero los controles oficiales, en Suiza como en la UE, encuentran con regularidad en los arroces importados de Asia pesticidas aquí prohibidos; el arroz ecológico sale claramente mejor parado.|Lo ecológico resuelve los pesticidas, no el arsénico: cocerlo en mucha agua sigue siendo útil.|basmati jazmín\nArroz integral, rojo o negro|La cáscara conservada acumula residuos de pesticidas y concentra más arsénico.|Cómpralo ecológico y alterna con otros cereales.|\nArroz blanco europeo (redondo, risotto, Camarga)|Cultivado según las normas europeas, tiene pocos residuos. El arsénico, en cambio, afecta a todo el arroz, ecológico o no.|Para el risotto no se lava: simplemente varía los cereales durante la semana.|arborio bomba\nCopos de avena y muesli|Se comen como grano entero. Se encuentran con frecuencia residuos de reguladores de crecimiento (clormequat) en productos de avena convencional, sobre todo de Norteamérica, donde la avena también se seca a veces químicamente antes de la cosecha, una práctica prohibida en Suiza.|Para los niños que la comen a diario, es una de las compras ecológicas más útiles.|avena porridge granola\nPasta integral y semiintegral|El salvado conservado acumula reguladores de crecimiento y fungicidas del trigo.|Lo integral tiene verdaderas ventajas nutricionales: justo ahí merece la pena lo ecológico.|espaguetis macarrones\nPasta blanca|La molienda elimina el salvado y el germen, donde está la mayoría de los residuos.|En Suiza está prohibido tratar los cereales con glifosato justo antes de la cosecha, algo que no ocurre en todos los países exportadores: elige trigo de origen suizo o europeo.|espaguetis macarrones fideos lasaña\nPan y harina integrales|Como en la pasta integral, el salvado concentra los residuos.|Un pan ecológico de masa madre es un excelente compromiso entre sabor, digestión y residuos.|centeno espelta\nPan blanco y harina blanca|Solo se usa el corazón del grano: muchos menos residuos que el integral.|El pan industrial suele contener más aditivos que el de panadería.|harina barra\nSémola, cuscús y bulgur|De trigo duro refinado; mismas cuestiones que la pasta blanca.|Las versiones integrales, en cambio, conviene comprarlas ecológicas.|\nQuinoa y trigo sarraceno|Plantas rústicas, poco tratadas; la quinoa está protegida por saponinas amargas.|Enjuágala bien antes de cocinarla para quitar el amargor.|alforfón\nPolenta y maíz|El maíz convencional está tratado, y lo ecológico garantiza que no es transgénico.|Elige polenta de origen europeo.|harina de maíz\nCereales de desayuno|Mezcla de cereales tratados, azúcar y aditivos.|Las versiones ecológicas suelen tener menos aditivos, pero no necesariamente menos azúcar.|corn flakes\nLentejas|Se comen con su piel, y las lentejas importadas a veces se secan químicamente antes de la cosecha.|Existen lentejas suizas y francesas: una muy buena alternativa.|\nGarbanzos|Las mismas prácticas de secado químico son posibles en la importación.|Enjuagar los de bote también reduce la sal.|\nAlubias secas (rojas, blancas)|Lo ecológico evita los tratamientos químicos antes de la cosecha.|Las alubias rojas deben cocerse siempre bien.|judías frijoles\nSoja, tofu y tempeh|Lo ecológico garantiza soja no transgénica, a menudo de origen europeo.|Existe tofu elaborado en Suiza con soja local.|\nPasas|El secado concentra los residuos de una fruta ya muy tratada.|Una buena opción ecológica para las meriendas de los niños.|\nOrejones|Residuos concentrados por el secado, a menudo sulfitados para mantener el color naranja.|Los orejones oscuros, sin sulfitos, son totalmente normales.|albaricoques secos\nDátiles e higos secos|En general pocos residuos.|Comprueba que no lleven jarabe de glucosa añadido.|\nAlmendras|La piel marrón retiene los residuos. En Estados Unidos, las almendras de California deben pasteurizarse, con vapor o por fumigación con óxido de propileno, un procedimiento prohibido en la UE y en ecológico.|Elige almendras ecológicas europeas (España, Italia) o, si no, almendras repeladas.|\nCacahuetes|Residuos habituales en los cacahuetes convencionales.|Ecológicos o no, tira los que sepan a moho.|maní\nNueces|La cáscara protege pero no es del todo estanca; los nogales convencionales se tratan contra la carpocapsa y la mosca de la nuez. Las nueces, ricas en omega-3, son frágiles.|Las nueces suizas o francesas sin tratar tras la cosecha son una muy buena alternativa.|\nSemillas (calabaza, girasol, lino, chía)|En general pocos residuos.|Las semillas de lino se digieren mejor molidas.|\nLeche entera|Los residuos liposolubles de la alimentación de las vacas pasan a la grasa de la leche. Lo ecológico garantiza además más pastoreo y nada de transgénicos.|En Suiza la leche convencional ya está bastante regulada: lo ecológico es un plus, no una urgencia.|leche\nLeche desnatada y semidesnatada|El desnatado retira la fracción grasa donde se concentran los residuos.|Lo ecológico sigue siendo una opción por el bienestar animal, no una necesidad sanitaria.|leche\nMantequilla y nata|Los contaminantes que se fijan en las grasas se encuentran aquí más que en la leche.|Una mantequilla de montaña o ecológica es buena opción.|crema\nQueso|Los quesos grasos concentran los residuos liposolubles. Las DOP suizas ya imponen normas estrictas de alimentación.|El Gruyère y el Emmentaler DOP se elaboran con leche sin ensilado.|\nYogures y postres lácteos|Las versiones aromatizadas suelen llevar aditivos, más limitados en lo ecológico.|Un yogur natural con fruta fresca sigue siendo la mejor opción.|\nHuevos|Lo ecológico garantiza pienso sin pesticidas de síntesis ni transgénicos, acceso al aire libre y sin antibióticos preventivos.|En la UE, el código 0 en la cáscara significa ecológico.|\nPechuga de pollo y pavo|Carne magra, sin la grasa donde se fijan los residuos; lo ecológico se centra sobre todo en el bienestar animal.|Las aves suizas están muy reguladas; desconfía sobre todo de las importadas.|pollo pavo\nCerdo|Carne grasa que acumula residuos; cría a menudo intensiva en convencional.|Prefiere carne suiza con un sello de bienestar animal.|\nTernera, vaca y cordero|Los cortes grasos acumulan los residuos de la alimentación. Ecológico o de pasto local.|Una carne local de pasto vale a menudo tanto como una ecológica importada.|res\nEmbutidos|Muy grasos, y los conservantes nitritos son casi sistemáticos en convencional; lo ecológico los limita.|El jamón «sin nitritos» también existe en convencional.|jamón salchichón chorizo\nSalmón y trucha de piscifactoría|Lo ecológico prohíbe los colorantes sintéticos en el pienso y limita antibióticos y antiparasitarios.|El salmón salvaje de Alaska es una alternativa.|\nGambas y langostinos|Partidas de gambas de piscifactoría importadas, sobre todo de la India y Vietnam, siguen siendo rechazadas con regularidad en la frontera de la UE por antibióticos prohibidos. El riesgo depende sobre todo del origen.|Elige ecológico, un sello de acuicultura reconocido o un origen distinto de los países señalados con regularidad.|camarones\nPescado blanco salvaje (bacalao, abadejo)|Carne muy magra que acumula pocos contaminantes; lo ecológico no existe para la pesca salvaje.|Aquí el criterio correcto es un sello de pesca sostenible.|bacalao merluza abadejo\nAtún y grandes peces|Lo ecológico no existe para la pesca salvaje. El verdadero contaminante es el mercurio en los grandes depredadores.|Limita el atún y el pez espada, sobre todo en embarazadas y niños.|pez espada\nGalletas y bollería|Lo ecológico evita algunos pesticidas y aditivos, pero mantiene el mismo azúcar, grasas y sal. Mejor comerlas con menos frecuencia que pagar más por lo ecológico.|Una galleta ecológica sigue siendo una galleta ultraprocesada.|pasteles\nChocolate|El cacao se trata mucho en los países productores; lo ecológico implica también menos aditivos.|Cuanto más negro es el chocolate, más corta es la lista de ingredientes.|\nCrema de cacao para untar|Aceite, azúcar y avellanas de orígenes variados; aditivos frecuentes.|Una crema de avellanas pura es una alternativa sencilla.|\nMermelada y compota|La fruta tratada conserva parte de sus residuos tras la cocción.|Para la mermelada de fresa o cereza, lo ecológico merece especialmente la pena.|confitura\nAzúcar|El refinado elimina prácticamente todos los residuos.|El azúcar suizo procede de remolacha cultivada localmente.|\nMiel|Pocos residuos; lo ecológico tiene que ver sobre todo con el entorno de las colmenas.|Una miel local suele ser más segura que una mezcla de mieles importadas.|\nPatatas fritas y aperitivos salados|Lo ecológico no cambia ni la sal, ni las grasas, ni la acrilamida de la fritura.|Mejor reducir la frecuencia que pagar más.|snacks crackers\nCaramelos y golosinas|El principal problema es el azúcar, no los pesticidas. Lo ecológico limita algunos colorantes.|Cuidado con los colorantes E102, E110 y E129.|chuches dulces\nTé|Las hojas nunca se lavan antes de la infusión, y los tés convencionales contienen a menudo residuos.|Para el té verde, elegir ecológico es especialmente recomendable.|\nCafé|Los granos están protegidos por el fruto y el tostado reduce los residuos, pero el cultivo está muy tratado.|Lo ecológico y el comercio justo suelen ir juntos.|\nInfusiones y tisanas|Plantas que nunca se lavan: el agua caliente extrae directamente los residuos.|Las infusiones de plantas suizas son una buena opción.|\nVino|La vid es uno de los cultivos más tratados (mildiu, oídio, podredumbre gris), a menudo con fungicidas sistémicos que penetran en la uva. Nada se lava ni se pela antes de la vinificación: los residuos pasan al mosto, y los controles encuentran trazas con frecuencia, por lo general por debajo de los límites legales. El vino convencional puede además recibir muchos más aditivos y sulfitos que el ecológico.|El dolor de cabeza tras una copa no siempre se debe a los sulfitos: el alcohol y la histamina también influyen. Ecológico o no, el vino se disfruta con moderación.|\nZumo de frutas|Parte de los residuos de la fruta acaba en el zumo.|Para el zumo de manzana y de uva, lo ecológico merece la pena.|jugo\nBebidas vegetales (avena, soja, almendra)|Los residuos de cereales y soja pasan en parte a la bebida.|Para la bebida de avena, que se toma en cantidad, se recomienda ecológica.|leche de avena leche de soja\nRefrescos y bebidas azucaradas|Lo ecológico no cambia nada en el azúcar, el verdadero problema.|Evita también las versiones light: lo ecológico prohíbe los edulcorantes intensos, lo convencional no.|gaseosa\nCerveza|Pocos residuos tras la elaboración.|Lo ecológico afecta sobre todo al cultivo de la cebada y el lúpulo.|\nAceites vírgenes (oliva, colza, lino, nuez)|Prensados en frío sin refinar, arrastran los residuos liposolubles del fruto o la semilla.|El aceite de colza virgen suizo es muy buena opción.|aceite de oliva\nAceites refinados (girasol, para freír)|El refinado elimina los residuos, a costa de los micronutrientes.|Resérvalos para cocinar a altas temperaturas.|aceite de girasol\nEspecias y hierbas secas|Residuos frecuentes en las especias importadas; lo ecológico prohíbe además la irradiación.|Cómpralas en pequeñas cantidades: pierden su aroma.|\nSalsa de tomate y kétchup|Tomates tratados y aditivos frecuentes.|Una salsa casera con tomate en conserva ecológico es fácil.|tomate frito\nPastillas de caldo|A menudo ricas en aditivos y potenciadores del sabor.|Los caldos ecológicos suelen ir sin glutamato añadido.|\nSal, vinagre y mostaza|Pocos residuos; lo ecológico aporta poco aquí.|Para la mostaza, mira el origen de las semillas.|\nHierbas aromáticas frescas|Tratamientos frecuentes sobre hojas desnudas, que se comen crudas y poco enjuagadas.|Sécalas en un paño limpio para conservarlas más tiempo.|perejil albahaca cebollino cilantro menta\nNueces pecanas|Misma familia que la nuez, con cáscara más blanda; los cultivos de EE. UU. y México se tratan con regularidad.|Guárdalas en la nevera: su aceite se enrancia rápido.|pecán\nAnacardos|La cáscara contiene una resina cáustica que protege la semilla de las pulverizaciones, pero el descascarillado es un trabajo duro y a menudo mal protegido.|Lo ecológico o el comercio justo garantizan mejores condiciones laborales.|castañas de cajú\nAvellanas|Los avellanos convencionales reciben varios insecticidas contra el balanino, que perfora la cáscara aún blanda.|La piel marrón se quita fácilmente tras tostarlas.|\nPistachos|La cáscara se abre en el árbol antes de la cosecha: la semilla queda expuesta a los tratamientos tardíos y a los mohos durante el secado.|Tira los que estén manchados o sepan a moho.|\nNueces de macadamia|Una de las cáscaras más duras y gruesas que existen: la semilla está casi totalmente protegida de las pulverizaciones.|El principal riesgo es un posible tratamiento de conservación durante el transporte.|macadamia\nCremas de frutos secos (cacahuete, almendra…)|Semillas molidas enteras con su piel; las versiones convencionales suelen llevar aceite de palma, aceite hidrogenado o azúcar añadidos.|Busca 100 % frutos secos, idealmente ecológicos: un solo ingrediente en la etiqueta.|mantequilla de cacahuete crema de almendra\nCaqui blando (a cucharadas)|Variedades tradicionales que se comen muy maduras con cuchara: la piel gruesa y cerosa, que se desecha, retiene la mayoría de los residuos. Además, el árbol es robusto y poco tratado.|Enjuágalo antes de abrirlo y saca la pulpa con una cuchara.|kaki palosanto\nCaqui duro (Persimon, Rojo Brillante)|Variedades crujientes que se comen con piel, la cual fija los tratamientos de campo y los conservantes poscosecha.|Su astringencia se elimina a menudo tras la cosecha con CO₂ o etanol: sin residuos nocivos, pero un motivo más para lavar bien la piel.|kaki persimon\nCaqui seco|El secado concentra los posibles residuos; los productos industriales importados a veces se fumigan.|El hoshigaki japonés tradicional se pela antes de secarlo.|kaki hoshigaki","legal":{"t":"Aviso","u":"Última actualización del contenido: octubre de 2026.","i":["BioSemafor ofrece información general orientativa. No sustituye el consejo de un médico, dietista u otro profesional de la salud, especialmente durante el embarazo, para niños pequeños o en caso de alergia o enfermedad.","Las clasificaciones se basan en datos públicos sobre residuos de pesticidas, que varían según el origen, la temporada y el productor. No constituyen una evaluación de ningún producto, marca o productor concreto.","Aunque se ha elaborado con cuidado, no garantizamos la exactitud ni la exhaustividad de la información, que puede cambiar. Su uso es bajo tu propia responsabilidad, dentro de los límites que establece la ley.","Los sellos y denominaciones citados (Bio Suisse, IP-Suisse, Demeter, DOP, etc.) pertenecen a sus titulares. BioSemafor no está afiliado a ninguno de ellos y no es un sello de certificación.","La aplicación en sí no recoge datos personales: solo se guarda en tu dispositivo el idioma elegido."]}},"pt":{"name":"Português","ui":{"title":"Bio ou não?","intro":"Para {n} alimentos do dia a dia, saiba quando o biológico vale mesmo a pena e como reduzir os resíduos quando compra convencional.","ph":"Procurar um alimento (ex. massa, arroz, chá)","search":"Procurar um alimento","all":"Todos","allCats":"Todas as categorias","levels":"Filtrar por nível","catsL":"Filtrar por categoria","one":"alimento","many":"alimentos","empty":"Nenhum alimento corresponde a esta pesquisa. Experimente outra palavra ou","reset":"mostre a lista completa","gest":"Bons hábitos","noprep":"Não precisa de preparação especial.","close":"Fechar","guideT":"Bons hábitos, biológico ou não","lang":"Idioma","src":"Fontes","srcIntro":"Principais fontes consultadas em outubro de 2026. Os links levam a documentos externos."},"L":{"1":["Bio facultativo","Poucos resíduos ou uma proteção natural. O convencional serve; o biológico é sobretudo uma questão ambiental."],"2":["Bio recomendado","O biológico traz uma verdadeira mais-valia, mas bons hábitos ou uma boa origem já reduzem muito a exposição."],"3":["Bio prioritário","Resíduos ou problemas frequentes que a lavagem não resolve. É aqui que o biológico faz mais diferença."]},"cats":["Fruta","Legumes","Cereais e amiláceos","Leguminosas","Frutos secos e sementes","Laticínios e ovos","Carne e peixe","Bolachas e doces","Bebidas","Óleos, especiarias e condimentos"],"M":"eau|Lavar em água corrente|30 segundos em água fria a esfregar com os dedos: mais eficaz do que deixar de molho.\nbica|Molho em bicarbonato|Cerca de 10 g de bicarbonato (2 colheres de chá) por litro de água fria, 12–15 minutos, depois enxaguar bem. Mais eficaz do que só água ou vinagre nos resíduos de superfície.\nbrosse|Escovar|Escova de legumes em água corrente, em toda a superfície.\npeler|Descascar|Remove a maior parte dos resíduos de superfície, mas também parte das fibras e vitaminas.\nfeuilles|Retirar as folhas exteriores|São as mais expostas aos tratamentos e à sujidade.\nbassine|Lavar folha a folha|Separar as folhas, mergulhá-las em muita água, mexer, mudar a água duas vezes e enxaguar.\ndoux|Lavagem suave|Num escorredor, sob um fio de água, mesmo antes de comer.\nessuyer|Limpar com pano|Papel húmido ou passagem muito rápida por água: absorvem a água como uma esponja.\nriz|Lavar e cozer em muita água|Lavar até a água sair limpa, cozer em cerca de 6 partes de água para 1 de arroz e escorrer. Reduz bastante o arsénio, biológico ou não.\ntremper|Demolhar e enxaguar|Leguminosas secas: demolhar durante a noite, deitar fora a água, enxaguar. Em lata: enxaguar e escorrer.\ningr|A regra dos 5 ingredientes|Prefira listas curtas. O biológico só autoriza cerca de 50 aditivos, contra mais de 300 no convencional, e proíbe corantes sintéticos, aromas artificiais e edulcorantes intensos.\nverre|Preferir o vidro|Os frascos de vidro evitam a migração de plastificantes e bisfenóis para alimentos gordos ou ácidos.\necreme|Magro ou meio-gordo|Os resíduos lipossolúveis concentram-se na gordura: um leite magro convencional contém muito menos.\nlabel|Caso contrário, um selo exigente|Na Suíça, o IP-Suisse limita alguns tratamentos dos cereais; uma origem suíça ou europeia é em geral mais regulada.\ngras|Retirar a gordura visível|Alguns poluentes (dioxinas, PCB) acumulam-se nas gorduras animais.\npetits|Variar e preferir peixes pequenos|Sardinha, cavala, arenque: menos mercúrio do que os grandes predadores (atum, espadarte).\norigine|Ver a origem|A produção suíça ou europeia está sujeita a regras mais rigorosas sobre pesticidas e antibióticos.\nsulfites|Evitar sulfitos se possível|Procure a menção «sem sulfitos»: a cor será mais escura, é normal.\nmonder|Preferir sem pele|A pele castanha concentra os resíduos: amêndoas ou avelãs sem pele contêm muito menos.\nstock|Escolher e guardar bem|Evite frutos manchados, que se esfarelam, amargos ou rançosos (risco de bolores e aflatoxinas, biológicos ou não). Prefira embalagens herméticas ao granel exposto ao ar.\nvinlabel|Escolher o selo|Biológico (Bio Suisse, folha da UE): sem pesticidas de síntese, aditivos limitados. Biodinâmico (Demeter): regras ainda mais rigorosas. Vinho natural: uvas biológicas, sem aditivos, sulfitos muito baixos.\nvinsulf|Ver os sulfitos|Limites máximos para um tinto seco: 150 mg/l no convencional, 100 no biológico, cerca de 70 no biodinâmico Demeter, menos de 30 no vinho natural certificado. Os brancos têm em geral mais.\nvincouleur|Tinto ou branco|O tinto macera muito tempo com as películas, onde estão os resíduos; o branco é prensado depressa mas recebe mais sulfitos.","guide":["Lave mesmo antes de comer ou cozinhar: a fruta lavada e depois guardada estraga-se mais depressa.","Água corrente a esfregar é a base. O molho em bicarbonato (cerca de 10 g por litro, 12–15 minutos, depois enxaguar) remove mais resíduos de superfície.","Nunca use sabão, detergente da loiça nem lixívia: penetram nos alimentos. O vinagre não faz melhor do que o bicarbonato.","Lave também o que vai descascar (melão, abacate, citrinos): a faca arrasta os resíduos da casca para a polpa.","A lavagem só atua à superfície. Os pesticidas ditos sistémicos estão na polpa: só o biológico os evita.","Varie frutas, legumes e origens para limitar a exposição a um mesmo produto.","Os produtos transformados (massa, bolachas, cereais) não se podem lavar: a escolha faz-se na
