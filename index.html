<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioSemafor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFCF8; --surface:#EEF2E6; --raised:#FFFFFF; --ink:#18261E; --muted:#5A6A5F; --line:#D7DFCC;
  --l3:#C8352B; --l3-soft:#FBE4E1; --l2:#B9820C; --l2-soft:#FBF0D4; --l1:#3F7F31; --l1-soft:#E2F0DC;
  --focus:#2F6FD6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121A15; --surface:#1B2620; --raised:#202D26; --ink:#E9F0E6; --muted:#A3B3A6; --line:#2F3D35;
    --l3:#F0786C; --l3-soft:#3A1F1C; --l2:#E8BA4A; --l2-soft:#352B14; --l1:#86C774; --l1-soft:#1F3320;
    --focus:#7EA9F2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A15; --surface:#1B2620; --raised:#202D26; --ink:#E9F0E6; --muted:#A3B3A6; --line:#2F3D35;
  --l3:#F0786C; --l3-soft:#3A1F1C; --l2:#E8BA4A; --l2-soft:#352B14; --l1:#86C774; --l1-soft:#1F3320;
  --focus:#7EA9F2; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 140px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* En-tête */
.hero{padding:20px 0 8px}
.langbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.langbar select{font:inherit;font-size:15px;color:var(--ink);background:var(--raised);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
.hero h1{font-size:clamp(2.4rem,10vw,4rem);font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:.28em;flex-wrap:wrap}
.logo{height:.82em;width:auto;flex:none}
.lights{display:inline-flex;gap:6px}
.lights i{width:.32em;height:.32em;border-radius:50%;display:block}
.lights i:nth-child(1){background:var(--l3)}.lights i:nth-child(2){background:var(--l2)}.lights i:nth-child(3){background:var(--l1)}
.hero p{color:var(--muted);margin:10px 0 0;max-width:34em}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--raised);border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
.search:focus-within{border-color:var(--ink)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:13px 0;outline:none}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%}
.cats .chip{font-size:14px;padding:5px 12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Liste */
.group{margin-top:26px}
.group-head{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:3px solid currentColor}
.group-head h2{font-size:1.45rem;font-weight:700}
.group-head span{color:var(--muted);font-size:15px;margin-left:auto}
.g3 .group-head{color:var(--l3)}.g2 .group-head{color:var(--l2)}.g1 .group-head{color:var(--l1)}
.group-head h2{color:var(--ink)}
.group-desc{color:var(--muted);font-size:15px;margin:8px 0 4px}
ul.items{list-style:none;margin:0;padding:0}
.item{width:100%;display:flex;align-items:center;gap:14px;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;text-align:left;cursor:pointer}
.item:hover .name{text-decoration:underline;text-underline-offset:3px}
.item .emo{font-size:28px;width:38px;text-align:center;flex:none}
.item .name{font-weight:700;font-size:17px}
.item .sub{display:block;color:var(--muted);font-size:14px;font-weight:400}
.item .chev{margin-left:auto;color:var(--muted);flex:none}
.empty{padding:40px 0;color:var(--muted)}
.empty button{background:none;border:0;color:var(--ink);text-decoration:underline;cursor:pointer;padding:0}

/* Gestes */
.guide{margin:44px 0 0;background:var(--surface);border-radius:20px;padding:24px 22px}
.guide h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.guide ul{margin:14px 0 0;padding-left:1.1em}
.guide li{margin:8px 0}
.sources{margin:24px 0 0}
.sources h2{font-size:1.25rem;font-weight:700}
.sources p{color:var(--muted);font-size:14px;margin:8px 0 0}
.sources ol{margin:10px 0 0;padding-left:1.4em;font-size:14px}
.sources li{margin:6px 0;overflow-wrap:anywhere}
a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.srcs{margin-top:16px;font-size:14px;color:var(--muted)}
.srcs ul{margin:6px 0 0;padding-left:1.1em}
.srcs li{margin:4px 0}
.legal{margin:24px 0 0;border:1.5px solid var(--line);border-radius:20px;padding:20px 22px}
.legal h2{font-size:1.25rem;font-weight:700}
.legal ul{margin:12px 0 0;padding-left:1.1em;font-size:15px;color:var(--muted)}
.legal li{margin:7px 0}
.legal p{margin:12px 0 0;font-size:14px;color:var(--muted);font-weight:700}
.foot{color:var(--muted);font-size:14px;margin:28px 0 48px;max-width:40em}

/* Fiche */
.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(10,20,14,.5)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:0 22px calc(28px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
@media (min-width:760px){.panel{bottom:auto;top:50%;transform:translateY(-50%);border-radius:24px;max-height:86%;animation:none}}
.panel-top{position:sticky;top:0;background:var(--bg);display:flex;justify-content:flex-end;padding:14px 0 4px;z-index:1}
.close{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1}
.d-emo{font-size:56px;line-height:1}
.d-name{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;margin-top:8px}
.verdict{display:flex;gap:14px;align-items:center;border-radius:16px;padding:16px 18px;margin:18px 0 6px}
.verdict .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.35rem;line-height:1.15}
.verdict .meter{display:flex;gap:4px;flex:none}
.verdict .meter i{width:10px;height:28px;border-radius:3px;background:currentColor;opacity:.22}
.verdict .meter i.on{opacity:1}
.v3{background:var(--l3-soft);color:var(--l3)}.v2{background:var(--l2-soft);color:var(--l2)}.v1{background:var(--l1-soft);color:var(--l1)}
.d-cat{color:var(--muted);margin:4px 0 0}
.d-why{margin:12px 0 0}
.panel h3{font-size:1.15rem;font-weight:700;margin:24px 0 10px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 14px 42px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;display:grid;place-items:center}
ol.steps b{display:block}
ol.steps span{color:var(--muted);font-size:15.5px}
.tip{background:var(--surface);border-left:4px solid var(--ink);border-radius:4px 12px 12px 4px;padding:12px 16px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="langbar"><select id="ctySel"></select><select id="langSel"></select></div>
    <h1><svg class="logo" viewBox="0 0 132 60" aria-hidden="true"><rect x="2" y="2" width="128" height="56" rx="28" fill="#1E2B24" stroke="var(--line)" stroke-width="2"/><circle cx="30" cy="30" r="15" fill="var(--l3)"/><circle cx="66" cy="30" r="15" fill="var(--l2)"/><path d="M102 15 A15 15 0 1 0 117 30 V17.5 Q117 15 114.5 15 Z" fill="var(--l1)"/><g stroke="#2B5420" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M92.6 41.3 L112.4 19.6" stroke-width="1.75"/><path d="M94.84 38.71 L94.34 28.61 M94.84 38.71 L105.54 39.29" stroke-width="1.5"/><path d="M100.69 32.62 L100.25 24.51 M100.69 32.62 L108.84 33" stroke-width="1.25"/><path d="M105.9 26.66 L105.6 20.64 M105.9 26.66 L112.15 26.98" stroke-width="1"/></g></svg><span id="title">BioSemafor</span></h1>
    <p id="intro"></p>
  </header>
  <div class="bar">
    <label class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off">
    </label>
    <div class="chips" id="levels" role="group">
      <button class="chip" data-f="0" aria-pressed="true"><span class="lbl"></span></button>
      <button class="chip" data-f="3" aria-pressed="false"><span class="dot" style="background:var(--l3)"></span><span class="lbl"></span></button>
      <button class="chip" data-f="2" aria-pressed="false"><span class="dot" style="background:var(--l2)"></span><span class="lbl"></span></button>
      <button class="chip" data-f="1" aria-pressed="false"><span class="dot" style="background:var(--l1)"></span><span class="lbl"></span></button>
    </div>
    <div class="chips cats" id="cats" role="group"></div>
  </div>
  <main id="list"></main>
  <section class="guide" aria-labelledby="g-title">
    <h2 id="g-title"></h2>
    <ul id="guideList"></ul>
  </section>
  <section class="sources" aria-labelledby="srcT">
    <h2 id="srcT"></h2>
    <p id="srcIntro"></p>
    <ol id="srcList"></ol>
  </section>
  <section class="legal" aria-labelledby="legalT">
    <h2 id="legalT"></h2>
    <ul id="legalList"></ul>
    <p id="upd"></p>
  </section>
  <p class="foot" id="foot"></p>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name">
  <div class="backdrop" data-close></div>
  <div class="panel" id="panel">
    <div class="panel-top"><button class="close" data-close>×</button></div>
    <div id="detail"></div>
  </div>
</div>
<script>
const I18N={"fr":{"name":"Français","ui":{"title":"Bio ou pas ?","intro":"Pour {n} aliments du quotidien, savoir quand le bio vaut vraiment la peine, et comment réduire les résidus quand vous achetez conventionnel.","ph":"Chercher un aliment (ex. pâtes, riz, thé)","search":"Chercher un aliment","all":"Tous","allCats":"Toutes catégories","levels":"Filtrer par niveau","catsL":"Filtrer par catégorie","one":"aliment","many":"aliments","empty":"Aucun aliment ne correspond à cette recherche. Essayez un autre mot, ou","reset":"affichez toute la liste","gest":"Les bons gestes","noprep":"Aucune préparation particulière n’est nécessaire.","close":"Fermer","guideT":"Les bons gestes, bio ou pas","lang":"Langue","src":"Sources","srcIntro":"Principales sources consultées en octobre 2026. Les liens mènent vers des documents externes."},"L":{"1":["Bio facultatif","Peu de résidus ou une protection naturelle. Le conventionnel convient ; le bio relève surtout de l’environnement."],"2":["Bio conseillé","Le bio apporte un vrai plus, mais de bons gestes ou une bonne origine réduisent déjà nettement l’exposition."],"3":["Bio prioritaire","Résidus ou problèmes fréquents que le lavage ne règle pas. C’est ici que le bio fait la plus grande différence."]},"cats":["Fruits","Légumes","Céréales et féculents","Légumineuses","Fruits secs et graines","Produits laitiers et œufs","Viandes et poissons","Biscuits et sucré","Boissons","Huiles, épices et condiments"],"M":"eau|Rinçage à l’eau courante|30 secondes sous l’eau froide en frottant avec les doigts : plus efficace qu’un simple trempage.\nbica|Bain au bicarbonate|Environ 10 g de bicarbonate de soude (2 c. à café) par litre d’eau froide, 12 à 15 minutes, puis rinçage soigneux. Plus efficace que l’eau seule ou le vinaigre sur les résidus de surface.\nbrosse|Brossage|Brosse à légumes sous l’eau courante, sur toute la surface.\npeler|Épluchage|Retire la plupart des résidus de surface, mais aussi une partie des fibres et des vitamines.\nfeuilles|Retirer les feuilles extérieures|Ce sont les plus exposées aux traitements et aux saletés.\nbassine|Lavage feuille à feuille|Séparer les feuilles, les plonger dans un grand volume d’eau, remuer, changer l’eau deux fois, puis rincer.\ndoux|Lavage délicat|Dans une passoire, sous un filet d’eau, juste avant de les manger.\nessuyer|Essuyage|Papier humide ou rinçage très rapide : ils absorbent l’eau comme une éponge.\nriz|Rinçage et cuisson à grande eau|Rincer jusqu’à ce que l’eau soit claire, cuire dans environ 6 volumes d’eau pour 1 de riz, puis égoutter. Réduit nettement l’arsenic, bio ou non.\ntremper|Trempage et rinçage|Légumineuses sèches : tremper une nuit, jeter l’eau, rincer. En conserve : rincer et égoutter.\ningr|Règle des 5 ingrédients|Visez une liste courte. Le bio n’autorise qu’une cinquantaine d’additifs, contre plus de 300 en conventionnel, et interdit colorants de synthèse, arômes artificiels et édulcorants intenses.\nverre|Préférer le verre|Les bocaux en verre évitent la migration de plastifiants et de bisphénols vers les aliments gras ou acides.\necreme|Écrémé ou demi-écrémé|Les résidus liposolubles se concentrent dans la matière grasse : un lait écrémé conventionnel en contient beaucoup moins.\nlabel|À défaut de bio, un label exigeant|En Suisse, IP-Suisse limite certains traitements des céréales ; une origine suisse ou européenne est en général plus encadrée.\ngras|Retirer le gras visible|Certains polluants (dioxines, PCB) s’accumulent dans les graisses animales.\npetits|Varier et préférer les petits poissons|Sardine, maquereau, hareng : moins de mercure que les grands prédateurs (thon, espadon).\norigine|Regarder l’origine|Une production suisse ou européenne est soumise à des règles plus strictes sur les pesticides et les antibiotiques.\nsulfites|Éviter les sulfites si possible|Cherchez la mention « non sulfuré » : la couleur sera plus sombre, c’est normal.\nmonder|Préférer les versions mondées|La pellicule brune concentre les résidus : les amandes ou noisettes émondées (sans peau) en contiennent nettement moins.\nstock|Bien choisir et bien stocker|Fuyez les fruits tachés, friables, amers ou rances (risque de moisissures et d’aflatoxines, bio ou non). Préférez les emballages hermétiques au vrac exposé à l’air.\nvinlabel|Choisir le label|Bio (Bourgeon Bio Suisse, Eurofeuille) : pas de pesticides de synthèse, additifs limités. Biodynamie (Demeter) : règles encore plus strictes. Vin nature : raisins bio, aucun additif, sulfites très faibles.\nvinsulf|Regarder les sulfites|Limites maximales pour un rouge sec : 150 mg/l en conventionnel, 100 en bio, environ 70 en biodynamie Demeter, moins de 30 pour le « Vin méthode nature ». Les blancs en contiennent généralement plus.\nvincouleur|Rouge ou blanc|Le rouge macère longtemps avec les peaux, où se trouvent les résidus ; le blanc est pressé rapidement mais reçoit plus de sulfites.","guide":["Lavez juste avant de manger ou cuisiner : un fruit lavé puis stocké s’abîme plus vite.","Eau courante en frottant, c’est la base. Le bain au bicarbonate (environ 10 g par litre, 12 à 15 minutes, puis rinçage) retire davantage de résidus de surface.","Jamais de savon, de liquide vaisselle ni d’eau de Javel : ils pénètrent dans les aliments. Le vinaigre n’apporte pas plus que le bicarbonate.","Lavez aussi ce que vous épluchez (melon, avocat, agrumes) : le couteau entraîne les résidus de la peau vers la chair.","Le lavage n’agit qu’en surface. Les pesticides dits systémiques sont dans la chair : seul le bio les évite.","Variez fruits, légumes et provenances pour limiter l’exposition à un même produit.","Pour les produits transformés (pâtes, biscuits, céréales), on ne peut rien laver : le choix se fait à l’achat. Le complet concentre davantage les résidus que le raffiné.","Bio ne veut pas dire sain : chips, biscuits ou pâtes à tartiner bio gardent le même sucre, le même sel et les mêmes graisses. Mieux vaut en réduire la fréquence.","Préférez le verre aux conserves vernies et aux barquettes en plastique chauffées, surtout pour les aliments gras ou acides.","Produits animaux : les résidus se fixent dans le gras. Viande maigre et lait écrémé conventionnels posent moins de problème que beurre, fromages gras ou charcuterie.","Un fruit conventionnel bien lavé reste bien meilleur pour la santé que pas de fruit du tout."],"foot":"Classement indicatif, inspiré des analyses de résidus de pesticides publiées chaque année (notamment le classement de l’Environmental Working Group, basé sur des données américaines) et des contrôles européens. Les résidus varient selon l’origine, la saison et le producteur, et restent le plus souvent sous les limites légales. Acheter local et de saison réduit aussi certains traitements après récolte. En Suisse, le label Bio Suisse (Bourgeon) est l’un des plus exigeants.","items":"Fraise|Parmi les fruits les plus souvent contaminés, avec plusieurs résidus par échantillon. Peau fine, impossible à éplucher.|Lavez-les avant d’ôter la queue, sinon l’eau entre dans le fruit. Elles sont fragiles : 2 à 3 minutes de bain suffisent.|\nRaisin|La vigne est l’une des cultures les plus traitées, et le raisin se mange avec la peau.|Détachez les grains de la grappe avant le bain pour que l’eau circule partout.|\nPêche et nectarine|Fruit fragile et très traité ; la peau duveteuse de la pêche retient les résidus.|Si elle n’est pas bio, l’épluchage reste le moyen le plus efficace.|\nPomme|L’un des fruits recevant le plus de traitements au cours d’une saison en verger conventionnel.|Le bain au bicarbonate de 12 à 15 minutes est la méthode la mieux étudiée sur la pomme. Les résidus déjà entrés dans la chair ne partent pas.|\nPoire|Résidus fréquents, comparable à la pomme.|Même méthode que pour la pomme.|\nCerise|Résidus fréquents ; on la mange entière avec la peau.|Gardez la queue pendant le lavage pour éviter que l’eau n’entre dans le fruit.|\nMyrtille|Petits fruits à peau fine, consommés entiers ; résidus réguliers.|Les myrtilles surgelées bio sont souvent moins chères que les fraîches.|\nFramboise|Pas de peau protectrice et une chair spongieuse qui absorbe les fongicides.|Ne les laissez pas tremper : elles se gorgent d’eau et s’écrasent.|\nMûre|Pas de peau protectrice et une chair spongieuse, consommée entière.|Les mûres sauvages, cueillies loin des routes, sont une excellente option.|\nGroseille et cassis|Petits fruits consommés entiers, résidus réguliers.|Égrappez-les après le lavage, pas avant.|\nAbricot|Fruit à noyau souvent traité, peau consommée.|Même logique que la pêche, avec un peu moins de résidus en moyenne.|\nPrune et pruneau frais|Traitée contre les insectes ravageurs jusqu’à peu avant la récolte, et mangée avec la peau.|La pruine blanche sur la peau est naturelle, ce n’est pas un résidu.|\nRhubarbe|Tiges exposées, résidus modérés.|Retirer les fils de la tige élimine aussi une bonne partie des résidus.|\nCitron et citron vert|La pulpe est peu exposée, mais la peau reçoit souvent des fongicides et de la cire après récolte.|Pour le zeste : bio ou « non traité après récolte ». Pour le jus seul, le conventionnel convient.|agrumes\nOrange, clémentine, pamplemousse|Peau traitée après récolte (fongicides, cire), pulpe peu exposée.|Lavez-vous les mains après l’épluchage, surtout avant de donner les quartiers aux enfants.|agrumes mandarine\nBanane|Peau épaisse retirée ; la chair est très peu exposée.|Ici, le bio a surtout un intérêt environnemental et pour les travailleurs des plantations.|\nAvocat|Peau épaisse non consommée ; l’un des fruits les moins contaminés.|Rincez-le quand même avant de le couper : le couteau entraîne les résidus vers la chair.|\nAnanas|Écorce épaisse retirée ; la chair est très peu exposée.|Rincez l’écorce avant de trancher.|\nMangue|Peau épaisse non consommée.|Pour l’écologie, préférez les mangues arrivées par bateau plutôt que par avion.|\nKiwi|Peu de résidus ; la peau est généralement retirée.|Si vous mangez la peau, brossez-le d’abord.|\nMelon|Écorce épaisse ; la chair est peu exposée.|Lavez l’écorce avant de couper : le couteau traverse la surface.|\nPastèque|Écorce épaisse ; parmi les fruits les moins contaminés.|Même précaution que pour le melon.|\nFigue fraîche|Peu traitée en général.|Fragile : lavez-la juste avant de la manger.|\nGrenade|Écorce épaisse non consommée.|Égrainez-la dans un saladier d’eau : les grains coulent, la peau flotte.|\nLitchi et papaye|Peau non consommée, peu de résidus dans la chair.|Rincez avant d’ouvrir.|\nÉpinards|Grandes feuilles très exposées aux traitements ; résidus fréquents et multiples.|Les épinards surgelés bio sont une alternative économique.|\nChou kale|Feuilles frisées qui retiennent les résidus ; souvent plusieurs pesticides détectés.|Retirez les tiges centrales épaisses, plus difficiles à nettoyer.|\nPoivron et piment|Résidus fréquents, en particulier sur les produits importés hors saison.|Grillés au four puis pelés, ils perdent l’essentiel de leur peau.|\nHaricots verts|Résidus fréquents, avec parfois plusieurs substances par échantillon.|La cuisson ne détruit pas les pesticides : lavez avant d’équeuter.|\nCéleri branche|Ses tiges striées guident et retiennent l’eau de traitement ; il se mange souvent cru.|Retirez les fils extérieurs et la base, plus chargés.|\nTomate|Résidus réguliers, mais peau lisse qui se nettoie bien.|En saison et de plein champ, elle est généralement moins traitée.|\nSalade verte|Surface de feuilles maximale exposée aux pulvérisations, surtout pour les salades de serre en hiver.|Une essoreuse aide à bien rincer sans abîmer les feuilles.|laitue batavia\nRoquette et mâche|Jeunes pousses très exposées, consommées crues.|Même « prête à consommer », un rinçage ne fait pas de mal.|\nConcombre|Les résidus restent dans la peau ; la chair est saine une fois épluchée.|Épluché, un concombre conventionnel convient très bien.|\nCourgette|Résidus concentrés dans la peau fine, qu’on mange en général.|Épluchée, ou après un bain au bicarbonate, une courgette conventionnelle convient.|\nAubergine|Résidus concentrés dans la peau ; la chair est saine une fois pelée.|Elle se pèle facilement une fois grillée.|\nRadis|Racine poussant au contact du sol, mangée crue avec la peau.|Retirez les fanes et la pointe.|\nPomme de terre|Résidus surtout dans la peau.|Ne mangez pas les parties vertes ou germées, qu’elle soit bio ou non.|\nBrocoli|Peu de résidus en moyenne.|Trempez-le tête en bas quelques minutes pour déloger insectes et saletés.|\nChou-fleur|Les feuilles protègent la pomme ; peu de résidus.|Même astuce que pour le brocoli.|\nChou et choux de Bruxelles|Les feuilles extérieures protègent le cœur.|Retirer deux ou trois feuilles extérieures suffit.|\nCarotte|Faibles résidus, concentrés dans la peau.|Une carotte jeune bien brossée n’a pas besoin d’être épluchée.|\nBetterave|Peu traitée, peau retirée après cuisson.|Cuite avec la peau, elle garde mieux sa couleur.|\nNavet, panais, céleri-rave|Légumes racines épluchés, peu de résidus.|Épluchez finement pour garder la chair.|\nCourge et potiron|Écorce épaisse, peu de résidus.|Le potimarron se mange avec la peau : brossez-le bien.|\nPoireau|Peu de résidus, mais de la terre entre les feuilles.|Fendez-le dans la longueur et rincez entre les feuilles.|\nEndive|Cultivée à l’abri de la lumière, peu traitée.|Ne la faites pas tremper : elle devient amère.|\nFenouil|Ses côtes striées retiennent l’eau de traitement.|Retirez la couche extérieure, plus exposée.|\nArtichaut|Bractées protectrices, cœur peu exposé.|Rincez-le tête en bas.|\nBlettes|Grandes feuilles très exposées aux pulvérisations.|Lavez séparément les côtes et les feuilles.|\nOignon et échalote|Les couches extérieures protègent la partie consommée.|Retirer la première couche charnue en plus de la pelure suffit.|\nAil|Peu de résidus ; préférez une origine européenne.|L’ail importé de loin est parfois traité contre la germination.|\nGingembre|Peu de résidus, surtout s’il est épluché.|Une cuillère à café gratte la peau sans gaspiller.|\nChampignons|Les champignons de Paris poussent en milieu fermé, sans pulvérisation sur les cultures.|Coupez le bout terreux du pied.|\nAsperges|Peu traitées en moyenne.|Épluchez les asperges blanches du haut vers le bas.|\nMaïs doux|Les feuilles qui entourent l’épi le protègent.|Retirez les feuilles et les fils juste avant la cuisson.|\nPatate douce|Peu de résidus, surtout dans la peau.|Bien brossée, elle peut se cuire avec la peau.|\nPetits pois|La cosse protège les petits pois ; résidus rares.|Les petits pois surgelés conventionnels sont un très bon choix.|\nRiz blanc basmati et thaï (jasmin)|Le polissage retire une grande partie des résidus. Mais les contrôles officiels, en Suisse comme dans l’UE, trouvent régulièrement dans les riz importés d’Asie des pesticides interdits chez nous ; les riz bio s’en sortent nettement mieux.|Le bio règle la question des pesticides, pas celle de l’arsenic : la cuisson à grande eau reste utile.|riz basmati riz jasmin riz thai\nRiz complet, rouge ou noir|L’enveloppe conservée stocke les résidus de pesticides et concentre davantage l’arsenic.|Prenez-le bio et variez avec d’autres céréales.|riz brun riz rouge riz noir\nRiz blanc européen (rond, risotto, Camargue)|Cultivé selon les règles européennes, il présente peu de résidus. L’arsenic, lui, concerne tous les riz, bio ou non.|Pour un risotto, on ne rince pas : variez simplement les céréales au fil de la semaine.|riz arborio carnaroli\nFlocons d’avoine et muesli|Consommés grain entier. Des résidus de régulateurs de croissance (chlorméquat) sont fréquemment détectés dans les produits à base d’avoine conventionnelle, surtout d’Amérique du Nord, où l’avoine est aussi parfois séchée chimiquement avant la moisson, une pratique interdite en Suisse.|Pour les enfants qui en mangent chaque jour, c’est l’un des achats bio les plus utiles.|avoine porridge granola\nPâtes complètes et semi-complètes|Le son conservé stocke les régulateurs de croissance et les fongicides du blé.|Le complet a de vrais atouts nutritionnels : c’est justement là que le bio vaut la peine.|spaghetti penne\nPâtes blanches|La mouture retire le son et le germe, où se trouve l’essentiel des résidus.|En Suisse, traiter les céréales au glyphosate juste avant la récolte est interdit, ce qui n’est pas le cas dans tous les pays exportateurs : privilégiez un blé d’origine suisse ou européenne.|spaghetti penne macaronis nouilles lasagnes\nPain et farine complets|Comme pour les pâtes complètes, le son concentre les résidus.|Un pain au levain bio est un excellent compromis goût, digestion et résidus.|farine complete pain complet farine bise seigle epeautre\nPain blanc et farine blanche|Seul le cœur du grain est utilisé : beaucoup moins de résidus que le complet.|Le pain industriel contient souvent plus d’additifs que celui du boulanger.|baguette farine\nSemoule, couscous et boulgour|Issus du blé dur raffiné ; mêmes enjeux que les pâtes blanches.|Les versions complètes, elles, gagnent à être bio.|\nQuinoa et sarrasin|Plantes rustiques, peu traitées ; le quinoa est protégé par des saponines amères.|Rincez-le bien avant cuisson pour enlever l’amertume.|\nPolenta et maïs|Le maïs conventionnel est traité, et le bio garantit l’absence d’OGM.|Préférez une polenta d’origine européenne.|\nCéréales du petit-déjeuner|Mélange de céréales traitées, de sucre et d’additifs.|Les versions bio contiennent souvent moins d’additifs, mais pas forcément moins de sucre.|corn flakes\nLentilles|Consommées avec leur pellicule, et les lentilles importées sont parfois séchées chimiquement avant récolte.|Il existe des lentilles suisses et françaises : une très bonne alternative.|\nPois chiches|Mêmes pratiques de séchage chimique possibles à l’import.|Rincer ceux en conserve réduit aussi le sel.|\nHaricots secs (rouges, blancs)|Le bio évite les traitements chimiques avant récolte.|Les haricots rouges doivent toujours être bien cuits.|\nSoja, tofu et tempeh|Le bio garantit un soja sans OGM et souvent d’origine européenne.|Il existe du tofu fabriqué en Suisse avec du soja local.|\nRaisins secs|Le séchage concentre les résidus d’un fruit déjà très traité.|Un bon choix bio pour les collations des enfants.|\nAbricots secs|Résidus concentrés par le séchage, souvent sulfités pour garder leur couleur orange.|Les abricots secs bruns, non sulfurés, sont tout à fait normaux.|\nDattes et figues sèches|Peu de résidus en général.|Vérifiez l’absence de sirop de glucose ajouté.|\nAmandes|La pellicule brune retient les résidus. Aux États-Unis, les amandes de Californie doivent être pasteurisées, à la vapeur ou par fumigation à l’oxyde de propylène, un procédé interdit dans l’UE et en bio.|Préférez des amandes bio européennes (Espagne, Italie) ou, à défaut, des amandes mondées.|\nCacahuètes|Résidus réguliers sur les cacahuètes conventionnelles.|Bio ou non, jetez celles qui ont un goût de moisi.|\nNoix|La coque protège mais n’est pas totalement étanche ; les noyers conventionnels sont traités contre le carpocapse et la mouche du brou. Les cerneaux, riches en oméga-3, sont fragiles.|Des noix suisses ou françaises non traitées après récolte sont une très bonne alternative.|noix de Grenoble cerneaux\nGraines (courge, tournesol, lin, chia)|Peu de résidus en général.|Les graines de lin se digèrent mieux moulues.|\nLait entier|Les résidus liposolubles de l’alimentation des vaches passent dans la matière grasse du lait. Le bio garantit aussi plus de pâturage et pas d’OGM.|En Suisse, le lait conventionnel est déjà assez encadré : le bio est un plus, pas une urgence.|\nLait écrémé et demi-écrémé|L’écrémage retire la fraction grasse où se concentrent les résidus.|Le bio reste un choix pour le bien-être animal, pas une nécessité sanitaire.|\nBeurre et crème|Les polluants qui se fixent dans les graisses s’y retrouvent davantage que dans le lait.|Un beurre de montagne ou bio est un bon choix.|\nFromage|Les fromages gras concentrent les résidus liposolubles. Les AOP suisses imposent déjà des règles strictes d’alimentation.|Le Gruyère et l’Emmentaler AOP sont fabriqués avec du lait sans ensilage.|\nYaourts et desserts lactés|Les versions aromatisées contiennent souvent des additifs, plus limités en bio.|Un yaourt nature avec des fruits frais reste la meilleure option.|\nŒufs|Le bio garantit une alimentation sans pesticides de synthèse ni OGM, le plein air et l’absence d’antibiotiques préventifs.|Dans l’UE, le code 0 sur la coquille signifie bio.|\nFilets de poulet et de dinde|Viande maigre, sans gras où les résidus se fixent ; l’enjeu du bio est surtout le bien-être animal.|La volaille suisse est soumise à des règles strictes ; méfiez-vous surtout de la volaille importée.|\nPorc|Viande grasse qui stocke les résidus ; élevage souvent intensif en conventionnel.|Privilégiez une viande suisse avec un label de bien-être animal.|\nBœuf, veau et agneau|Les morceaux gras stockent les résidus de l’alimentation. Bio ou filière herbe locale.|Une viande de pâturage locale vaut souvent une viande bio importée.|\nCharcuterie|Très grasse, et les conservateurs nitrités sont quasi systématiques en conventionnel ; le bio les limite.|Le jambon « sans nitrite » existe aussi en conventionnel.|\nSaumon et truite d’élevage|Le bio interdit les colorants de synthèse dans l’alimentation et limite antibiotiques et antiparasitaires.|Le saumon sauvage d’Alaska est une alternative.|\nCrevettes|Des lots de crevettes d’élevage importés, surtout d’Inde et du Vietnam, sont encore régulièrement refusés à la frontière européenne pour des antibiotiques interdits. Le risque dépend surtout de l’origine.|Choisissez bio, un label d’aquaculture reconnu ou une autre origine que les pays régulièrement signalés.|\nPoissons blancs sauvages (cabillaud, lieu)|Chair très maigre qui stocke peu de polluants ; le bio n’existe pas pour la pêche sauvage.|Un label de pêche durable est le bon critère ici.|cabillaud lieu colin merlu\nThon et grands poissons|Le bio n’existe pas pour la pêche sauvage. Le vrai polluant, c’est le mercure chez les grands prédateurs.|Limitez le thon et l’espadon, surtout pour les femmes enceintes et les enfants.|\nBiscuits et gâteaux|Le bio évite certains pesticides et additifs, mais garde le même sucre, les mêmes graisses et le même sel. Mieux vaut en réduire la fréquence que surpayer le bio.|Un biscuit bio reste un biscuit ultra-transformé.|cookies petit beurre gaufrettes\nChocolat|Le cacao est très traité dans les pays producteurs ; le bio garantit aussi moins d’additifs.|Plus le chocolat est noir, plus la liste d’ingrédients est courte.|\nPâte à tartiner|Huile, sucre et noisettes de sources variées ; additifs fréquents.|Une pâte de noisettes pure est une alternative simple.|\nConfiture et compote|Les fruits traités gardent une partie de leurs résidus après cuisson.|Pour la confiture de fraises ou de cerises, le bio vaut particulièrement la peine.|\nSucre|Le raffinage élimine pratiquement tous les résidus.|Le sucre suisse provient de betteraves cultivées localement.|\nMiel|Peu de résidus ; le bio concerne surtout l’environnement des ruches.|Un miel local est souvent plus sûr qu’un mélange de miels importés.|\nChips et snacks salés|Le bio n’y change ni le sel, ni les graisses, ni l’acrylamide de la cuisson.|Mieux vaut réduire la fréquence que payer plus cher.|apéritif crackers\nBonbons et sucreries|Le principal problème est le sucre, pas les pesticides. Le bio limite certains colorants.|Méfiez-vous des colorants E102, E110 et E129.|\nThé|Les feuilles ne sont jamais lavées avant infusion, et les thés conventionnels contiennent souvent des résidus.|Pour le thé vert, choisir bio est particulièrement conseillé.|\nCafé|Les grains sont protégés par le fruit et la torréfaction réduit les résidus, mais la culture est très traitée.|Le bio et le commerce équitable vont souvent ensemble.|\nInfusions et tisanes|Plantes jamais lavées : l’eau chaude extrait directement les résidus.|Les tisanes de plantes suisses sont une bonne option.|\nVin|La vigne est l’une des cultures les plus traitées (mildiou, oïdium, pourriture grise), souvent avec des fongicides systémiques qui pénètrent dans le raisin. Rien n’est lavé ni épluché avant la vinification : les résidus passent dans le moût, et les contrôles en retrouvent fréquemment des traces, généralement sous les limites légales. Le vin conventionnel peut aussi recevoir bien plus d’additifs et de sulfites que le bio.|Les maux de tête après un verre ne viennent pas toujours des sulfites : l’alcool et l’histamine jouent aussi. Bio ou non, le vin se consomme avec modération.|\nJus de fruits|Les résidus des fruits se retrouvent en partie dans le jus.|Pour le jus de pomme et de raisin, le bio vaut la peine.|\nLait végétal (avoine, soja, amande)|Les résidus des céréales et du soja passent en partie dans la boisson.|Pour la boisson à l’avoine, consommée en quantité, le bio est conseillé.|\nSodas et boissons sucrées|Le bio ne change rien au sucre, qui est le vrai problème.|Évitez aussi les versions light : le bio interdit les édulcorants intenses, pas le conventionnel.|\nBière|Faibles résidus après brassage.|Le bio concerne surtout l’orge et le houblon cultivés.|\nHuiles vierges (olive, colza, lin, noix)|Pressées à froid sans raffinage, elles entraînent les résidus liposolubles du fruit ou de la graine.|L’huile de colza suisse vierge est une très bonne option.|huile d’olive huile de colza huile de noix huile de lin\nHuiles raffinées (tournesol, friture)|Le raffinage élimine les résidus, au détriment des micronutriments.|Réservez-les à la cuisson à haute température.|huile de tournesol\nÉpices et herbes séchées|Résidus fréquents dans les épices importées ; le bio interdit aussi l’irradiation.|Achetez-les en petites quantités : elles perdent leur arôme.|\nSauce tomate et ketchup|Tomates traitées et additifs fréquents.|Une sauce maison avec des tomates en conserve bio est simple.|\nBouillon cube|Souvent riche en additifs et exhausteurs de goût.|Les bouillons bio sont généralement sans glutamate ajouté.|\nSel, vinaigre et moutarde|Peu de résidus ; le bio n’apporte pas grand-chose ici.|Pour la moutarde, regardez l’origine des graines.|\nHerbes aromatiques fraîches|Traitements fréquents sur des feuilles nues, consommées crues et peu rincées.|Séchez-les dans un torchon propre pour mieux les conserver.|persil basilic ciboulette coriandre menthe\nNoix de pécan|Même famille que la noix, coque plus tendre ; les cultures américaines et mexicaines sont régulièrement traitées.|Conservez-les au réfrigérateur : leur huile rancit vite.|pecan\nNoix de cajou|La coque contient une résine caustique qui protège l’amande des pulvérisations, mais le décorticage est un travail pénible et souvent mal protégé.|Le bio ou le commerce équitable garantissent de meilleures conditions de travail.|cajou anacarde\nNoisettes|Les noisetiers conventionnels reçoivent plusieurs insecticides contre le balanin, qui perce la coque encore tendre.|La pellicule brune s’enlève facilement après torréfaction.|\nPistaches|La coque s’ouvre sur l’arbre avant la récolte : l’amande est exposée aux traitements tardifs et aux moisissures pendant le séchage.|Jetez celles qui sont tachées ou ont un goût de moisi.|\nNoix de macadamia|L’une des coques les plus dures et épaisses qui soient : l’amande est presque totalement protégée des pulvérisations.|Le principal risque est un éventuel traitement de conservation pendant le transport.|macadamia\nPurées d’oléagineux (cacahuète, amande…)|Graines broyées entières avec leur peau ; les versions conventionnelles contiennent souvent huile de palme, huile hydrogénée ou sucre ajoutés.|Visez 100 % fruits à coque, idéalement bio : un seul ingrédient sur l’étiquette.|beurre de cacahuète purée d’amande\nKaki mou (à la cuillère)|Variétés traditionnelles mangées blettes à la cuillère : la peau épaisse et cireuse, jetée, retient l’essentiel des résidus. L’arbre est en outre robuste et peu traité.|Rincez-le avant de l’ouvrir, puis prélevez la chair à la cuillère.|plaquemine\nKaki ferme (Persimon, kaki-pomme)|Variétés croquantes mangées avec la peau, qui fixe les traitements au champ et les conservateurs après récolte.|Leur astringence est souvent retirée au CO₂ ou à l’éthanol après récolte : sans résidu nocif, mais une raison de plus de bien laver la peau.|plaquemine persimon sharon\nKaki séché|Le séchage concentre les éventuels résidus ; les produits industriels importés sont parfois fumigés.|Le hoshigaki japonais traditionnel est pelé avant séchage.|plaquemine hoshigaki","legal":{"t":"Avertissement","u":"Dernière mise à jour du contenu : octobre 2026.","i":["BioSemafor fournit des informations générales à titre indicatif. Elles ne remplacent pas l’avis d’un médecin, d’un diététicien ou d’un autre professionnel de la santé, en particulier pendant la grossesse, pour les jeunes enfants, en cas d’allergie ou de maladie.","Les classements reposent sur des données publiques sur les résidus de pesticides, qui varient selon l’origine, la saison et le producteur. Ils ne constituent pas une évaluation d’un produit, d’une marque ou d’un producteur en particulier.","Malgré le soin apporté, nous ne garantissons ni l’exactitude ni l’exhaustivité des informations, qui peuvent évoluer. Leur utilisation se fait sous votre propre responsabilité, dans les limites prévues par la loi.","Les labels et appellations cités (Bio Suisse, IP-Suisse, Demeter, AOP, etc.) appartiennent à leurs titulaires. BioSemafor n’est affilié à aucun d’eux et n’est pas un label de certification.","L’application elle-même ne collecte aucune donnée personnelle : seul le choix de la langue est conservé sur votre appareil."]}},"en":{"name":"English","ui":{"title":"Organic or not?","intro":"For {n} everyday foods, find out when organic is really worth it, and how to reduce residues when you buy conventional.","ph":"Search a food (e.g. pasta, rice, tea)","search":"Search a food","all":"All","allCats":"All categories","levels":"Filter by level","catsL":"Filter by category","one":"food","many":"foods","empty":"No food matches this search. Try another word, or","reset":"show the full list","gest":"Good habits","noprep":"No special preparation needed.","close":"Close","guideT":"Good habits, organic or not","lang":"Language","src":"Sources","srcIntro":"Main sources consulted in October 2026. Links lead to external documents."},"L":{"1":["Organic optional","Few residues or natural protection. Conventional is fine; organic is mostly an environmental choice."],"2":["Organic recommended","Organic is a real plus, but good habits or a good origin already reduce exposure significantly."],"3":["Organic: top priority","Frequent residues or issues that washing can’t fix. This is where organic makes the biggest difference."]},"cats":["Fruit","Vegetables","Grains and starches","Pulses","Dried fruit, nuts and seeds","Dairy and eggs","Meat and fish","Biscuits and sweets","Drinks","Oils, spices and condiments"],"M":"eau|Rinse under running water|30 seconds under cold water, rubbing with your fingers: more effective than simply soaking.\nbica|Baking soda soak|About 10 g of baking soda (2 teaspoons) per litre of cold water, 12–15 minutes, then rinse thoroughly. More effective than water alone or vinegar on surface residues.\nbrosse|Scrubbing|Vegetable brush under running water, over the whole surface.\npeler|Peeling|Removes most surface residues, but also some fibre and vitamins.\nfeuilles|Remove the outer leaves|They are the most exposed to treatments and dirt.\nbassine|Leaf-by-leaf washing|Separate the leaves, plunge them into a large volume of water, stir, change the water twice, then rinse.\ndoux|Gentle washing|In a colander, under a trickle of water, just before eating.\nessuyer|Wiping|A damp paper towel or a very quick rinse: they soak up water like a sponge.\nriz|Rinse and cook in plenty of water|Rinse until the water runs clear, cook in about 6 parts water to 1 part rice, then drain. Significantly reduces arsenic, organic or not.\ntremper|Soak and rinse|Dried pulses: soak overnight, discard the water, rinse. Canned: rinse and drain.\ningr|The 5-ingredient rule|Aim for a short list. Organic allows only around 50 additives, compared with over 300 in conventional, and bans synthetic colourings, artificial flavourings and intense sweeteners.\nverre|Choose glass|Glass jars avoid the migration of plasticisers and bisphenols into fatty or acidic foods.\necreme|Skimmed or semi-skimmed|Fat-soluble residues concentrate in the fat: conventional skimmed milk contains far fewer.\nlabel|Otherwise, a demanding label|In Switzerland, IP-Suisse restricts some treatments on cereals; Swiss or European origin is generally more regulated.\ngras|Trim visible fat|Some pollutants (dioxins, PCBs) accumulate in animal fat.\npetits|Vary and favour small fish|Sardines, mackerel, herring: less mercury than large predators (tuna, swordfish).\norigine|Check the origin|Swiss or European production is subject to stricter rules on pesticides and antibiotics.\nsulfites|Avoid sulphites if possible|Look for “unsulphured”: the colour will be darker, which is normal.\nmonder|Choose blanched|The brown skin concentrates residues: blanched (skinless) almonds or hazelnuts contain significantly fewer.\nstock|Choose and store carefully|Avoid nuts that are stained, crumbly, bitter or rancid (risk of moulds and aflatoxins, organic or not). Prefer airtight packaging to bulk bins exposed to air.\nvinlabel|Choose the label|Organic (Bio Suisse Bud, EU leaf): no synthetic pesticides, restricted additives. Biodynamic (Demeter): even stricter rules. Natural wine: organic grapes, no additives, very low sulphites.\nvinsulf|Check the sulphites|Maximum limits for a dry red: 150 mg/l conventional, 100 organic, about 70 Demeter biodynamic, under 30 for certified natural wine. Whites generally contain more.\nvincouleur|Red or white|Red macerates for a long time with the skins, where residues sit; white is pressed quickly but receives more sulphites.","guide":["Wash just before eating or cooking: washed fruit spoils faster in storage.","Running water while rubbing is the basis. A baking soda soak (about 10 g per litre, 12–15 minutes, then rinse) removes more surface residues.","Never use soap, washing-up liquid or bleach: they penetrate food. Vinegar does no better than baking soda.","Also wash what you peel (melon, avocado, citrus): the knife drags residues from the skin into the flesh.","Washing only works on the surface. So-called systemic pesticides are inside the flesh: only organic avoids them.","Vary fruit, vegetables and origins to limit exposure to any single product.","Processed foods (pasta, biscuits, cereals) can’t be washed: the choice is made when buying. Wholegrain concentrates more residues than refined.","Organic doesn’t mean healthy: organic crisps, biscuits or spreads have the same sugar, salt and fat. Better to eat them less often.","Choose glass over lined cans and heated plastic trays, especially for fatty or acidic foods.","Animal products: residues bind to fat. Lean meat and skimmed milk from conventional farming are less of a concern than butter, fatty cheeses or cured meats.","A well-washed conventional fruit is far better for your health than no fruit at all."],"foot":"Indicative ranking, based on published pesticide residue analyses (notably the Environmental Working Group’s annual ranking, based on US data) and European controls. Residues vary by origin, season and producer, and usually remain below legal limits. Buying local and seasonal also reduces some post-harvest treatments. In Switzerland, the Bio Suisse label (the Bud) is one of the most demanding.","items":"Strawberry|Among the most frequently contaminated fruits, with several residues per sample. Thin skin that can’t be peeled.|Wash before removing the stem, otherwise water gets into the fruit. They’re fragile: a 2–3 minute soak is enough.|\nGrapes|Vines are among the most heavily treated crops, and grapes are eaten with the skin.|Pick the grapes off the bunch before soaking so the water reaches everywhere.|\nPeach and nectarine|Fragile, heavily treated fruit; the fuzzy skin of peaches traps residues.|If it’s not organic, peeling remains the most effective option.|\nApple|One of the fruits receiving the most treatments over a season in conventional orchards.|The 12–15 minute baking soda soak is the best-studied method on apples. Residues that have entered the flesh won’t come out.|\nPear|Frequent residues, similar to apples.|Same method as for apples.|\nCherry|Frequent residues; eaten whole with the skin.|Keep the stems on while washing so water doesn’t get into the fruit.|\nBlueberry|Small thin-skinned berries eaten whole; regular residues.|Frozen organic blueberries are often cheaper than fresh ones.|\nRaspberry|No protective skin and spongy flesh that absorbs fungicides.|Don’t let them soak: they absorb water and get crushed.|\nBlackberry|No protective skin and spongy flesh, eaten whole.|Wild blackberries picked away from roads are an excellent option.|\nRedcurrant and blackcurrant|Small berries eaten whole, regular residues.|Remove them from the stems after washing, not before.|currant\nApricot|Stone fruit often treated, skin eaten.|Same logic as peaches, with slightly fewer residues on average.|\nPlum|Treated against insect pests until shortly before harvest, and eaten with the skin.|The white bloom on the skin is natural, not a residue.|\nRhubarb|Exposed stalks, moderate residues.|Removing the stringy fibres also removes a good share of the residues.|\nLemon and lime|The pulp is barely exposed, but the peel often gets fungicides and wax after harvest.|For zest: organic or “untreated after harvest”. For juice only, conventional is fine.|citrus\nOrange, clementine, grapefruit|Peel treated after harvest (fungicides, wax), pulp barely exposed.|Wash your hands after peeling, especially before handing segments to children.|citrus mandarin tangerine\nBanana|Thick peel removed; the flesh is barely exposed.|Here organic matters mostly for the environment and for plantation workers.|\nAvocado|Thick skin not eaten; one of the least contaminated fruits.|Rinse it anyway before cutting: the knife drags residues into the flesh.|\nPineapple|Thick rind removed; the flesh is barely exposed.|Rinse the rind before slicing.|\nMango|Thick skin not eaten.|For the environment, choose mangoes shipped by sea rather than air-freighted.|\nKiwi|Few residues; the skin is usually removed.|If you eat the skin, scrub it first.|\nMelon|Thick rind; the flesh is barely exposed.|Wash the rind before cutting: the knife passes through the surface.|\nWatermelon|Thick rind; among the least contaminated fruits.|Same precaution as for melon.|\nFresh fig|Usually little treated.|Fragile: wash it just before eating.|\nPomegranate|Thick skin not eaten.|Seed it in a bowl of water: the seeds sink, the skin floats.|\nLychee and papaya|Skin not eaten, few residues in the flesh.|Rinse before opening.|\nSpinach|Large leaves very exposed to treatments; frequent, multiple residues.|Frozen organic spinach is an affordable alternative.|\nKale|Curly leaves that trap residues; several pesticides often detected.|Remove the thick central stalks, which are harder to clean.|\nBell pepper and chilli|Frequent residues, especially on out-of-season imports.|Roasted in the oven then peeled, they lose most of their skin.|capsicum chili\nGreen beans|Frequent residues, sometimes several substances per sample.|Cooking doesn’t destroy pesticides: wash before trimming.|\nCelery|Its ridged stalks channel and hold spray water; often eaten raw.|Remove the outer strings and the base, which carry more residues.|\nTomato|Regular residues, but smooth skin that washes well.|In season and field-grown, it’s generally less treated.|\nLettuce|Maximum leaf surface exposed to spraying, especially greenhouse lettuce in winter.|A salad spinner helps rinse thoroughly without bruising the leaves.|salad\nRocket and lamb’s lettuce|Very exposed young leaves, eaten raw.|Even if “ready to eat”, a rinse doesn’t hurt.|arugula corn salad\nCucumber|Residues stay in the skin; the flesh is fine once peeled.|Peeled, a conventional cucumber is perfectly fine.|\nCourgette|Residues concentrated in the thin skin, which is usually eaten.|Peeled, or after a baking soda soak, a conventional courgette is fine.|zucchini\nAubergine|Residues concentrated in the skin; the flesh is fine once peeled.|It peels easily once grilled.|eggplant\nRadish|A root growing in the soil, eaten raw with the skin.|Remove the leaves and the tip.|\nPotato|Residues mostly in the skin.|Don’t eat green or sprouted parts, organic or not.|\nBroccoli|Few residues on average.|Soak it head down for a few minutes to dislodge insects and dirt.|\nCauliflower|The leaves protect the head; few residues.|Same trick as for broccoli.|\nCabbage and Brussels sprouts|The outer leaves protect the heart.|Removing two or three outer leaves is enough.|\nCarrot|Low residues, concentrated in the skin.|A young carrot scrubbed well doesn’t need peeling.|\nBeetroot|Little treated, skin removed after cooking.|Cooked in its skin, it keeps its colour better.|beet\nTurnip, parsnip, celeriac|Peeled root vegetables, few residues.|Peel thinly to keep the flesh.|\nSquash and pumpkin|Thick rind, few residues.|Red kuri squash can be eaten with the skin: scrub it well.|\nLeek|Few residues, but soil between the leaves.|Slit it lengthwise and rinse between the leaves.|\nChicory (endive)|Grown in the dark, little treated.|Don’t soak it: it turns bitter.|endive\nFennel|Its ridged layers hold spray water.|Remove the outer layer, which is more exposed.|\nArtichoke|Protective bracts, heart barely exposed.|Rinse it head down.|\nSwiss chard|Large leaves very exposed to spraying.|Wash the stalks and leaves separately.|chard\nOnion and shallot|The outer layers protect the edible part.|Removing the first fleshy layer as well as the skin is enough.|\nGarlic|Few residues; prefer European origin.|Garlic imported from far away is sometimes treated against sprouting.|\nGinger|Few residues, especially when peeled.|A teaspoon scrapes off the skin without waste.|\nMushrooms|Button mushrooms are grown indoors, without spraying.|Cut off the earthy end of the stem.|\nAsparagus|Little treated on average.|Peel white asparagus from top to bottom.|\nSweetcorn|The husk around the cob protects it.|Remove the husk and silk just before cooking.|corn\nSweet potato|Few residues, mostly in the skin.|Scrubbed well, it can be cooked in its skin.|\nPeas|The pod protects the peas; residues are rare.|Frozen conventional peas are a very good choice.|\nWhite basmati and Thai (jasmine) rice|Polishing removes much of the residues. But official checks, in Switzerland as in the EU, regularly find pesticides banned here in rice imported from Asia; organic rice performs markedly better.|Organic solves the pesticide question, not the arsenic one: cooking in plenty of water still helps.|basmati jasmine\nBrown, red or black rice|The retained bran stores pesticide residues and concentrates more arsenic.|Buy it organic and alternate with other grains.|wholegrain rice\nEuropean white rice (short-grain, risotto, Camargue)|Grown under EU rules, it carries few residues. Arsenic, however, affects all rice, organic or not.|For risotto you don’t rinse: simply vary your grains over the week.|arborio carnaroli\nOats and muesli|Eaten as whole grain. Growth-regulator residues (chlormequat) are frequently found in conventional oat products, especially from North America, where oats are also sometimes chemically dried before harvest, a practice banned in Switzerland.|For children who eat them daily, this is one of the most useful organic purchases.|porridge granola oatmeal\nWholewheat and semi-wholewheat pasta|The retained bran stores the wheat’s growth regulators and fungicides.|Wholegrain has real nutritional benefits: that’s exactly where organic is worth it.|spaghetti penne\nWhite pasta|Milling removes the bran and germ, where most residues are.|In Switzerland, spraying cereals with glyphosate just before harvest is banned, which is not the case in every exporting country: choose wheat of Swiss or European origin.|spaghetti penne macaroni noodles lasagne\nWholemeal bread and flour|As with wholewheat pasta, the bran concentrates residues.|An organic sourdough bread is an excellent compromise of taste, digestion and residues.|wholegrain rye spelt\nWhite bread and white flour|Only the heart of the grain is used: far fewer residues than wholemeal.|Industrial bread often contains more additives than a baker’s.|baguette flour\nSemolina, couscous and bulgur|Made from refined durum wheat; same issues as white pasta.|Wholegrain versions, however, are worth buying organic.|\nQuinoa and buckwheat|Hardy plants, little treated; quinoa is protected by bitter saponins.|Rinse it well before cooking to remove the bitterness.|\nPolenta and corn|Conventional corn is treated, and organic guarantees GMO-free.|Choose polenta of European origin.|cornmeal\nBreakfast cereals|A mix of treated grains, sugar and additives.|Organic versions often have fewer additives, but not necessarily less sugar.|corn flakes\nLentils|Eaten with their skin, and imported lentils are sometimes chemically dried before harvest.|Swiss and French lentils exist: a very good alternative.|\nChickpeas|The same chemical drying practices are possible for imports.|Rinsing canned ones also reduces salt.|\nDried beans (kidney, white)|Organic avoids chemical pre-harvest treatments.|Kidney beans must always be thoroughly cooked.|\nSoy, tofu and tempeh|Organic guarantees GMO-free soy, often of European origin.|Tofu made in Switzerland from local soy is available.|soya\nRaisins|Drying concentrates the residues of an already heavily treated fruit.|A good organic choice for children’s snacks.|sultanas\nDried apricots|Residues concentrated by drying, often sulphited to keep their orange colour.|Brown, unsulphured dried apricots are perfectly normal.|\nDates and dried figs|Few residues in general.|Check there’s no added glucose syrup.|\nAlmonds|The brown skin traps residues. In the United States, Californian almonds must be pasteurised, either with steam or by fumigation with propylene oxide, a process banned in the EU and in organic.|Choose organic European almonds (Spain, Italy) or, failing that, blanched almonds.|\nPeanuts|Regular residues on conventional peanuts.|Organic or not, throw away any that taste mouldy.|\nWalnuts|The shell protects but isn’t fully sealed; conventional walnut trees are treated against codling moth and husk fly. The omega-3-rich kernels are fragile.|Swiss or French walnuts not treated after harvest are a very good alternative.|nuts\nSeeds (pumpkin, sunflower, flax, chia)|Few residues in general.|Flaxseeds are easier to digest when ground.|linseed\nWhole milk|Fat-soluble residues from the cows’ feed pass into the milk fat. Organic also guarantees more grazing and no GMOs.|In Switzerland conventional milk is already fairly regulated: organic is a plus, not a must.|\nSkimmed and semi-skimmed milk|Skimming removes the fat fraction where residues concentrate.|Organic remains a choice for animal welfare, not a health necessity.|\nButter and cream|Pollutants that bind to fat end up here more than in milk.|Mountain or organic butter is a good choice.|\nCheese|Fatty cheeses concentrate fat-soluble residues. Swiss PDO cheeses already impose strict feeding rules.|Gruyère and Emmentaler PDO are made from silage-free milk.|\nYoghurts and dairy desserts|Flavoured versions often contain additives, which are more restricted in organic.|Plain yoghurt with fresh fruit remains the best option.|yogurt\nEggs|Organic guarantees feed without synthetic pesticides or GMOs, outdoor access and no preventive antibiotics.|In the EU, code 0 on the shell means organic.|\nChicken and turkey breast|Lean meat, without the fat where residues bind; organic is mainly about animal welfare.|Swiss poultry is strictly regulated; be more wary of imported poultry.|\nPork|Fatty meat that stores residues; often intensively farmed in conventional systems.|Choose Swiss meat with an animal welfare label.|\nBeef, veal and lamb|Fatty cuts store residues from feed. Go organic or local grass-fed.|Local pasture-raised meat is often as good as imported organic meat.|\nCured meats|Very fatty, and nitrite preservatives are almost systematic in conventional products; organic limits them.|“Nitrite-free” ham also exists in conventional ranges.|ham salami sausage bacon\nFarmed salmon and trout|Organic bans synthetic colourings in feed and limits antibiotics and antiparasitics.|Wild Alaskan salmon is an alternative.|\nPrawns|Batches of imported farmed prawns, mainly from India and Vietnam, are still regularly rejected at the EU border for banned antibiotics. The risk depends mainly on the origin.|Choose organic, a recognised aquaculture label, or an origin other than the countries regularly flagged.|shrimp\nWild white fish (cod, pollock)|Very lean flesh storing few pollutants; organic doesn’t exist for wild fishing.|A sustainable fishing label is the right criterion here.|cod pollock hake\nTuna and large fish|Organic doesn’t exist for wild fishing. The real pollutant is mercury in large predators.|Limit tuna and swordfish, especially for pregnant women and children.|swordfish\nBiscuits and cakes|Organic avoids some pesticides and additives, but keeps the same sugar, fat and salt. Better to eat them less often than to overpay for organic.|An organic biscuit is still an ultra-processed biscuit.|cookies\nChocolate|Cocoa is heavily treated in producing countries; organic also means fewer additives.|The darker the chocolate, the shorter the ingredient list.|\nChocolate spread|Oil, sugar and hazelnuts from various sources; frequent additives.|Pure hazelnut butter is a simple alternative.|\nJam and fruit purée|Treated fruit keeps part of its residues after cooking.|For strawberry or cherry jam, organic is especially worth it.|compote\nSugar|Refining removes virtually all residues.|Swiss sugar comes from locally grown sugar beet.|\nHoney|Few residues; organic is mainly about the hives’ surroundings.|Local honey is often safer than a blend of imported honeys.|\nCrisps and salty snacks|Organic changes neither the salt, the fat nor the acrylamide from frying.|Better to eat them less often than to pay more.|chips crackers\nSweets and candy|The main issue is sugar, not pesticides. Organic restricts some colourings.|Watch out for colourings E102, E110 and E129.|\nTea|Leaves are never washed before brewing, and conventional teas often contain residues.|For green tea, going organic is particularly advisable.|\nCoffee|Beans are protected by the fruit and roasting reduces residues, but the crop is heavily treated.|Organic and fair trade often go together.|\nHerbal teas and infusions|Plants never washed: hot water extracts residues directly.|Herbal teas from Swiss plants are a good option.|\nWine|Vines are among the most heavily treated crops (downy mildew, powdery mildew, grey rot), often with systemic fungicides that penetrate the grapes. Nothing is washed or peeled before winemaking: residues pass into the must, and checks frequently find traces, usually below legal limits. Conventional wine can also receive far more additives and sulphites than organic.|Headaches after a glass aren’t always due to sulphites: alcohol and histamine also play a role. Organic or not, wine is best enjoyed in moderation.|\nFruit juice|Part of the fruit’s residues ends up in the juice.|For apple and grape juice, organic is worth it.|\nPlant milk (oat, soy, almond)|Residues from grains and soy partly pass into the drink.|For oat drink, consumed in quantity, organic is recommended.|\nSoft drinks and sugary drinks|Organic changes nothing about sugar, the real problem.|Also avoid diet versions: organic bans intense sweeteners, conventional doesn’t.|soda\nBeer|Low residues after brewing.|Organic mainly concerns the barley and hops grown.|\nVirgin oils (olive, rapeseed, flax, walnut)|Cold-pressed without refining, they carry the fat-soluble residues of the fruit or seed.|Swiss virgin rapeseed oil is a very good option.|olive oil canola\nRefined oils (sunflower, frying)|Refining removes residues, at the expense of micronutrients.|Keep them for high-temperature cooking.|sunflower oil\nSpices and dried herbs|Frequent residues in imported spices; organic also bans irradiation.|Buy them in small quantities: they lose their aroma.|\nTomato sauce and ketchup|Treated tomatoes and frequent additives.|A homemade sauce with organic canned tomatoes is easy.|\nStock cubes|Often rich in additives and flavour enhancers.|Organic stocks generally have no added glutamate.|bouillon\nSalt, vinegar and mustard|Few residues; organic adds little here.|For mustard, check where the seeds come from.|\nFresh herbs|Frequent treatments on bare leaves, eaten raw and barely rinsed.|Dry them in a clean tea towel to keep them longer.|parsley basil chives coriander mint\nPecans|Same family as walnuts, with a softer shell; US and Mexican crops are regularly treated.|Store them in the fridge: their oil goes rancid quickly.|pecan nuts\nCashews|The shell contains a caustic resin that shields the kernel from spraying, but shelling is hard, often poorly protected work.|Organic or fair trade guarantees better working conditions.|cashew nuts\nHazelnuts|Conventional hazel trees receive several insecticide sprays against the nut weevil, which pierces the still-soft shell.|The brown skin comes off easily after roasting.|\nPistachios|The shell splits open on the tree before harvest: the kernel is exposed to late treatments and to moulds during drying.|Throw away any that are stained or taste mouldy.|\nMacadamia nuts|One of the hardest, thickest shells there is: the kernel is almost fully protected from spraying.|The main risk is a possible preservation treatment during transport.|macadamia\nNut butters (peanut, almond…)|Seeds ground whole with their skin; conventional versions often contain added palm oil, hydrogenated oil or sugar.|Aim for 100% nuts, ideally organic: a single ingredient on the label.|peanut butter almond butter\nSoft persimmon (eaten with a spoon)|Traditional varieties eaten very ripe with a spoon: the thick waxy skin, which is discarded, holds most residues. The tree is also hardy and little treated.|Rinse it before opening, then scoop out the flesh with a spoon.|kaki persimmon\nFirm persimmon (Sharon fruit)|Crunchy varieties eaten with the skin, which holds field treatments and post-harvest preservatives.|Their astringency is often removed with CO₂ or ethanol after harvest: no harmful residue, but one more reason to wash the skin well.|kaki persimmon sharon\nDried persimmon|Drying concentrates any residues; imported industrial products are sometimes fumigated.|Traditional Japanese hoshigaki are peeled before drying.|kaki hoshigaki","legal":{"t":"Disclaimer","u":"Content last updated: October 2026.","i":["BioSemafor provides general information for guidance only. It does not replace the advice of a doctor, dietitian or other health professional, especially during pregnancy, for young children, or in case of allergy or illness.","Rankings are based on public data on pesticide residues, which vary by origin, season and producer. They are not an assessment of any particular product, brand or producer.","Although prepared with care, the information is not guaranteed to be accurate or complete and may change. You use it at your own responsibility, within the limits set by law.","The labels and designations mentioned (Bio Suisse, IP-Suisse, Demeter, PDO, etc.) belong to their owners. BioSemafor is not affiliated with any of them and is not a certification label.","The app itself collects no personal data: only your language choice is stored on your device."]}},"de":{"name":"Deutsch","ui":{"title":"Bio oder nicht?","intro":"Für {n} alltägliche Lebensmittel: wann sich Bio wirklich lohnt und wie Sie Rückstände bei konventioneller Ware reduzieren.","ph":"Lebensmittel suchen (z. B. Teigwaren, Reis, Tee)","search":"Lebensmittel suchen","all":"Alle","allCats":"Alle Kategorien","levels":"Nach Stufe filtern","catsL":"Nach Kategorie filtern","one":"Lebensmittel","many":"Lebensmittel","empty":"Kein Lebensmittel passt zu dieser Suche. Versuchen Sie ein anderes Wort oder","reset":"zeigen Sie die ganze Liste an","gest":"Die richtigen Handgriffe","noprep":"Keine besondere Zubereitung nötig.","close":"Schliessen","guideT":"Die richtigen Handgriffe, bio oder nicht","lang":"Sprache","src":"Quellen","srcIntro":"Wichtigste Quellen, konsultiert im Oktober 2026. Die Links führen zu externen Dokumenten."},"L":{"1":["Bio optional","Wenig Rückstände oder natürlicher Schutz. Konventionell ist in Ordnung; Bio ist vor allem eine Umweltfrage."],"2":["Bio empfohlen","Bio bringt ein echtes Plus, doch gute Gewohnheiten oder eine gute Herkunft senken die Belastung bereits deutlich."],"3":["Bio hat Priorität","Häufige Rückstände oder Probleme, die Waschen nicht löst. Hier macht Bio den grössten Unterschied."]},"cats":["Obst","Gemüse","Getreide und Stärkeprodukte","Hülsenfrüchte","Trockenfrüchte, Nüsse und Samen","Milchprodukte und Eier","Fleisch und Fisch","Guetzli und Süsses","Getränke","Öle, Gewürze und Saucen"],"M":"eau|Unter fliessendem Wasser spülen|30 Sekunden unter kaltem Wasser mit den Fingern reiben: wirksamer als blosses Einweichen.\nbica|Natronbad|Etwa 10 g Natron (2 TL) pro Liter kaltes Wasser, 12–15 Minuten, dann gründlich abspülen. Wirksamer gegen Oberflächenrückstände als Wasser allein oder Essig.\nbrosse|Abbürsten|Mit einer Gemüsebürste unter fliessendem Wasser, über die ganze Oberfläche.\npeler|Schälen|Entfernt die meisten Oberflächenrückstände, aber auch einen Teil der Fasern und Vitamine.\nfeuilles|Äussere Blätter entfernen|Sie sind Behandlungen und Schmutz am stärksten ausgesetzt.\nbassine|Blatt für Blatt waschen|Blätter trennen, in viel Wasser tauchen, umrühren, das Wasser zweimal wechseln, dann abspülen.\ndoux|Sanft waschen|Im Sieb unter einem dünnen Wasserstrahl, kurz vor dem Essen.\nessuyer|Abwischen|Mit feuchtem Küchenpapier oder ganz kurz abspülen: Sie saugen Wasser auf wie ein Schwamm.\nriz|Spülen und in viel Wasser kochen|Spülen, bis das Wasser klar ist, in etwa 6 Teilen Wasser auf 1 Teil Reis kochen, dann abgiessen. Senkt den Arsengehalt deutlich, bio oder nicht.\ntremper|Einweichen und spülen|Getrocknete Hülsenfrüchte: über Nacht einweichen, Wasser weggiessen, spülen. Aus der Dose: spülen und abtropfen lassen.\ningr|Die 5-Zutaten-Regel|Auf eine kurze Liste achten. Bio erlaubt nur rund 50 Zusatzstoffe, gegenüber über 300 bei konventioneller Ware, und verbietet synthetische Farbstoffe, künstliche Aromen und Süssstoffe.\nverre|Glas bevorzugen|Gläser verhindern, dass Weichmacher und Bisphenole in fette oder saure Lebensmittel übergehen.\necreme|Mager- oder teilentrahmte Milch|Fettlösliche Rückstände konzentrieren sich im Fett: Konventionelle Magermilch enthält viel weniger davon.\nlabel|Sonst ein anspruchsvolles Label|In der Schweiz begrenzt IP-Suisse gewisse Behandlungen beim Getreide; Schweizer oder europäische Herkunft ist meist strenger geregelt.\ngras|Sichtbares Fett entfernen|Gewisse Schadstoffe (Dioxine, PCB) reichern sich im tierischen Fett an.\npetits|Abwechseln und kleine Fische bevorzugen|Sardine, Makrele, Hering: weniger Quecksilber als grosse Raubfische (Thunfisch, Schwertfisch).\norigine|Auf die Herkunft achten|Schweizer oder europäische Produktion unterliegt strengeren Regeln bei Pestiziden und Antibiotika.\nsulfites|Möglichst ungeschwefelt|Auf „ungeschwefelt“ achten: Die Farbe ist dunkler, das ist normal.\nmonder|Blanchierte wählen|Die braune Haut konzentriert Rückstände: blanchierte (geschälte) Mandeln oder Haselnüsse enthalten deutlich weniger.\nstock|Gut auswählen und lagern|Fleckige, bröselige, bittere oder ranzige Nüsse meiden (Risiko von Schimmel und Aflatoxinen, bio oder nicht). Luftdichte Verpackungen dem Offenverkauf vorziehen.\nvinlabel|Das Label wählen|Bio (Knospe Bio Suisse, EU-Bio-Blatt): keine synthetischen Pestizide, begrenzte Zusatzstoffe. Biodynamisch (Demeter): noch strengere Regeln. Naturwein: Bio-Trauben, keine Zusatzstoffe, sehr wenig Sulfite.\nvinsulf|Auf die Sulfite achten|Höchstwerte für einen trockenen Rotwein: 150 mg/l konventionell, 100 bio, etwa 70 biodynamisch (Demeter), unter 30 bei zertifiziertem Naturwein. Weissweine enthalten meist mehr.\nvincouleur|Rot oder weiss|Rotwein maischt lange mit den Schalen, wo die Rückstände sitzen; Weisswein wird schnell gepresst, erhält aber mehr Sulfite.","guide":["Erst kurz vor dem Essen oder Kochen waschen: Gewaschenes Obst verdirbt beim Lagern schneller.","Fliessendes Wasser und Reiben sind die Basis. Ein Natronbad (etwa 10 g pro Liter, 12–15 Minuten, dann abspülen) entfernt mehr Oberflächenrückstände.","Niemals Seife, Spülmittel oder Javelwasser: Sie dringen in die Lebensmittel ein. Essig bringt nicht mehr als Natron.","Auch waschen, was man schält (Melone, Avocado, Zitrusfrüchte): Das Messer trägt Rückstände von der Schale ins Fruchtfleisch.","Waschen wirkt nur an der Oberfläche. Sogenannte systemische Pestizide stecken im Fruchtfleisch: Nur Bio vermeidet sie.","Obst, Gemüse und Herkunft variieren, um die Belastung durch ein einzelnes Produkt zu begrenzen.","Verarbeitete Produkte (Teigwaren, Guetzli, Getreideflocken) kann man nicht waschen: Die Wahl fällt beim Einkauf. Vollkorn konzentriert mehr Rückstände als Weissmehlprodukte.","Bio heisst nicht gesund: Bio-Chips, -Guetzli oder -Aufstriche enthalten gleich viel Zucker, Salz und Fett. Besser seltener essen.","Glas statt beschichteter Dosen und erhitzter Plastikschalen bevorzugen, besonders bei fetten oder sauren Lebensmitteln.","Tierische Produkte: Rückstände binden sich ans Fett. Mageres Fleisch und Magermilch aus konventioneller Produktion sind weniger problematisch als Butter, fetter Käse oder Wurstwaren.","Eine gut gewaschene konventionelle Frucht ist viel besser für die Gesundheit als gar keine."],"foot":"Richtwerte, gestützt auf veröffentlichte Analysen von Pestizidrückständen (insbesondere die jährliche Rangliste der Environmental Working Group, basierend auf US-Daten) und europäische Kontrollen. Rückstände variieren je nach Herkunft, Saison und Produzent und liegen meist unter den gesetzlichen Grenzwerten. Regional und saisonal einkaufen reduziert auch gewisse Nachernte-Behandlungen. In der Schweiz gehört das Label Bio Suisse (Knospe) zu den anspruchsvollsten.","items":"Erdbeere|Gehört zu den am häufigsten belasteten Früchten, mit mehreren Rückständen pro Probe. Dünne Haut, die sich nicht schälen lässt.|Vor dem Entfernen des Stiels waschen, sonst dringt Wasser in die Frucht. Sie sind empfindlich: 2–3 Minuten im Bad genügen.|\nTrauben|Die Rebe gehört zu den am stärksten behandelten Kulturen, und Trauben isst man mit der Schale.|Beeren vor dem Bad von der Rispe lösen, damit das Wasser überall hinkommt.|\nPfirsich und Nektarine|Empfindliche, stark behandelte Frucht; die pelzige Pfirsichhaut hält Rückstände fest.|Ist er nicht bio, bleibt Schälen die wirksamste Methode.|\nApfel|Eine der Früchte mit den meisten Behandlungen pro Saison im konventionellen Obstbau.|Das Natronbad von 12–15 Minuten ist die am besten untersuchte Methode beim Apfel. Bereits ins Fruchtfleisch eingedrungene Rückstände bleiben.|\nBirne|Häufige Rückstände, vergleichbar mit dem Apfel.|Gleiche Methode wie beim Apfel.|\nKirsche|Häufige Rückstände; wird ganz mit der Haut gegessen.|Den Stiel beim Waschen dran lassen, damit kein Wasser in die Frucht dringt.|\nHeidelbeere|Kleine Beeren mit dünner Haut, ganz gegessen; regelmässige Rückstände.|Tiefgekühlte Bio-Heidelbeeren sind oft günstiger als frische.|\nHimbeere|Keine schützende Haut und schwammiges Fruchtfleisch, das Fungizide aufnimmt.|Nicht einweichen: Sie saugen sich mit Wasser voll und zerfallen.|\nBrombeere|Keine schützende Haut, schwammiges Fruchtfleisch, ganz gegessen.|Wilde Brombeeren, abseits von Strassen gepflückt, sind eine ausgezeichnete Wahl.|\nJohannisbeere (rot und schwarz)|Kleine Beeren, ganz gegessen, regelmässige Rückstände.|Erst nach dem Waschen abzupfen, nicht vorher.|\nAprikose|Steinobst, oft behandelt, Haut wird mitgegessen.|Gleiche Logik wie beim Pfirsich, mit etwas weniger Rückständen im Schnitt.|\nPflaume und Zwetschge|Wird bis kurz vor der Ernte gegen Schadinsekten behandelt und mit der Haut gegessen.|Der weisse Belag auf der Haut ist natürlich und kein Rückstand.|\nRhabarber|Exponierte Stiele, mässige Rückstände.|Das Abziehen der Fasern entfernt auch einen Grossteil der Rückstände.|\nZitrone und Limette|Das Fruchtfleisch ist kaum exponiert, die Schale wird aber oft nach der Ernte mit Fungiziden und Wachs behandelt.|Für Zesten: bio oder „nach der Ernte unbehandelt“. Nur für Saft passt auch konventionell.|Zitrusfrüchte\nOrange, Clementine, Grapefruit|Schale nach der Ernte behandelt (Fungizide, Wachs), Fruchtfleisch kaum exponiert.|Nach dem Schälen die Hände waschen, besonders bevor man Kindern Schnitze gibt.|Zitrusfrüchte Mandarine\nBanane|Dicke Schale wird entfernt; das Fruchtfleisch ist kaum exponiert.|Hier geht es bei Bio vor allem um Umwelt und die Arbeitenden auf den Plantagen.|\nAvocado|Dicke Schale wird nicht gegessen; eine der am wenigsten belasteten Früchte.|Trotzdem vor dem Schneiden abspülen: Das Messer trägt Rückstände ins Fruchtfleisch.|\nAnanas|Dicke Schale wird entfernt; das Fruchtfleisch ist kaum exponiert.|Die Schale vor dem Aufschneiden abspülen.|\nMango|Dicke Schale wird nicht gegessen.|Der Umwelt zuliebe per Schiff statt per Flugzeug transportierte Mangos wählen.|\nKiwi|Wenig Rückstände; die Haut wird meist entfernt.|Wenn Sie die Haut essen, vorher abbürsten.|\nMelone|Dicke Schale; das Fruchtfleisch ist kaum exponiert.|Schale vor dem Schneiden waschen: Das Messer geht durch die Oberfläche.|\nWassermelone|Dicke Schale; gehört zu den am wenigsten belasteten Früchten.|Gleiche Vorsicht wie bei der Melone.|\nFrische Feige|Meist wenig behandelt.|Empfindlich: erst kurz vor dem Essen waschen.|\nGranatapfel|Dicke Schale wird nicht gegessen.|In einer Schüssel Wasser entkernen: Die Kerne sinken, die Haut schwimmt.|\nLitschi und Papaya|Haut wird nicht gegessen, wenig Rückstände im Fruchtfleisch.|Vor dem Öffnen abspülen.|\nSpinat|Grosse Blätter, stark Behandlungen ausgesetzt; häufige, mehrfache Rückstände.|Tiefgekühlter Bio-Spinat ist eine günstige Alternative.|\nFederkohl (Grünkohl)|Krause Blätter halten Rückstände fest; oft mehrere Pestizide nachgewiesen.|Die dicken Mittelrippen entfernen, sie sind schwerer zu reinigen.|Kale\nPeperoni und Chili|Häufige Rückstände, besonders bei Importware ausserhalb der Saison.|Im Ofen geröstet und geschält verlieren sie den Grossteil ihrer Haut.|Paprika\nGrüne Bohnen|Häufige Rückstände, teils mehrere Stoffe pro Probe.|Kochen zerstört Pestizide nicht: vor dem Rüsten waschen.|\nStangensellerie|Seine gerillten Stangen leiten und halten das Spritzwasser; wird oft roh gegessen.|Die äusseren Fäden und den Strunk entfernen, sie sind stärker belastet.|Staudensellerie\nTomate|Regelmässige Rückstände, aber glatte Haut, die sich gut waschen lässt.|Saisonal und aus Freilandanbau ist sie meist weniger behandelt.|\nBlattsalat|Maximale Blattfläche für Spritzungen, besonders bei Gewächshaussalat im Winter.|Eine Salatschleuder hilft, gründlich zu spülen, ohne die Blätter zu beschädigen.|Kopfsalat Salat\nRucola und Nüsslisalat|Stark exponierte junge Blätter, roh gegessen.|Auch „verzehrfertig“ schadet ein Abspülen nicht.|Feldsalat\nGurke|Rückstände bleiben in der Schale; geschält ist das Fruchtfleisch unbedenklich.|Geschält ist eine konventionelle Gurke völlig in Ordnung.|\nZucchetti|Rückstände in der dünnen Schale, die man meist mitisst.|Geschält oder nach einem Natronbad ist eine konventionelle Zucchetti in Ordnung.|Zucchini\nAubergine|Rückstände in der Schale; geschält ist das Fruchtfleisch unbedenklich.|Gegrillt lässt sie sich leicht schälen.|\nRadieschen|Wurzel mit Erdko
